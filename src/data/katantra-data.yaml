- prakaranaId: "sandhi"
  prakaranaNameDevanagari: "सन्धि-प्रकरणम्"
  padas:
    - padaId: "1-1"
      padaNo: "1.1"
      padaNameDevanagari: "संज्ञापादः"
      sutras:
        - sutraNo: "1.1.1"
          textDevanagari: "सिद्धो वर्णसमाम्नायः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "वर्णानाम् अकारादीनां वर्णानां यः समाम्नायः क्रमेण पाठः सः सिद्धः प्रसिद्धः लोके इति किं तेनोपदिष्टेन आविद्वदङ्गनागोपालबालपर्यन्तं यावत्।\nवर्णाः ४९–\nअआ इई उऊ ऋॠ ऌॡ एऐ ओऔ अं अः\nकखगघङ चछजझञ टठडढण तथदधन पफबभम यरलव शषसह।\nवर्णसंज्ञया क्व प्रयोजनम्? सर्वत्र।"
        - sutraNo: "1.1.2"
          textDevanagari: "तत्र चतुर्दशादौ स्वराः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तत्र प्रसिद्धे वर्णसमाम्नाये आदौ ये चतुर्दश वर्णाः ते स्वरसंज्ञा भवन्ति।\nस्वराः १४–\nअआ इई उऊ ऋॠ ऌॡ एऐ ओऔ\nस्वरसंज्ञया क्व प्रयोजनम्? रो रे लोपं स्वरश्च पूर्वो दीर्घ इत्यादिषु।"
        - sutraNo: "1.1.3"
          textDevanagari: "दश समानाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तत्र प्रसिद्धे वर्णसमाम्नाये आदौ ये दशवर्णाः ते समानसंज्ञा भवन्ति।\nसमानाः १०–\nअआ इई उऊ ऋॠ ऌॡ\nसमानसंज्ञया क्व प्रयोजनम्? समानः सवर्णे दीर्घीभवति परश्चलोपमित्यादिषु।"
        - sutraNo: "1.1.4"
          textDevanagari: "तेषां द्वौ द्वावन्योऽन्यस्य सवर्णौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तेषां दशानां समानानां मध्यात् यौ द्वौ द्वौ वर्णौ तौ अन्योऽन्यस्य परस्परं सवर्णसंज्ञौ भवतः।\nसवर्णाः १०–\nअआ इई उऊ ऋॠ ऌॡ\nकः कस्य सवर्णः? अकास्य आकारः सवर्णः। आकारस्य अकारः सवर्णः। उकारस्य ऊकारः सवर्णः। ऊकारस्य उकारः सवर्णः। ऋकारस्य ॠकारः सवर्णः। ॠकारस्य ऋकारः सवर्णः। ऌकारस्य ॡकारः सवर्णः। ॡकारस्य ऌकारः सवर्णः।\nसवर्णसंज्ञया क्व प्रयोजनम्? समानः सवर्णे दीर्घीभवति परश्चलोपमित्यादिषु।"
        - sutraNo: "1.1.5"
          textDevanagari: "पूर्वो ह्रस्वः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तयोः द्वयोर् द्वयोः सवर्णयोः यो यः पूर्वो वर्णः स ह्रस्वसंज्ञो भवति।\nह्रस्वाः ५ – अइउऋऌ।\nह्रस्वसंज्ञया क्व प्रयोजनम्? ह्रस्वो स्वार्थानामित्यादिषु।"
        - sutraNo: "1.1.6"
          textDevanagari: "पूर्वस्य लघुसंज्ञापि वक्तव्या"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "लघवः ५ – अइउऋऌ।\nलघुसंज्ञया क्व प्रयोजनम्? नामिनश्चापधायालघोरित्यादिषु।"
        - sutraNo: "1.1.7"
          textDevanagari: "परो दीर्घः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तयोः द्वयोर् द्वयोः सवर्णयोः यो यः परः स दीर्घसंज्ञो भवति।\nदीर्घाः ५ – आईऊॠॡ।\nदीर्घसंज्ञया क्व प्रयोजनम्? दीर्घमामिसनावित्यादिषु।"
        - sutraNo: "1.1.8"
          textDevanagari: "परस्य गुरुसंज्ञापि वक्तव्या"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "गुरवः ५ - आईऊॠॡ।\nगुरुसंज्ञया क्व प्रयोजनं गरोश्चनिष्टायां सेट इत्यादिषु।"
        - sutraNo: "1.1.9"
          textDevanagari: "स्वरो ऽवर्णवर्जो नामी"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अवर्णः अकाराकारौ तौ वर्जयित्वा शिष्टः स्वरः नामिसंज्ञो भवति।\nनामिनः १२ – इई उऊ ऋॠ ऌॡ एऐ ओऔ।\nनामिसंज्ञया क्व प्रयोजनम्? नामिनः स्वरे इत्यादिषु।"
        - sutraNo: "1.1.10"
          textDevanagari: "एकारादीनि सन्ध्यक्षराणि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "एकारादीनि वर्णानि सन्ध्यक्षरसंज्ञा भवन्ति।\nसन्ध्यक्षराणि ४ – एऐओऔ।\nसन्ध्यक्षसंज्ञया क्व प्रयोजनम्? सन्ध्यक्षरान्तानाम् आकारो विकरण इत्यादिषु।"
        - sutraNo: "1.1.11"
          textDevanagari: "कादीनि व्यञ्जनानि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ककारादीनि वर्णानि व्यञ्जनसंज्ञानि भवन्ति।\nव्यञ्जनानि ३३ – कखगघङ चछजझञ टठडढण तथदधन पफबभम यरलव शषसह।\nव्यञ्जनसंज्ञया क्व प्रयोजनं मोऽनुस्वारं व्यञ्जन इत्यादिषु।"
        - sutraNo: "1.1.12"
          textDevanagari: "ते वर्गाः पञ्चपञ्चशः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ते कादयो वर्णाः पञ्चपञ्चशः पञ्चपञ्चाक्षराणि भूत्वा वर्गा उच्यन्ते।\nवर्गाः ५ – कचटतप।\nवर्ग्याः २५ –\nकवर्गः - कखगघङ\nचवर्गः - चछजझञ\nटवर्गः - टठडढण\nतवर्गः - तथदधन\nपवर्गः - पफबभम।\nवर्गसंज्ञया क्व प्रयोजनम्? वर्ग्ये तद्वर्गपञ्चमं वेत्यादिषु।"
        - sutraNo: "1.1.13"
          textDevanagari: "वर्गाणां प्रथमद्वितीयाः शषसाश्चाघोषाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "वर्गाणां ये प्रथमद्वितीयावर्णाः तथा शषसाश्च ते अघोषसंज्ञा भवन्ति।\nअघोषाः १३ – कख चछ टठ तथ पफ शषस।\nअघोषसंज्ञया क्व प्रयोजनम्? अघोषे प्रथम इत्यादिषु।।"
        - sutraNo: "1.1.14"
          textDevanagari: "घोषवन्तोऽन्ये"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अघोषेभ्यः येऽन्ये वर्णास् ते घोषवत्संज्ञा भवन्ति।\nघोषवन्तः २० – गघङ जझञ डढण दधन बभम यरलवह।\nघोषवत्संज्ञया क्व प्रयोजनम्? अकारो दीर्घं घोषवतीत्यादिषु।।"
        - sutraNo: "1.1.15"
          textDevanagari: "अनुनासिका ङञणनमाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ङञणनमा वर्णाः अनुनासिकसंज्ञा भवन्ति।\nअनुनासिका ५ – ङञणनम।\nअनुनासिकसंज्ञया क्व प्रयोजनम्? अतोन्तोनुस्वारोनुनासिकान्तस्येत्यादिषु।।"
        - sutraNo: "1.1.16"
          textDevanagari: "अन्तःस्था यरलवाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यरलवा वर्णाः अन्तस्थसंज्ञा भवन्ति।\nअन्तःस्थाः ४ – यरलव।\nअन्तःस्थसंज्ञया क्व प्रयोजनम्? स परस्वरायासंप्रसारणमन्तःस्थाया इत्यादिषु।।"
        - sutraNo: "1.1.17"
          textDevanagari: "ऊष्माणः शषसहाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "शषसह वर्णा ऊष्मसंज्ञा भवन्ति।\nऊष्माणः – ४ शषसह।\nऊष्मसंज्ञायाः प्रयोजनं नास्तीत्यपार्थकोयं योगारम्भ इत्याहुः।"
        - sutraNo: "1.1.18"
          textDevanagari: "अः इति वसर्जनीयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारात्परं बिन्दुद्वयं विसर्जनीयसंज्ञं भवति।\nविसर्जनीयसंज्ञया क्व प्रयोजनम्? विसर्जनीयश्छेछोवाशमित्यादिषु।।"
        - sutraNo: "1.1.19"
          textDevanagari: "ᳳक इति जिह्वामूलीयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ककारात् पूर्वोवर्णः जिह्वामूलीयसंज्ञोभवति। जिह्वामूलीयः कीदृशः? यवाकृतिसदृशः।\nजिह्वामूलीयसंज्ञया क्व प्रयोजनम्? कखयो जिह्वामूलीयं नवेत्यादिषु।।"
        - sutraNo: "1.1.20"
          textDevanagari: "ᳲप इत्युपध्मानीयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "पकारात्पूर्वो वर्णः उपध्मानीयसंज्ञो भवति। उपध्मानीयः कीदृशः हस्तिकवाटसदृशः।\nउपध्मानीयसंज्ञया क्व प्रयोजनम्? पफयोरुपध्मानीयं नवेत्यादिषु।।"
        - sutraNo: "1.1.21"
          textDevanagari: "अं इत्यनुस्वारः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अं इत्यत्रयोबिन्दुः सोsनुस्वारसंज्ञो भवति।\nअनुस्वारसंज्ञया क्व प्रयोजनम्? मोनुस्वारं व्यञ्जने इत्यादिषु।।"
        - sutraNo: "1.1.22"
          textDevanagari: "पूर्वपरयोर् अर्थोपलब्धौ पदम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "पूर्वस्य लिङ्गस्य परस्य स्यादेः तथा पूर्वस्य धातोः परस्य त्यादेः यः समुदाय एकीभावः तस्य पदमिति संज्ञा भवति अर्थोपलब्धौ सत्याम्।\nपदसंज्ञया क्व प्रयोजनं? युष्मदस्मदोः पदं पदात् षष्ठीचतुर्थीद्वितीयासु वस्रसावित्यादिषु।।"
        - sutraNo: "1.1.23"
          textDevanagari: "अनतिक्रमयन् विश्लेषयेत्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "वर्णानाम् एकत्र युक्तानाम् अतिक्रमं विपर्यासं अकुर्वन् विश्लेषयेत्। येनैव क्रमेण वर्णाः संयुज्यन्ते तेनैव क्रमेण वर्णा विश्लिष्यन्ते इति परिभाष्यते। अनियमे नियमः परिभाषा।"
        - sutraNo: "1.1.24"
          textDevanagari: "व्यञ्जनम् अस्वरं परं वर्णं नयेत्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "व्यञ्जनं यत् अस्वरं स्वररहितं तत् परं वर्णं नयेत् प्रापयेत्। त्वमत्र। सत्कर्म। अहमिह।"
        - sutraNo: "1.1.25"
          textDevanagari: "लोकोपचाराद् ग्रहणसिद्धिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "लोकोपचारात् जनव्यवहारात् पूर्वाचार्यशास्त्रात् अनुक्तस्य ग्रहणस्य कार्यस्य सिद्धिर् निष्पत्तिः भवति। ये लुग्लोपप्लतादयः ये इह शास्त्रे अनुक्ताः ते अन्यशास्त्राद् अनुसारणीयाः।\n\nइति लघुवृत्तौ सन्धि प्रकणे संज्ञापादः प्रथमः॥१॥"
    - padaId: "1-2"
      padaNo: "1.2"
      padaNameDevanagari: "समानपादः"
      sutras:
        - sutraNo: "1.2.1"
          textDevanagari: "समानः सवर्णे दीर्घीभवति परश्च लोपम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "समानवर्णः सवर्णे परे दीर्घवान् भवति परश् वर्णः लोपम् आपद्यते। माषाढकम् दधीहते मधूहनं होतॄषिः गमॣकारः।"
        - sutraNo: "1.2.2"
          textDevanagari: "अवर्ण इवर्णे ए"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अवर्णः अकाराकारौ इवर्णे इकारे ईकारे च परे एकारो भवति परलोपश्च।\nतवेदं सेयम् उमेहते।।"
        - sutraNo: "1.2.3"
          textDevanagari: "उवर्णे ओ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अवर्णः अकाराकारौ उवर्णे उकारे ऊकारे च परे ओकारो भवति परलोपश्च। तवोदकं गङ्गोदकम् उमोहते।।"
        - sutraNo: "1.2.4"
          textDevanagari: "ऋवर्णे अर्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अवर्णः अकाराकारौ ऋवर्णे ऋकारे ॠकारे च परे अर् भवति परलोपश्च।\nतवर्णम् सर्द्धिः तवर्कारः।"
        - sutraNo: "1.2.5"
          textDevanagari: "ऌवर्णे अल्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अवर्णः अकाराकारौ ऌकारे ॡकारे च परे अल् भवति परलोपश्च। तवल्कारः। खट्वल्कारः।"
        - sutraNo: "1.2.6"
          textDevanagari: "एकारे ऐ ऐकारे च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अवर्णः अकाराकारौ एकारे ऐकारे च परे ऐकारो भवति परलोपश्च।\nतवैडिका खट्वैतिकायनम् उमैषा।"
        - sutraNo: "1.2.7"
          textDevanagari: "ओकारे औ औकारे च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अवर्णः अकाराकारौ ओकारे औकारे च परे औकारो भवति परलोपश्च।\nतवौदनः खट्वौपगवः।"
        - sutraNo: "1.2.8"
          textDevanagari: "इवर्णो यम् असवर्णे न च परलोपः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "इवर्णः इकारईकारौ असवर्णे स्वरे परे यत्वमापद्यते परश्च वर्णो लोपं नापद्यते। दध्यत्र नद्येषा।।"
        - sutraNo: "1.2.9"
          textDevanagari: "वम् उवर्णः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "उवर्णः उकारऊकारौ असवर्णे स्वरे परे वत्वम् आपद्यते परश्च वर्णो लोपं नापद्यते। मध्वत्र। वध्वाख्या।"
        - sutraNo: "1.2.10"
          textDevanagari: "रमृवर्णः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ऋवर्णः ऋकारऋकारौ असवर्णे स्वरे परे रत्वम् आपद्यते परश्च वर्णो लोपं नापद्यते। पित्रर्थः मात्रर्थः राकृतिः।"
        - sutraNo: "1.2.11"
          textDevanagari: "लमॢवर्णः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ऌवर्णः ऌकारॡकारौ असवर्णे स्वरे परे लत्वम् आपद्यते परश्च लोपं नापद्यते। लनुबन्धः लाकृतिः।"
        - sutraNo: "1.2.12"
          textDevanagari: "ए अय्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "एकारः अय् भवति स्वरे परे।\nअग्नयः बुद्धयः।"
        - sutraNo: "1.2.13"
          textDevanagari: "ऐ आय्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ऐकारः आय् भवति स्वरे परे।\nरायौ रायः।"
        - sutraNo: "1.2.14"
          textDevanagari: "ओ अव्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ओकारः अव् भवति स्वरे परे।\nधेनवः पटवः।"
        - sutraNo: "1.2.15"
          textDevanagari: "औ आव्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "औकारः आव् भवति स्वरे परे।\nनावौ नावः।"
        - sutraNo: "1.2.16"
          textDevanagari: "अयादीनां यवलोपः पदान्ते न वा लोपे तु प्रकृतिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अय् आय् अव् आव् एते अयादयः एषाम् अयादीनां पदान्ते स्थितानां यौ यकारवकारौ तयोर्लोपो भवति विकल्पेन। लोपे तु कृते सति प्रकृतिः यथास्वरूपं भवति पुनः सन्धिकार्यं न प्राप्नोतीत्यर्थः।\nक आसते वा कयासते। कस्मा इदं वा कस्मायिदं। इन्द इति वा इन्दविति। असा इह वा असाविह।"
        - sutraNo: "1.2.17"
          textDevanagari: "एदोत्परः पदान्ते लोपमकारः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "पदान्ते स्थितौ यौ एदोतौ ताभ्यां परः अकारः लोपम् प्राप्नोति।\nअग्रेऽत्र वायोऽत्र।।"
        - sutraNo: "1.2.18"
          textDevanagari: "न व्यञ्जने स्वराः सन्धेयाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "व्यञ्जने परे स्वराः सन्धेयाः सन्धातव्या न भवन्ति।\nदण्डहस्तः दधिशीतम् मधुभाजनम् गौरीगृहम् मातृमण्डलम्।\n\nइति लघुवृत्तौसन्धिप्रकरणे समानपादो द्वितीयः॥२॥"
    - padaId: "1-3"
      padaNo: "1.3"
      padaNameDevanagari: "ओदन्तपादः"
      sutras:
        - sutraNo: "1.3.1"
          textDevanagari: "ओदन्ता अइउआनिपाताः स्वरे प्रकृत्या"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ओदन्ता ओकारान्ता ये निपाताः तथा अइउआश्च स्वरे परे प्रकृत्या भवन्ति सन्धिकृतां विकृतिं नापद्यन्ते इत्यर्थः।\nनो अत्र। अहो आश्चर्यम्। अ अपेहि। इ इन्द्रं पश्य। उ उत्तिष्ठ। आ एवं नु मन्यसे। आ एवं नु किल तत्।"
        - sutraNo: "1.3.2"
          textDevanagari: "द्विवचनमनौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अनौ औकाररहितं द्विवचनं प्रकृत्या भवति स्वरे परे।\nअग्री अत्र। वायू इह। शाले अत्र। आले आनय। पचेते इह।\nअनौ इति किम्? वृक्षावत्र।"
        - sutraNo: "1.3.3"
          textDevanagari: "बहुवचनमी"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अमी इत्येतद् बहुवचनं प्रकृत्या भवति स्वरे परे।\nअमी आश्वाः। अमी आदित्याः।\nबहुवचनमिति किम् अम्यत्र।"
        - sutraNo: "1.3.4"
          textDevanagari: "अनुपदिष्टाश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "इह शास्त्रे ये अनुपदिष्टाः अनुक्ताः प्लुतास्ते स्वरे परे प्रकृत्या भवतन्ति।\nदेवदत्ता३ इह। जज्ञदत्ता३ उत्तिष्ठ।\nएकमात्रो भवेद् ह्रस्वो द्विमात्रो दीर्घ उच्यते।\nत्रिमात्रस्तु प्लुतो ज्ञेयो व्यञ्जनं त्वर्धमात्रकम्॥\n\nइति लघुवृत्तौ सन्धिप्रकरणे ओदन्तपादस् तृतीयः॥३॥"
    - padaId: "1-4"
      padaNo: "1.4"
      padaNameDevanagari: "वर्गपादः"
      sutras:
        - sutraNo: "1.4.1"
          textDevanagari: "वर्गप्रथमाः पदान्ताः स्वरघोषवत्सु तृतीयान्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "वर्णाणां ये प्रथमाः कचटतपाः पदान्ताः पदस्यान्तभूताः ते स्ववर्गात् प्रत्यासत्तेस्तृतीयान् आपद्यन्ते स्वरेषु परेषु घोषवत्सु च।\nवागत्र अजिह षडानय तदिह त्रिष्टुबियं वाग्गतिः अज्गतिः षड्गच्छन्ति तद्गमनम् त्रिष्टुब्गायत्री।।"
        - sutraNo: "1.4.2"
          textDevanagari: "पञ्चमे पञ्चमांस्तृतीयान् वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "वर्गप्रथमाः पदान्ताः स्ववर्गात् पञ्चमे परे पञ्चमान् आपद्यन्ते तृतीयान् वा।\nवाङ्मधुरा वा वाग्मधुरा। अञ्मात्रं वा अज्मात्रम्। षण्नयनं वा षड्नयनम्। तन्नीतिः वा तद्नीतिः। त्रिष्टुम्मिनोति वा त्रिष्टुब्मिनोति।।"
        - sutraNo: "1.4.3"
          textDevanagari: "वर्गप्रथमेभ्यः शकारः स्वरयवरपरश्छकारं न वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "वर्गप्रथमेभ्य पदान्तेभ्यः परः शकारः स्वरपरः यपरः वपरः रेफपरश्च छकारम् आपद्यते नवा विकल्पेन।\nवाक्छूरः वा वाक्शूरः। अच्छ्यामा वा अच्श्यामा। षट्छ्यामा वा षट्श्यामा। तच्छ्वेतं वा तच्श्वेतं। त्रिष्टुप्छ्रूयते वा त्रिष्टुप्श्रूयते।"
        - sutraNo: "1.4.4"
          textDevanagari: "तेभ्य एव हकारः पूर्वचतुर्थं न वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तेभ्यः वर्गप्रथमेभ्यः पदान्तेभ्यः परः हकारः पूर्वस्य वर्णस्य सम्बन्धिनं चतुर्थम् आपद्यते न वा विकल्पेन।\nवाग्घीनः वा वाग्हीनः। अज्झलानि वा अज्हलानि। षड्ढलानि वा षड्हलानि। तद्धितं वा तद्हितम्। त्रिष्टुब्भुतम् वा त्रिष्टुब्हुतम्।।"
        - sutraNo: "1.4.5"
          textDevanagari: "पररूपं तकारो लचटवर्गेषु"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तकारः पदान्तः लकारे चवर्गे टवर्गे च परे पररूपम् आपद्यते। तल्लुनाति। तच्चिनोति। तच्छादयति। तज्जयति। तज्झषति। तञ्ञकारः। तट्टीकते। तट्ठकुरः। उड्डीनः। उड्ढौकते। तण्णकारः।।"
        - sutraNo: "1.4.6"
          textDevanagari: "चं शे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तकारः पदान्तः शे शकारे परे चत्वमापद्यते।\nतच्श्लाघ्यम्। तच्श्मशानम्।"
        - sutraNo: "1.4.7"
          textDevanagari: "ङणना ह्रस्वोपधाः स्वरे द्विः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ङणनाः पदान्ताः ह्रस्वोपधाः स्वरे परे द्विर् भवन्ति।\nउदङ्ङत्र। सुगण्णाह। पचन्निह।"
        - sutraNo: "1.4.8"
          textDevanagari: "नोऽन्तश्चछयोः शकारमनुस्वारपूर्वम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नकारः पदान्तः चछयोः परयोः अनुस्वारपूर्वं शकारम् आपद्यते। भवांश्चिनोति। भवांश्छादयति।"
        - sutraNo: "1.4.9"
          textDevanagari: "टठयोः षकारम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नकारः पदान्तः टठयोः परयोः अनुस्वारपूर्वं षकारम् आपद्यते।\nभवांष्टीकते। भवांष्ठकुरः।"
        - sutraNo: "1.4.10"
          textDevanagari: "तथयोः सकारम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नकारः पदान्तः तथयोः परयोः अनुस्वारपूर्वं सकारम् आपद्यते।\nभवांस्तनोति। भवांस्थुडति।"
        - sutraNo: "1.4.11"
          textDevanagari: "ले लम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नकारः पदान्तः ले लकारे परे अनुस्वारपूर्वं लकारम् आपद्यते। भवांल्लुनाति। भवांल्लिखति।"
        - sutraNo: "1.4.12"
          textDevanagari: "जझञशकारेषु ञकारम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नकारः पदान्तः जकारे झकारे ञकारे शकारे च परे ञकारम् आपद्यते। भवाञ्जयति। भवाञ्झषति। भवाञ्ञकारः। भवाञ्शेते।"
        - sutraNo: "1.4.13"
          textDevanagari: "शि ञ्चं वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नकारः पदान्तः शि शकारे परे ञ्चत्वम् आपद्यते वा विकल्पेन।\nमहाञ्च्छूरः। महाञ्च्शूरः। महाञ्शूरः।"
        - sutraNo: "1.4.14"
          textDevanagari: "डढणपरस्तु णकारम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नकारः पदान्तः डकारे ढकारे णकारे च परे णकारम् आपद्यते।\nमहाण्डीनः। महाण्ढौकते। महाण्णकारः।"
        - sutraNo: "1.4.15"
          textDevanagari: "मोऽनुस्वारं व्यञ्जने"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "मकारः पदान्तः अनुस्वारम् आपद्यते व्यञ्जने परे। त्वं हससि। त्वं रमसे।"
        - sutraNo: "1.4.16"
          textDevanagari: "वर्ग्ये तद्वर्गपञ्चमं वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "मकारः पदान्तः वर्ग्ये वर्गाक्षरे परे तस्य वर्ग्यस्य यः वर्गः तस्य पञ्चमं वा आपद्यते।\nत्वङ्करोषि। त्वंकरोषि। त्वञ्चरसि वा त्वंचरसि। त्वण्टीकसे वा त्वंटीकसे। त्वन्तरसि वा त्वंतरसि। त्वम्पासि वा त्वंपासि।\n\nइति लघुवृत्तौ सन्धिप्रकरणे वर्गपादश् चतुर्थः॥४॥"
    - padaId: "1-5"
      padaNo: "1.5"
      padaNameDevanagari: "विसर्जनीयपादः"
      sutras:
        - sutraNo: "1.5.1"
          textDevanagari: "विसर्जनीयश् चे छे वा शम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विसर्जनीयः पदान्तः चे वा छे वा परे शकारम् आपद्यते। कश्चिनोति। कश्छादयति।"
        - sutraNo: "1.5.2"
          textDevanagari: "टे ढे वा षम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विसर्जनीयः पदान्तः टे वा ढे वा परे षत्वम् आपद्यते। कष्टीकते। कष्ठकुरः।"
        - sutraNo: "1.5.3"
          textDevanagari: "ते थे वा सम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विसर्जनीयः पदान्तः ते वा थे वा परे सत्वम् आपद्यते। कस्तनोति। कस्थुडति।"
        - sutraNo: "1.5.4"
          textDevanagari: "कखयोर् जिह्वामूलीयं न वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विसर्जनीयः पदान्तः कखयोः परयोः जिह्वामूलीयम् आपद्यते न वा विकल्पेन। कᳳकरोति वा कःकरोति। कᳳखनति वा कःखनति।"
        - sutraNo: "1.5.5"
          textDevanagari: "पफयोर् उपध्मानीयं न वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विसर्जनीयः पदान्तः पफयोः परयोः उपध्मानीयम् आपद्यते न वा विकल्पेन। कᳲपाति वा कःपाति। कᳲफलति वा कःफलति।"
        - sutraNo: "1.5.6"
          textDevanagari: "शे षे से वा वा पररूम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विसर्जनीयः पदान्तः शे वा षे वा से वा परे पररूपम् आपद्यते वा विकल्पेन। कश्शेते वा कःशेते। कष्षष्ठः वा कःषष्ठः। कस्साधुः वा कःसाधुः।"
        - sutraNo: "1.5.7"
          textDevanagari: "उम् अकारयोर् मध्ये"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "द्वयोर् अकारयोः मध्ये यः विसर्जनीयः स उत्वम् आपद्यते। कोsर्थः। सोsत्र।"
        - sutraNo: "1.5.8"
          textDevanagari: "अघोषवतोश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारघोषवतोः मध्ये यः विसर्जनीयः स उत्वम् आपद्यते। कोगतः। योधावति।"
        - sutraNo: "1.5.9"
          textDevanagari: "अपरो लोप्यो sन्यस्वरे यं वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारात् परो यो विसर्जनीयः सो sन्यस्मिन्नाकारादौ स्वरे परे लोप्यो लोपनीयो भवति वा विकल्पेन यत्वम् आपद्यते। कआह वा कयाह। सइह वा सयिह। रुद्रउपरि वा रुद्रयुपरि।"
        - sutraNo: "1.5.10"
          textDevanagari: "आभोभ्याम् एवमेव स्वरे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "आकारभोशब्दाभ्यां परो विसर्जनीयः लोप्यो भवति यत्वं वापद्यते सर्वस्मिन् स्वरे परे। देवाआहुः देवायाहुः। भोइदं वा भोयिदम्।"
        - sutraNo: "1.5.11"
          textDevanagari: "घोषवति लोपम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "आकारभोशब्दाभ्यां परो विसर्जनीयः लोपं प्राप्नोति घोषवति परे। देवायान्ति। भोयज।"
        - sutraNo: "1.5.12"
          textDevanagari: "नामिपरो रम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नामिनः परो विसर्जनीयः रत्वं प्राप्नोति। सुपीः। सुतूः।"
        - sutraNo: "1.5.13"
          textDevanagari: "घोषवत्स्वरपरः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नामिनः परो वसर्जनीयः रत्वम् आपद्यते घोषवति स्वरे परे। अग्निर्गतः। अग्रिरत्र। पटुर्गतः। पटुरत्र।"
        - sutraNo: "1.5.14"
          textDevanagari: "रप्रकृतिर् अनामिपरोपि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "रःप्रकृतिः रेफप्रकृतिः रेफस्य स्थाने विहितो यः विसर्जनीयः सः अनामिपरोपि रत्वं प्राप्नोति घोषवति स्वरे परे। अन्तर्गतः। अन्तरत्र।"
        - sutraNo: "1.5.15"
          textDevanagari: "एषसपरो लोप्यो व्यञ्जने"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "एषसशब्दाभ्यां परः विसर्जनीय- लोप्यो भवति व्यञ्जने परे। एषचरति। सचरति। एषददाति। सददाति।"
        - sutraNo: "1.5.16"
          textDevanagari: "न विसर्जनीयलोपे पुनः सन्धिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विसर्जनीयस्य लोपे कृते सति पुनः सन्धिकार्यं प्राप्तं न भवति। कआह। देवाआहुः। भोइदम्।"
        - sutraNo: "1.5.17"
          textDevanagari: "रो रे लोपं स्वरश्च पूर्वो दीर्घः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "रः रेफः रेफेः परे लोपं प्राप्नोति पूर्वः स्वरश्च दीर्घो भवति। अग्रीरक्षति। इन्दूरमते।"
        - sutraNo: "1.5.18"
          textDevanagari: "द्विर्भावं स्वरपरश् छकारः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्वरात् परः छकारः द्विर् भावं द्वित्वं प्राप्नोति। वृक्षच्छाया। देवच्छत्रम्।\n\nइति लघुवृत्तौ सन्धिप्रकरणे विसर्जनीयपादः पञ्चमः॥५॥"
    - padaId: "1-6"
      padaNo: "1.6"
      padaNameDevanagari: "निपातपादः"
      sutras:
        - sutraNo: "1.6.1"
          textDevanagari: "चवाहाहैवनोहंहोउताहोअहोअथोनिपातोsव्ययम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "च वा हा अह एव नो हंहो उता हो अहो अथो एषामेकादशानां चादीनां शब्दानां एकैको निपातसंज्ञो भवति। अव्ययसंज्ञश् च। प्रयोजनं क्व? ओदन्ताअइउअनिपाताः स्वरेप्रकृत्या अव्ययाश्चेत्यादिषु।"
        - sutraNo: "1.6.2"
          textDevanagari: "अन्तः स्वः प्रातः पुनर् अधोsप्यहः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अन्तर् स्वर् प्रातर् पुनर् अधर् अहर् एते अन्तरादयः षट् अव्ययसंज्ञा भवन्ति। अपिशब्दः समुच्चयार्थः। अन्तः रम्यम्। अन्तः तिष्ठति। अन्तरागतः। अन्तःपश्यति।"
        - sutraNo: "1.6.3"
          textDevanagari: "प्रपरानिनिरुद्दुस्संव्यवानुपर्यभ्यधिप्रतिस्वाङत्यप्यपोपोपसर्गाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "प्र परा नि निर् उत् दुर् सं वि अव अनु परि अभि अधि प्रति सु आङ् अति अपि अप उप एते विंशतिरुपसर्गसंज्ञा भवन्ति अव्ययाश्च। प्रयोजनं उपसर्गेरुवइत्यादिषु।"
        - sutraNo: "1.6.4"
          textDevanagari: "अन्वाद्याः कर्मप्रवचनीयाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अनु परि अभि अधि प्रति सु अङ् अति अपि अप उप एते एकादशकर्मप्रवचनीयसंज्ञा भवन्ति। कर्वप्रवचनीयसंज्ञया क्व प्रयोजनम्? कर्म प्रवचनीयैश् चेत्यादिषु वृक्षमन्तविद्योतते विद्त् वृक्षंपरि वृक्षधि।"
        - sutraNo: "1.6.5"
          textDevanagari: "परकार्ये विकार्यादिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "परस्य प्रत्ययस्य कार्ये कर्तव्ये सति आद्योवर्णोविकारीभवति आसीनः।"
        - sutraNo: "1.6.6"
          textDevanagari: "पूर्वकार्येन्त्य इष्यते"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "पूर्वस्य प्रकृतेः कार्ये कर्तव्ये सति अन्त्यो वर्णो विकारी भवति। सः यः।"
        - sutraNo: "1.6.7"
          textDevanagari: "क्वचित्पूर्वपरौसर्वौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "पूर्वपरौ प्रकृतिप्रत्ययौ सर्वौ विकारिणौ भवतः क्वचित् न सर्वत्र। इतः इह।"
        - sutraNo: "1.6.8"
          textDevanagari: "संसार्यंयोगसाधनम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "योगस्य सूत्रवाक्यस्य साधनं पूरणं यत् उपादेयम् तद् अन्यसूत्रेभ्यः संसार्यमनुवत्तनीयम्। यथा जसीत्यस्य योगस्य पूरणं अकारोदीर्घं घोषवतीतिसूत्राद् अनुवर्तते इति परिभाष्यते।\n\nइति लघुवृत्तौ सन्धिप्रकरणे निपातपादः षष्ठः॥६॥\n\nसन्धिप्रकरणंसमाप्तम्॥॥"
- prakaranaId: "nama"
  prakaranaNameDevanagari: "नाम-प्रकरणम्"
  padas:
    - padaId: "2-1"
      padaNo: "2.1"
      padaNameDevanagari: "लिङ्गपादः"
      sutras:
        - sutraNo: "2.1.1"
          textDevanagari: "धातुविभक्तिवर्जम् अर्थवल् लिङ्गम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अर्थवत् सार्थकं शब्दरूपं लिङ्गसंज्ञं भवति धातुविभक्ती वर्जयित्वा। लिङ्गसंज्ञया क्व प्रयोजनम्? लिङ्गान्तनकारस्येत्यादिषु। राजा।"
        - sutraNo: "2.1.2"
          textDevanagari: "तस्मात् परा विभक्तयः।"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सि औ जस्\nअम् औ शम्\nटा भ्याम् भिस्\nङे भ्याम् भ्यस्\nङसि भ्याम् भ्यस्\nङस् ओस् आम्\nङि ओस् सुप्।\n\nतस्मात् लिङ्गात् पराः स्यादयः सप्तविभक्तयो भवन्ति।\n\nसि औ जस् इति प्रथमा।\nअम् औ शस् इति द्वितीया।\nटा भ्याम् भिस् इति तृतीया।\nङे भ्याम् भ्यस् इति चतुर्थी।\nङसि भ्याम् भ्यस् इति पञ्चमी।\nङस् ओस् आम् इति षष्ठी।\nङि ओस् सुप् इति सप्तमी।\nआमन्त्रणे प्रथमैवाष्टमी।\n\nवृक्षः वृक्षौ वृक्षाः।\nवृक्षम् वृक्षौ वृक्षान्।\nवृक्षेण वृक्षाभ्याम् वृक्षैः।\nवृक्षाय वृक्षाभ्याम् वृक्षेभ्यः।\nवृक्षात् वृक्षाभ्याम् वृक्षेभ्यः।\nवृक्षस्य वृक्षयोः वृक्षाणाम्।\nवृक्षे वृक्षयोः वृक्षेषु।\nआमन्त्रणे हे वृक्ष हे वृक्षौ हे वृक्षाः।\n\nविभक्तिसंज्ञया क्व प्रयोजनम्? एषां विभक्तावन्तलोप इत्यादिषु।"
        - sutraNo: "2.1.3"
          textDevanagari: "पञ्चादौ घुट्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्यादीनाम् आदौ ये पञ्चप्रत्ययाः ते घुट् संज्ञा भवन्ति। घुट् ५ – सि औ जस् अम् औ।\nघुट्संज्ञया क्व प्रयोजनम्? घुटिचासम्बुद्धावित्यादिषु।\nराजा राजानौ राजानः राजानं राजानौ पञ्चेति। किं राज्ञः पश्य।"
        - sutraNo: "2.1.4"
          textDevanagari: "जस्शसौ नपुंसके"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नपुंसकलिङ्गे जस् शस् इत्येतौ घुट्संज्ञौ भवतः। घुट् २ – जस् शस्।\nघुट्संज्ञया क्व प्रयोजनम्? घुटिचासस्बुद्धावित्यादिषु।\nसामानि रम्याणि। सामानि पठन्ति।"
        - sutraNo: "2.1.5"
          textDevanagari: "आमन्त्रिते सिः सम्बुद्धिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "आमन्त्रितम् आह्वानम् आमन्त्रितेsर्थे यः सिप्रत्ययः स सम्बुद्धिसंज्ञो भवति।\nसम्बुद्धिसंज्ञया क्व प्रयोजनम्? सम्बुद्धौ चेत्यादिषु।\nहे गङ्गे। हे यमुने।"
        - sutraNo: "2.1.6"
          textDevanagari: "आगम उदनुबन्धः स्वराद् अन्त्यात् परः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "उदनुबन्धः उकारानुबन्धः आगमः अन्त्यात् स्वरात् परो भवति। अनड्वान्।"
        - sutraNo: "2.1.7"
          textDevanagari: "तृतीयादौ तु परादिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "उदनुबन्धः आगमः तृतीयादौ विभक्तिगणे परे परस्य प्रत्ययस्यादिर् अवयवो भवति सर्वेषाम्।"
        - sutraNo: "2.1.8"
          textDevanagari: "इदुदग्निः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "इकारान्तः शब्दः उकारान्तः शब्दश्च अग्निसंज्ञो भवति।\nअग्निसंज्ञया क्व प्रयोजनम्? अग्नेरमोकार इत्यादुषु।\nअग्निं। पटुं। बुद्धिं। धेनुम्।"
        - sutraNo: "2.1.9"
          textDevanagari: "ईदूत् स्त्र्याख्यौ नदी"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ईकारान्तः ऊकारान्तश्च शब्दः स्त्र्याख्यौ स्त्रीवाचकौ नदीसंज्ञौ भवतः।\nनदीसंज्ञया क्व प्रयोजनम्? नद्याऐआसासामित्यादिषु।\nनद्यै। नद्याः। नद्याः। नद्यां। वध्वै। वध्वाः। वध्वाः। वध्वाम्।"
        - sutraNo: "2.1.10"
          textDevanagari: "आ श्रद्धा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "आकारान्तः शब्दः स्त्रीवाचकः श्रद्धासंज्ञो भवति।\nश्रद्धासंज्ञया क्व प्रयोजनम्? श्रद्धायाः सिलोपमित्यादिषु।\nगङ्गा। या। सा। का।"
        - sutraNo: "2.1.11"
          textDevanagari: "अन्त्यात् पूर्व उपधा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अन्त्याद् वर्णात् पूर्वो वर्ण उपधासंज्ञो भवति।\nउपधासंज्ञया क्व प्रयोजनम्? नान्तस्य चोपधाया इत्यादिषु।\nपञ्चानाम्। सप्तानाम्। दशानाम्।"
        - sutraNo: "2.1.12"
          textDevanagari: "व्यञ्जनान्नोनुषङ्गः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अन्त्याद् व्यञ्जनात् पूर्वो नकारः अनुषङ्गसंज्ञो भवति।\nअनुषङ्गसंज्ञया क्व प्रयोजनम्? अनुषङ्गश्चाकुञ्चेरित्यादिषु।\nविदुषः। महतः।"
        - sutraNo: "2.1.13"
          textDevanagari: "धुड् व्यञ्जनम् अनन्तस्थानुनासिकम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "व्यञ्जनम् धुट्संज्ञं भवति अन्तःस्थानुनासिकान्वर्जयित्वा।\nधुट् २४ – कखगघ चछजझ टठडढ तथदध पफबभ शषसह।\nधुट्संज्ञया क्व प्रयोजनम्? अटान्तृतीयइत्यादिषु।\nअग्निमध्यां विरुद्धिः।"
        - sutraNo: "2.1.14"
          textDevanagari: "अकारो दीर्घं घोषवति"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारः लिङ्गान्तः दीर्घं प्राप्नोति घोषवदादौ विभक्तिगणे परे।\nवृक्षाय। देवाभ्याम्।"
        - sutraNo: "2.1.15"
          textDevanagari: "जसि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारः लिङ्गान्तः दीर्घं प्राप्नोति जसि परे।\nवृक्षाः। देवाः।"
        - sutraNo: "2.1.16"
          textDevanagari: "शसि सस्य च नः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारो लिङ्गान्तः दीर्घं प्राप्नोति शसि परे शसश्च सकारस्य नत्वं भवति।\nवृक्षान्। देवान्।"
        - sutraNo: "2.1.17"
          textDevanagari: "अकारे लोपम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारो लिङ्गान्तः लोपं प्राप्नोति विभक्तिसम्बन्धिन्यकारे परे।\nवृक्षम्। देवम्।"
        - sutraNo: "2.1.18"
          textDevanagari: "भिस् ऐस् वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकाराल् लिङ्गान्तात् परो भिस्प्रत्ययः ऐसादेशं प्राप्नोति।\nवृक्षैः देवैः।"
        - sutraNo: "2.1.19"
          textDevanagari: "धुटि बहुत्वे त्वे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारो लिङ्गान्तः एत्वं प्राप्नोति बहुत्वे उत्पन्ने धुटि परे।\nवृक्षेभ्यः। देवेषु।"
        - sutraNo: "2.1.20"
          textDevanagari: "ओसि च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारो लिङ्गान्तः एत्वं प्राप्नोति ओसि परे।\nवृक्षयोः। देवयोः।"
        - sutraNo: "2.1.21"
          textDevanagari: "ङसिर् आत्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्ताल् लिङ्गात् परो ङसिप्रत्ययः आदादेशं प्राप्नोति।\nवृक्षात्। देवात्।"
        - sutraNo: "2.1.22"
          textDevanagari: "ङस् स्य"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्ताल् लिङ्गात् परः ङस्प्रत्ययः स्य संपद्यते।\nवृक्षस्य। देवस्य।"
        - sutraNo: "2.1.23"
          textDevanagari: "इन टा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्ताल् लिङ्गात् परः टाप्रत्ययः इनादेशं प्राप्नोति।\nवृक्षेण। देवेन।"
        - sutraNo: "2.1.24"
          textDevanagari: "ङेर् यः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्ताल् लिङ्गात् परः ङेप्रत्ययः यादेशं प्राप्नोति।\nवृक्षाय। देवाय।"
        - sutraNo: "2.1.25"
          textDevanagari: "स्मै सर्वनाम्नः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तात् सर्वनाम्नः परः ङेप्रत्ययः स्मैआदेशं प्राप्नोति।\nसर्वस्मै। विश्वस्मै। यस्मै। तस्मै। कस्मै। अमुष्मै। अस्मै।"
        - sutraNo: "2.1.26"
          textDevanagari: "ङसिः स्मात्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तात् सर्वनाम्नः परः ङसिप्रत्ययः स्मात् संपद्यते।\nसर्वस्मात्। यस्मात्। तस्मात्। कस्मात्। अमुष्मात्। अस्मात्।"
        - sutraNo: "2.1.27"
          textDevanagari: "ङि स्मिन्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तात् सर्वनाम्नः परः ङिप्रत्ययः स्मिन् संपद्यते।\nसर्वस्मिन् विश्वस्मिन्। यस्मिन्। तस्मिन्। कस्मिन्। अमुष्मिन्। अस्मिन्।"
        - sutraNo: "2.1.28"
          textDevanagari: "विभाष्येते पूर्वादेः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "पूर्वादेर् गणात् परयोः ङसिङ्योः स्मात् स्मिन् आदेशौ विभाष्येते विकल्पेन कथ्येते।\nपूर्वस्मात् वा पूर्वात्। पूर्वस्मिन् वा पूर्वे। परस्मात् वा परात्। परस्मिन् वा परे।"
        - sutraNo: "2.1.29"
          textDevanagari: "सुर् आमि सर्वतः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सर्वतः सर्वस्मात् अकारान्तात् आकारान्ताच्च सर्वनाम्नः आमिपरे सुरागमो भवति।\nसर्वेषां येषां तेषां केषां अमीषां एषाम् सर्वासां यासां तासां कासां अमूषां आसाम्।"
        - sutraNo: "2.1.30"
          textDevanagari: "जस् सर्वईम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तात् सर्वनाम्नः परो जस् प्रत्ययः ईत्वं प्राप्नोति।\nसर्वे ये ते के अमी इमे।"
        - sutraNo: "2.1.31"
          textDevanagari: "अल्पादेर् वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अल्पादेर् गणात् परः जस् प्रत्ययः ईत्वं वा प्राप्नोति।\nअल्पे वा अल्पाः प्रथमे वा प्रथमाः चरमे वा चरमाः कतमे वा कतमाः।"
        - sutraNo: "2.1.32"
          textDevanagari: "पूर्वादेश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "पूर्वादेर् गणात् परः जस्प्रत्ययः ईत्वं वा प्राप्नोति।\nपूर्वे वा पूर्वाः। परे वा पराः।"
        - sutraNo: "2.1.33"
          textDevanagari: "द्वन्द्वस्थाच्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "द्वन्द्वसमासस्थात् सर्वनाम्नः परो जस्प्रत्ययः ईत्वं वा प्राप्नोति।\nकतरे च कतमे च ते कतरकतमे वा कतरकतमाः। दत्तकतरकतमे वा दत्तकतरकतमाः।"
        - sutraNo: "2.1.34"
          textDevanagari: "नान्यत् सर्वनामिकम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "द्वन्द्वसमासस्थात् सर्वनाम्नः परस्य प्रत्ययस्यान्यत्सार्वनामिकं कार्यं न भवति।\nपूर्वे चापरे च पूर्वापरं। तस्मै पूर्वापराय पूर्वापरात् पूर्वापराणां पूर्वापरे।"
        - sutraNo: "2.1.35"
          textDevanagari: "तृतीया समासे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तृतीयासमासे सति सर्वनाम्नः परस्य प्रत्ययस्यान्यत्सार्वनामिकं कार्यं न भवति।\nमासेन पूर्वः मासपूर्वः। तस्मै समासपूर्वाय मासपूर्वात् सामपूर्वाणां मासपूर्वे।"
        - sutraNo: "2.1.36"
          textDevanagari: "बहुव्रीहौ च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "बहुव्रीहिसमासे सति सर्वनाम्नः परस्य प्रत्ययस्य सार्वनामिकं कार्यं न भवति।\nप्रियाः सर्वे यस्य सः प्रियसर्वः। तस्मै प्रियसर्वाय प्रियसर्वात् प्रियसर्वाणां प्रियसर्वे।"
        - sutraNo: "2.1.37"
          textDevanagari: "दिशां वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "दिशां दिग्वाचिनां शब्दानां यो बहुव्रीहिस् तत्रस्थितात् सर्वनाम्नः परस्य प्रत्ययस्य सार्वनामिकं कार्यं वा भवति। दक्षिणस्याश्च पूर्वस्याश्च दिशोर्यदन्तरालं विदिक् सा दक्षिणपूर्वा। तस्यै दक्षिणपूर्वस्यै वा दक्षणपूर्वायै। दक्षिणापूर्वस्याः वा दक्षिपूर्वायाः। दक्षिणपूर्वस्याः वा दक्षिणपूर्वायाः। दक्षिणपूर्वस्यां वा दक्षिणपूर्वायाम्।"
        - sutraNo: "2.1.38"
          textDevanagari: "श्रद्धायाः सिः लोपम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "श्रद्धासंज्ञकात् परः सिः प्रत्ययः लोपं प्राप्नोति।\nगङ्गा या सा का।"
        - sutraNo: "2.1.39"
          textDevanagari: "टौसोर् ए"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "श्रद्धाया अन्त्यस्य एत्वं भवति टाओस् इत्येतयोः परयोः।\nगङ्गया गङ्गयोः उमया उमयोः।"
        - sutraNo: "2.1.40"
          textDevanagari: "सम्बुद्धौ च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "श्रद्धाया अन्त्यस्य एत्वं भवति सम्बुद्धौ परस्याम्।\nहे गङ्गे हे युमने।"
        - sutraNo: "2.1.41"
          textDevanagari: "ह्रस्वोऽम्बार्थानाम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अम्बार्था मातृवाचका ये श्रद्धासंज्ञकाः शब्दास्तेषाम् अन्त्यस्य ह्रस्वो भवति सम्बुद्धौ परस्याम्।\nहे अम्ब हे अक्क हे अत्त हे अल्ल।"
        - sutraNo: "2.1.42"
          textDevanagari: "औरीम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "श्रद्धासंज्ञकात् परः औप्रत्ययः ईत्वं प्राप्नोति।\nशाले माले।"
        - sutraNo: "2.1.43"
          textDevanagari: "ङवन्ति यै यास् यास् याम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "श्रद्धासंज्ञकाल्लिङ्गात्पराणि ङवन्तिवचनानि ङे ङसि ङस् ङि इत्येतानि यथासंख्यं यै यास् यास् याम् इत्येतानादेशान् आपद्यन्ति।\nगङ्गायै गङ्गायाः गङ्गायाः गङ्गायाम्।\nउमायै उमायाः उमायाः उमायाम्।"
        - sutraNo: "2.1.44"
          textDevanagari: "सर्वनाम्नस् तु ससवो ह्रस्वपूर्वाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "श्रद्धासंज्ञकात् सर्वनाम्नः परेषां ङवतां वचनानां यथासङ्ख्यम् यै यास् यास् याम् इत्येते आदेशाः ससवः स्वागमयुक्ताः ह्नस्वपूर्वाश्च भवन्ति।\nसर्वस्यै सर्वस्याः सर्वस्याः सर्वस्यां यस्यै यस्याः यस्याः यस्यां तस्यै तस्याः तस्याः तस्यां कस्मै कस्याः कस्याः कस्याम् अमुष्यै अमुष्याः अमुष्याः अमुष्याम् अस्यै अस्याः अस्याः अस्याम्।"
        - sutraNo: "2.1.45"
          textDevanagari: "द्वितीयातृतीयाभ्यां वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "द्वितीयातृतीयाशब्दाभ्यां परेषां ङवतां वचनानाम् यथासङ्ख्यं यै यास् यास् याम् इत्येते आदेशाः ससवः स्वागमयुक्ता ह्रस्वपूर्वाश्च भवन्ति।\nद्वितीयस्यै वा द्वितीयायै। द्वितीयस्याः वा द्वितीयायाः। द्वितीयस्याः वा द्वितीयायाः। द्वितीयस्यां वा द्वितीयायाम्। एवं तृतदीयस्यै वा तृतीयायै। तृतीयस्याः वा तृतीयायाः। तृतीयस्याः वा तृतीयायाः। तृतीयस्यां वा तृतीयायाम्।"
        - sutraNo: "2.1.46"
          textDevanagari: "नद्या ऐ आस् आस् आम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नदीसंज्ञकाल् लिङ्गात् परेषां ङवतां वचनानां यथासङ्ख्यं ऐ आस् आस् आम् इत्येते आदेशा भवन्ति।\nनद्यै नद्याः नद्याः नद्यां वध्वै वध्वाः वध्वाः वध्वाम्।"
        - sutraNo: "2.1.47"
          textDevanagari: "सम्बुद्धौ ह्रस्वः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नदीसंज्ञकाल् लिङ्गात् अन्त्यस्य ह्रस्वो भवति सम्बुद्धौ पर्याम्।\nहे नदि हे वधु।"
        - sutraNo: "2.1.48"
          textDevanagari: "अम्शसोर् आदिर् लोपम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नदीसंज्ञकाल् लिङ्गात् परयोः अम् शस् इत्येतयोः प्रत्ययोः आदिः लोपं प्राप्नोति।\nनदीं नदीः वधूं वधूः।"
        - sutraNo: "2.1.49"
          textDevanagari: "ईकारान्तात् सिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ईकारान्तान् नदीसंज्ञकाल् लिङ्गात् परः सिप्रत्ययो लोपं प्राप्नोति।\nनदी मही गौरी।"
        - sutraNo: "2.1.50"
          textDevanagari: "व्यञ्जनाच्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "व्यञ्जनान्ताल् लिङ्गात् परः सिप्रत्ययः लोपं प्राप्नोति।\nवाक् विद्युत् राजा।"
        - sutraNo: "2.1.51"
          textDevanagari: "अग्नेरमोऽकारः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अग्निसंज्ञकाल् लिङ्गात् परस्य अमो sकारः लोपं प्राप्नोति।\nअग्निं पटुं बुद्धिं धेनुम्।"
        - sutraNo: "2.1.52"
          textDevanagari: "औकारः पूर्वम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अग्निसंज्ञकाल् लिङ्गात् परः औकारः पूर्वं वर्णं प्राप्नोति।\nअग्नी पटू बुद्धी धेनू।"
        - sutraNo: "2.1.53"
          textDevanagari: "शसोऽकारः सचनो ऽस्त्रियाम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अग्निसंज्ञकाल् लिङ्गात् परस्य शसः अकारः पूर्ववर्णं प्राप्नोति। शसश् च सकारस्य च नत्वं भवति। अस्त्रियां स्त्रीविषयं वर्जयित्वा।\nअग्नीन् पटून्।\nअस्त्रियां किं? बुद्धीः धेनूः।"
        - sutraNo: "2.1.54"
          textDevanagari: "टा ना"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अग्निसंज्ञकाल् लिङ्गात् परः टाप्रत्ययः ना आदेशं प्राप्नोति अस्त्रियां स्त्रीविषयं वर्जयित्वा।\nअग्निना पटुना।\nअस्त्रियामिति किम्? बुध्या धेन्वा।"
        - sutraNo: "2.1.55"
          textDevanagari: "अदो ऽमुश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अदश्शब्दात् परः टाप्रत्ययः ना आदेशं प्राप्नोति।\nअदसश्च अमुआदेशः भवति अस्त्रियां स्त्रीविषयं वर्जयित्वा।\nअमुना।\nअस्त्रियामिति किं? अमुया।"
        - sutraNo: "2.1.56"
          textDevanagari: "इरेदुरोज्जसि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अग्निसंज्ञकाल् लिङ्गात् इः एद्भवति उः ओद्भवति जसि परे।\nअग्नयः पटवः बुद्धयः धेनवः।"
        - sutraNo: "2.1.57"
          textDevanagari: "सम्बुद्धौ च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अग्निसंज्ञकात् लिङ्गात् इरेद्भवति उरोद्भवति सम्बुद्धौ परस्याम्।\nहे अग्ने हे पटो हे बुद्धे हे धेनो।"
        - sutraNo: "2.1.58"
          textDevanagari: "ङे च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अग्निसंज्ञकाल् लिङ्गात् इः एद् भवति उः ओद् भवति ङे प्रत्यये परे।\nअग्नये पटवे बुद्धये धेनवे।"
        - sutraNo: "2.1.59"
          textDevanagari: "ङसिङसोर् लोपश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अग्निसंज्ञकाल् लिङ्गात् इः एद् भवति उः ओद् भवति ङसिङसोः परयोः तयोश्च अकारो लोपो भवति।\nअग्नेः अग्नेः पटोः पटोः बुद्धेः बुद्धेः धेनोः धेनोः।"
        - sutraNo: "2.1.60"
          textDevanagari: "गोश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "गोशब्दात् परयोः ङसिङसोः अकारो लोपो भवति।\nगोः गोः। द्योशब्दात् अपीष्यते। द्योः द्योः।"
        - sutraNo: "2.1.61"
          textDevanagari: "ङिरौ सपूर्वः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अग्निसंज्ञकाल् लिङ्गात् परो ङिप्रत्ययः पूर्वेण वर्णेन सह औकारं प्राप्नोति।\nअग्नौ पटौ बुद्धौ धेनौ।"
        - sutraNo: "2.1.62"
          textDevanagari: "सखिपत्योर् ङिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सखिपतिशब्दाभ्यां परो ङिप्रत्ययः औत्वं प्राप्नोति।\nसख्यौ पत्यौ।"
        - sutraNo: "2.1.63"
          textDevanagari: "ङसिङसोरुमः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सखिपतिशब्दाभ्यां परयोः ङसिङसोः अकार उत्वं प्राप्नोति।\nसख्युः सख्युः पत्युः पत्युः।"
        - sutraNo: "2.1.64"
          textDevanagari: "ऋदन्तात् सपूर्वः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ऋदन्ताल् लिङ्गात् परयोर् ङसिङसोर् अकारः पूर्वेण वर्णेन सह उत्वं भवति।\nपितुः पितुः मातुः मातुः भ्रातुः भ्रातुः कर्तुः कर्तुः स्वसुः स्वसुः नुः नुः।"
        - sutraNo: "2.1.65"
          textDevanagari: "आ सौ सिलोपश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ऋदन्तस्य लिङ्गस्यान्त्यस्य आत्वं भवति सौ सिप्रत्यये परे सेश्चलोपो भवति।\nपिता माता भ्राता कर्ता स्वसा ना।"
        - sutraNo: "2.1.66"
          textDevanagari: "अग्निवच् छसि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ऋदन्तं लिङ्गम् अग्निवद् भवति शसि परे। यथाग्निसंज्ञकात् परस्य शसोऽकारःसशनोऽस्त्रियामिति शसो ऽकारस्य पूर्ववर्णादेशः स्त्रीविषयं वर्जयित्वा सकारस्य च नत्वं भवति तथा ऋदन्तात् अपि भवतीत्यर्थः।\nपितॄन् भ्रातॄन् कर्तॄन् नॄन्।\nस्त्रियां सस्य नत्वं नास्ति यथा मातॄः स्वसॄः।"
        - sutraNo: "2.1.67"
          textDevanagari: "अर्ङौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ऋदन्तस्य लिङ्गस्य अन्त्यस्य अर्भवति ङौ ङिप्रत्यये परे।\nपितरि मातरि भ्रातरि कर्तरि स्वसरि नरि।"
        - sutraNo: "2.1.68"
          textDevanagari: "घुटि च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ऋदन्त्यस्य लिङ्गस्यार्भवति घुटि परे।\nपितरौ पितरः पितरं पितरौ मातरौ मातरः मातरं मातरौ नरौ नरः नरं नरौ।"
        - sutraNo: "2.1.69"
          textDevanagari: "धातोस्तृशब्दस्यार्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "धातोः परः यस्तृशब्दस् तस्य आर्भवति चुटि परे।\nकर्तारौ कर्तारः कर्तारं कर्तरौ वक्तारौ वक्तारः वक्तारं वक्तारौ।"
        - sutraNo: "2.1.70"
          textDevanagari: "स्वस्रादीनां च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्वस्रादीनां शब्दानां यः ऋकारस् तस्य आर् भवति घुटि परे।\nस्वसारौ स्वसारः स्वसारं स्वसारौ नप्तारौ नप्तारः नप्तारं नप्तारौ।\nस्वसा नप्ता च नेष्टा च त्वष्टा क्षत्ता तथैव च।\nहोता पोता प्रशस्ता चेत्यष्टौ स्वस्रादयः स्मृताः॥"
        - sutraNo: "2.1.71"
          textDevanagari: "आ च न सम्बुद्धौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ऋदन्तस्य लिङ्गस्य आर् न भवति। आसौसिलोपश्चेत्यनेन आत्वं न भवति। पारिशेष्याद् घटि चेत्य् अर् एव भवति सम्बुद्धौ परस्यां।\nहे पितः हे मातः हे भ्रातः हे कर्तः हे स्वसः हे नः।"
        - sutraNo: "2.1.72"
          textDevanagari: "ह्रस्वनदीश्रद्धाभ्यः सिर्लोपम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ह्रस्वान्तात् नदीसंज्ञकात् श्रद्धासंज्ञकाच्च लिङ्गात् परः सम्बुद्धिसिकारः लोपं प्राप्नोति।\nहे वृक्ष हे नदि हे वधु हे गङ्गे हे यमुने।"
        - sutraNo: "2.1.73"
          textDevanagari: "आमि च नुः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ह्रस्वनदीश्रद्धाभ्यः आमि परे नुरागमो भवति।\nवृक्षाणां अग्नीनां वायूनां पितॄणां नदीनां वधूनां गङ्गानाम् उमानाम्।"
        - sutraNo: "2.1.74"
          textDevanagari: "त्रेस्त्रयश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "त्रिशब्दस्यामिपरे नुरागमो भवति। त्रेश्च त्रयादेशः।\nत्रयाणाम् परमत्रयाणाम्।"
        - sutraNo: "2.1.75"
          textDevanagari: "चतुरः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "चत्वार्शब्दस्य आमि परे नुरागमो भवति।\nचतुर्णाम्।"
        - sutraNo: "2.1.76"
          textDevanagari: "सङ्ख्यायाः ष्णान्तायाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "षकारनकारान्तायाः सङ्ख्याः आमि परे नुरागमो भवति।\nषण्णां पञ्चानां सप्तानां दशानाम्।"
        - sutraNo: "2.1.77"
          textDevanagari: "कतेश्च जस्शसोर् लुक्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "षकारनकारान्तायाः सङ्ख्यायाः कतिशब्दाश् च परयोः जस्शसोः लुग्भवति।\nषट् तिष्ठन्ति। षट् पश्य। पञ्च पञ्च सप्त सप्त नव नव। दश तिष्ठन्ति दश पश्य। कति तिष्ठन्ति कति पश्य।"
        - sutraNo: "2.1.78"
          textDevanagari: "नियो ङिराम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "णीञ् प्रापणे इत्यस्मात् क्विवन्तात् परो ङिप्रत्ययः आम् आदेशं प्राप्नोति।\nनियां सेनान्यां ग्रामण्याम्।\n\nइति लघुवृत्तौ नाम प्रकरणे लिङ्गपादः प्रथमः॥१॥"
    - padaId: "2-2"
      padaNo: "2.2"
      padaNameDevanagari: "सखिपादः"
      sutras:
        - sutraNo: "2.2.1"
          textDevanagari: "न सखिष्टादावग्निः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सखिशब्दः अग्निसंज्ञो न भवति। टादौ प्रत्यये परे सख्या सख्ये। टादाविति किम्? सखीन्।"
    - padaId: "2-3"
      padaNo: "2.3"
      padaNameDevanagari: "युष्मत्पादः"
      sutras:
        - sutraNo: "2.3.1"
          textDevanagari: "युष्मदस्मदोः पदं पदात् षष्ठीचतुर्थीद्वितीयासु वस्नसौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "युष्मदस्मदोः यत्पदं पदात्परं षष्ठीचतुर्थीद्वितीयासु बहुत्वे स्थितं तस्य यथासङ्ख्यं वस् नस् इत्येतावादेशौ भवतः शिवोवः स्वासीशिवोयुष्माकम् शिवोनः स्वामीशिवोस्माकम् शिवोवोदास्यतिशिवोयुष्मभ्यम् शिवोनोदास्यतिशिवोस्मभ्यम् शिवोवोरक्षतिशिवोयुष्मान् शिवोनोरक्षति शिवोस्मान्।"
    - padaId: "2-4"
      padaNo: "2.4"
      padaNameDevanagari: "कारकपादः"
      sutras:
        - sutraNo: "2.4.1"
          textDevanagari: "अव्ययीभावादकारान्ताद्विभक्तीनाममपञ्चम्याः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तादव्ययीभावात्परासां विभक्तीनाम् अमादेशो भवति अपञ्चम्याः पञ्चमीविभक्तिं वर्जयित्वा। उपकुम्भं तिष्ठति। उपकुम्भं पश्य। उपकुम्भं देहि। उपकुम्भं स्वम्। अकारान्तादिति किम्? समीपं वध्वाः उपवधु। स्वरोह्रस्व इति ह्रस्वः। अन्यस्माल्लुगिति सिलोपः। अपञ्चम्या इति किम्? उपकुम्भादागतः।"
        - sutraNo: "2.4.2"
          textDevanagari: "वा तृतीयासप्तम्योः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तादव्ययीभावात् परयोः तृतीयासप्तम्योः अमादेशो वा भवति। उपकुम्भं कृतम् उपकुम्भेन कृतम्। उपकुम्भं स्थापय उपकुम्भे स्थापय। अकारान्तादिति किम्? उ पवधु कृतम् उपवधु स्थापय।"
        - sutraNo: "2.4.3"
          textDevanagari: "अन्यस्माल्लुक्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अन्यस्मात् अनकारान्तात् अव्ययीभावात् परासां विभक्तीनां लुक् भवति। उवधु तिष्ठति। उपवधु पश्य। उपवधु कृतम्। उपवधु देहि। उपवधु आगतः। उपवधु स्वम्। उपवधु स्थापय। समृद्धिः कर्तृणां सुकर्तृ। पश्चान्नद्याः अनुनदि। विधिमनतिक्रम्य यथाविधि।"
        - sutraNo: "2.4.4"
          textDevanagari: "अव्ययाच्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अव्ययात्परासां विभक्तीनां लुग्भवति । च वा हा अह एव ग्रामश्च ते स्वम्। नगरं च मे स्वम्।"
        - sutraNo: "2.4.5"
          textDevanagari: "रूढानां बहुत्वे स्त्रियामपत्यप्रत्ययस्य"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ये शब्दाः देशस्य राज्ञां च वाचकाः ते रूढाः रूढानां सम्बन्धिनः अपत्यप्रत्ययस्य बहुत्वे उत्पन्नस्य लुग्भवति अस्त्रियां स्त्रीवषयं वर्जयित्वा। अङ्गस्यापत्यानि बहूनि अङ्गाः। एवं बङ्गाः कलिङ्गाः सुह्माः रघोरपत्यानि बहूनि रघवः। वाणपत्ये इति अण् तस्य अनेन लुक्। रूढानामिति किम्? पूरोरपत्यानि बहूनि पौरवाः अण् णकारो वृद्धिरादौसणे इत्यर्थः। आदिवृद्धिश्च उवर्णस्त्वोत्वमापाद्य इति उवर्णस्य ओकारः। बहुत्वे इति किम्? अङ्गस्य अपत्यं आङ्गः। अस्त्रियामिति किम्? अङ्गस्यापत्यानि बह्व्यः स्त्रियः आङ्ग्यः। अणेयेकादिति ईप्रत्ययः ईकारे स्त्रीकृतेल्लोप्य इति अकारलोपः जस् अपत्यप्रत्ययस्येति किम्? पञ्चालानामिमे शिष्याः पाञ्चालाः तस्येदमित्यण्।"
        - sutraNo: "2.4.6"
          textDevanagari: "गर्गयस्कविदादीनां च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "गर्गादीनां यस्कादीनां विदानीनां च सम्बन्धिनः अपत्यप्रत्ययस्य बहुत्वे उत्पन्नस्य लुग्भवति अस्त्रियां स्त्रीविषयं वर्जयित्वा गर्गस्यापत्यानि बहूनि गर्गाः एवं वत्साः वजाः सङ्कृतयः व्याघ्रपदो अपत्यानि बहूनि व्याघ्रपदः। ण्यगर्गादेरितिण्यतस्यानेन लुक्। यस्कस्यापत्यानि बहूनि यस्काः लह्याः द्रूह्याः। विदस्यापत्यानि बहूनि विदाः उर्वाः भरद्वाजः वाणपत्ये इति अण्। तस्यानेन लुक्। अपत्यप्रत्ययस्येति किम्? गर्गस्य इमे शिष्याः गार्गाः यास्काः वैदाः। बहुत्वे इति किम्? गर्गस्यापत्यं गार्ग्यः यास्कः वैदः। अस्त्रियामिति किम्? गर्गस्यापत्यानि बह्व्यः स्त्रियाः गार्ग्यः यास्क्यः वैद्यः गर्गशब्दात् ण्यगर्गादेरितिण्यः ण्यदिति ईप्रत्ययः यस्यापत्यस्येतियलोपः शिष्टेभ्यः अण्। अणेयेकादिति ईप्रत्ययः गर्गवत्सवजसंकृतिव्याघ्रपात् अजविदभृत् इत्यादयोगर्गादयः यस्कलह्यद्रूह्यअयस्थूणबलन्धर इत्यादयो यस्कादयः विदे उर्व भरद्वाजकुर्वण उपमन्यु इत्यादयो विदादयः।"
        - sutraNo: "2.4.7"
          textDevanagari: "भृग्वत्र्यङ्गिरस्कुत्सवसिष्ठगोतमेभ्यश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "भृगु अत्रि अङ्गिरस् कुत्स वसिष्ट गोतम एभ्यः परस्य अपत्यप्रत्ययस्य बहुत्वे उत्पन्नस्य लुक् भवति अस्त्रियां स्त्रीविषयं वर्जयित्वा। भृगोरपत्यानि बहूनि भृगवः अत्रयः अङ्गिरसः कुत्साः वसिष्ठाः गोतमाः अस्यानेन लुक्। अत्रिशब्दात् स्त्र्यात्र्यादेरेयण् अस्य अनेन लुक्। शिष्टेभ्यो वाणपत्येण्। अपत्यप्रत्ययस्येति किम्? भृगोरिमे शिष्याः भार्गवाः। ततस्येदमित्यण्। बहुत्वे इति किम्? भृगोरपत्यं भार्गवः एवम् आत्रेयः आङ्गिरसः कौत्सः वासिष्ठः गौतमः। अस्त्रियामिति किम्? भृगोरपत्यानि बह्व्यः स्त्रियः भार्गव्यः आत्रेय्यः आङ्गिरस्यः कौत्स्यः वासिष्ठ्यः गौतम्यः अणेरेकादिति ईप्रत्ययः ईकारेस्त्रीकृतेल्लोप्यः जस्।"
        - sutraNo: "2.4.8"
          textDevanagari: "यतोऽपैति भयमादत्ते वा तदपादानम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यतः अपैति यस्माद्विश्लेषं प्राप्नोति यतो भयं यतश्चादत्ते गृह्णाति तत्कारकं अपादानसंज्ञं भवति। अपादाने पञ्चमी। ग्रामादागच्छति। अश्वात्पततिः। चौरेभ्यो बिभेति। अधर्मान्निवर्तते। कोष्ठागाराद्धान्यं गृह्णाति। उपाध्यायाद्विद्यामादत्ते। अपादानसंज्ञया क्व प्रयोजनम्? शेषाः कर्मकारणसंप्रदानापादानस्वाम्याद्यधिरकणेषु इत्यत्र वक्ष्यमाणाभिरत्रैव प्रयोजनम्।"
        - sutraNo: "2.4.9"
          textDevanagari: "ईप्सितं च रक्षार्थानाम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "रक्षार्थानां रक्षाप्रयोजनानाम् धातूनां प्रयोगे सति यदीप्सितमभिप्रीतं तत्कारकमपादानसंज्ञं भवति। च शब्दादनीप्सितमपि। यवेभ्यो गा रक्षति। तिलेभ्यः काकान्वारयति। अनीप्सितं यथा अहिभ्यः पुत्रान्रक्षति कूपादन्धं वारयति।"
        - sutraNo: "2.4.10"
          textDevanagari: "यस्मै दित्सा रोचते धारयते वा तत्संप्रदानम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यस्मै दित्सा दातुमिच्छा यस्मै रोचते यस्मै च ऋणं धारयते तत्कारकं संप्रदानसंज्ञं भवति। संप्रदाने चतुर्थी। विप्राय गां ददाति। वैश्रवणाय बलिमुपहरति। देवदत्ताय रोचते मोदकः। यज्ञदत्ताय शतं धारयते। दित्सा इति किम्? राज्ञो दाण्डं ददाति।"
        - sutraNo: "2.4.11"
          textDevanagari: "य आधारस्तदधिकरणम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "य आधारः तत्कारकं अधिकरणसंज्ञं भवति। अधिकरणे सप्तमी। कटे आस्ते। पर्यङ्के शेति। जले मत्स्याः। खे शकुनयः दध्नि घृतम्। तिलेषु तैलम्।"
        - sutraNo: "2.4.12"
          textDevanagari: "येन क्रियते तत्करणम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "येन क्रियते साध्यते तत्कारकं करणसंज्ञं भवति। करणे तृतीया। दात्रेण लुनाति। परशुनाच्छिनत्ति।"
        - sutraNo: "2.4.13"
          textDevanagari: "यत्किर्यते तत्कर्म"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यत्क्रियते क्रियया विशिष्टं संपाद्यते तत्कारकं कर्मसंज्ञं भवति। कर्मणि द्वितीया। कटं करोति। ओदनं पचति। आदित्यं पश्यति।"
        - sutraNo: "2.4.14"
          textDevanagari: "यः करोति स कर्ता"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यः करोति क्रियां निर्वर्तयति स कर्तृसंज्ञो भवति। कर्तरि तृतीया। रुद्रेण त्रिपुरं दग्धम्। विष्णुना बद्धो बलिः। कर्तृसंज्ञया क्व प्रयोजनम्? कर्तरि चेत्यादिषु।"
        - sutraNo: "2.4.15"
          textDevanagari: "कारयति यः स हेतुश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "य कर्तारं कारयति क्रियायां प्रेरयति स हेतुसंज्ञो भवति। चशब्दात्कर्तृसंज्ञश्च। कर्तरि प्रथमा। कारयति पाठयति हेतुसंज्ञया क्व प्रयोजनम् धातोश्च हेतावित्यादिषु।"
        - sutraNo: "2.4.16"
          textDevanagari: "तेषां परमुभयप्राप्तौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तेषामपादानादीनां कारकाणां मध्यात् उभयोर्द्वयोः कारकयोः एकत्र प्राप्तौ सत्यां यत्परं तदेवकारकं भवति। वृक्षं त्यजति खगः। त्यजति दण्डं दण्डी। अत्र परत्वात्कर्मकर्तृकारके भवतः।"
        - sutraNo: "2.4.17"
          textDevanagari: "प्रथमाविभक्तिर्लिङ्गार्थवचने"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "लिङ्गार्थस्य वचने अभिधाने सति लिङ्गात्प्रथमाविभक्तिर्भवति। वृक्षः कुमारी। कुण्डम्। द्रोणः। आढकम्।"
        - sutraNo: "2.4.18"
          textDevanagari: "आमन्त्रणे च।"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "आमन्त्रणादिके लिङ्गार्थवचने सति प्रथमाविभक्तिर्भवति। हे शिव हे केशव।"
        - sutraNo: "2.4.19"
          textDevanagari: "शेषाः कर्मकरणसंप्रदानापादानस्वाम्याद्यधिकरणेषु"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "शेषा द्वितीयाद्याविभक्तयः कर्मणि करणे संप्रदाने अपादाने स्वाम्यादियोगे अधिकरणे च भवन्ति। कर्मणि द्वितीया। कटं करोति। करणे तृतीया। परशुनाच्छिनत्ति। संप्रदाने चतुर्थी। विप्राय गां ददाति। अपादाने पञ्चमी। ग्रमादागच्छति। अश्वात्पतितः। स्वाम्यादियोगे षष्ठी। देवदत्तस्य स्वम्। पितुः पुत्रः। राज्ञो भार्या। अधिकरणे सप्तमी। कटे आस्ते। पर्यङ्के शेते।"
        - sutraNo: "2.4.20"
          textDevanagari: "पर्यपाङ्योगे पञ्चमी"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "परि अप आङ् इत्येतैर्योगे सति लिङ्गात् पञ्चमी भवति। परिस्रुघ्र्नाद्वृष्टो देवः। अपकान्यकुब्जाद्वृष्टो देवः। आकुरुक्षेत्राद्वृष्टो देवः।"
        - sutraNo: "2.4.21"
          textDevanagari: "दिगितरर्तेऽन्यैश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "दिक्शब्देरितर ऋते अन्य इत्येतैश्च योगे लिङ्गात्पञ्चमी भवति। पूर्वो ग्रामात्। दक्षिणो नगरात्। इतरो देवदत्तात्पण्डितः। ऋते विष्णोः कुतोमोक्षः। अन्यो देवदत्तात्।"
        - sutraNo: "2.4.22"
          textDevanagari: "द्वितीयैनेन"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "एनेन एनप्रत्ययान्तेन शब्देन योगेन सति लिङ्गाद्द्वितीया भवति। उत्तरेण ग्रामं वसति। दक्षिणेन नगरं वसति। पुरस्तादादयश्चेति एनप्रत्ययः।"
        - sutraNo: "2.4.23"
          textDevanagari: "कर्मप्रवचनीयैश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अन्वाद्याः एकादश कर्मप्रवचनीयाः ये प्रागुक्ताः तैः योगे सति लिङ्गाद्द्वितीया भवति। वृक्षमनुविद्योतते विद्युत्। वृक्षं परि। वृक्षमभि। मां प्रति साधुः।"
        - sutraNo: "2.4.24"
          textDevanagari: "गत्यर्थकर्मणि द्वितीयाचतुर्थौ चेष्टायामनध्वनि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "गत्यर्थानां धातूनां यत्कर्म तस्मिन्कर्मणि अनध्वनि अध्वशब्दवर्जिते द्वितीयाचतुर्थ्यौ भवतः चेष्टायां गम्यमानायां सत्यां चेष्टाकायपरिस्पन्दः ग्रामं गच्छति ग्रामाय गच्छति स्रुघ्नं व्रजति। स्रुघ्नाय व्रजति। तीर्थं याति तीर्थाय याति। गत्यर्थग्रहणं किम्? ओदनं पचति कर्मणीति किम्? अश्वेन याति। चेष्टायामितिकिम्? मनसा वाराणसीं गच्छति। अनध्वनीति किम्? अध्वानं गच्छति।"
        - sutraNo: "2.4.25"
          textDevanagari: "मन्यकर्मणि चानादरे प्राणिनि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "मनज्ञाने इत्यस्य यत्कर्म तस्मिन्कर्मणि अप्राणिनि प्राणिवर्जिते द्वितीयाचतुर्थ्यौ भवतः अनादरे गम्यमाने अनादरः तिरस्कारः। तृणमपि त्वा न मन्ये। तृणायापि त्वा न मन्ये। बुसमपि त्वा न मन्ये। बुसायापि त्वा न मन्ये। मन्यग्रहणे किम्? तृणं त्वां चिन्तयामि। अनादरे इति किम्? सुवर्णं त्वां मन्ये। अप्राणिनि इति किम्? न त्वा काकं मन्ये। न त्वा श्वानं मन्ये।"
        - sutraNo: "2.4.26"
          textDevanagari: "नमस्स्वस्तिस्वाहास्वधालंवषड्योगे चतुर्थी"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नमस् स्वस्ति स्वाहा स्वधा अलं वषट् इत्येतैर्योगे सति लिङ्गात् चतुर्थी भवति। नमो रुद्राय। स्वस्ति प्रजाभ्यः। स्वाहा अग्नये। पितृभ्यः स्वधा। अलं मल्लो मल्लाय। वषडिन्द्राय।"
        - sutraNo: "2.4.27"
          textDevanagari: "तुमर्थाच्च भाववाचिनः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तुमासमानार्थो भाववाची घञादिप्रत्ययः भाववाचिनश्चेति अनेन क्रियायां क्रियार्थायां विहितः तदन्तात् शब्दात् चतुर्थीभवति। पाकाय व्रजति। पक्तये व्रजति। पचनाय व्रजति। पक्तुं व्रजति इत्यर्थः। तुमर्थादितिकिम्? पाकः पक्तिः पचनम्। भाववाचिन इति किम्? कटं कारको व्रजति कर्तुं व्रजति इत्यर्थः।"
        - sutraNo: "2.4.28"
          textDevanagari: "तृतीया सहयोगे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सहार्थेन शब्देन योगे सति लिङ्गात्तृतीया भवति। पुत्रेण सह आगतः। पुत्रेण सह गोमान्। पुत्रेण सत्रा। पुत्रेण सजूः।"
        - sutraNo: "2.4.29"
          textDevanagari: "हेत्वर्थे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "फलसाधनयोग्यः पदार्थो हेतुः हेतावर्थे लिङ्गात्तृतीया भवति। विद्यया यशः। कन्यया शोकः। धनेन कुलम्।"
        - sutraNo: "2.4.30"
          textDevanagari: "कुत्सिते ऽङ्गे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कुत्सिते अङ्गिनि यदङ्गं तस्मिन्नङ्गे तृतीया भवति। अक्ष्णा काणः। नासिकया चिपिटः। पादेन खञ्जः। शिरसा खलतिः। पाणिना कुणिः।"
        - sutraNo: "2.4.31"
          textDevanagari: "विशेषणे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विशेष्यते उपलक्ष्यते येन तद्विशेषणम्। विशेषणे ऽर्थे लिङ्गात्तृतीया भवति। जाटाभिस्तापसो दृष्टः। खड्गेन भटो दृष्टः।"
        - sutraNo: "2.4.32"
          textDevanagari: "कर्तिरि च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कर्तर्यर्थे लिङ्गात्तृतीया भवति। रुद्रेण त्रिपुरं दग्धम्। विष्णुना बद्धो बलिः।"
        - sutraNo: "2.4.33"
          textDevanagari: "कालभावयोः सप्तमी"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "काले भावे च भावो धात्वर्थः तस्मिन्नर्थे लिङ्गात्सप्तमी भवति। शरदि पुष्प्यन्ति सप्तच्छदाः। वर्षासु पुष्प्यन्ति कुटजानि। भावे यथा अग्निहोत्रे हूयमाने गतः। गोषु दुह्यमानासु आगतः।"
        - sutraNo: "2.4.34"
          textDevanagari: "स्वामीश्वराधिपतिदायादसाक्षिप्रतिभूप्रसूतैः षष्ठी च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्वामिन् ईश्वर अधिपति दायाद साक्षिन् प्रतिभू प्रसूत इत्येतैर्योगे सति लिङ्गात् षष्ठी भवति सप्तमी च। धनस्य स्वामी धने स्वामी। धनस्य ईश्वरः धने ईश्वरः। धनस्य अधिपतिः धने अधिपतिः। धनस्य दायादः धने दायादः। धनस्य प्रतिभूः धने प्रतिभूः। गवां साक्षी गोषु साक्षी। गवां प्रसूतः गोषु प्रसूतः।"
        - sutraNo: "2.4.35"
          textDevanagari: "निर्धारणे च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "जात्या गुणेन क्रियया संज्ञया वापृथक्कृतिः समूहादेकदेशस्य निर्धारणमिति स्मृतम्। येषां मध्यात्कस्यचिन्निर्धारणं पृथक्करणं तेषां षष्ठी भवति सप्तमी च। पुरुषाणां मध्ये क्षत्रियः शूरः पुरुषेषु वा। गवां कृष्णागौः संपन्नक्षीरा गोषु वा। अध्वगानां मध्ये धावन्तः शीघ्रगाः अध्वगेषु वा। ब्राह्मणानां मध्ये देवदत्तः पाठकः ब्रह्मणेषु वा।"
        - sutraNo: "2.4.36"
          textDevanagari: "षष्ठी हेतुप्रयोगे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "हेतुशब्दप्रयोगे सति यो हेतुस्तस्य षष्ठी भवति। हेत्वर्थे इति तृतीया प्राप्ता। अन्नस्य हेतोर्वसति। विद्याया हेतोर्वसति।"
        - sutraNo: "2.4.37"
          textDevanagari: "स्मृत्यर्थकर्मणि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्मृतिरर्थो योषां ते स्मृत्यर्थाः तेषां कर्म स्मृत्यर्थकर्म तस्मिन्कर्मणि षष्ठी भवति। पितुः स्मरति। मातुर्ध्यायति। प्रियायाश्चिन्तयति।"
        - sutraNo: "2.4.38"
          textDevanagari: "करोतेः प्रतियत्ने"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "करोते डुकृञ् करणे इत्यस्य यत्कर्म तस्मिन्कर्मणि षष्ठी भवति। प्रतियत्ने गम्यमाने सति। सतो गुणान्तरोत्पादनं प्रतियत्नः। एधोदकस्योपस्कुरुते। असिपत्त्रस्योपस्कुरुते।"
        - sutraNo: "2.4.39"
          textDevanagari: "हिंसार्थानामज्वरे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "हिंसार्थानां धातूनां यत्कर्म तस्मिन्कर्मणि षष्ठी भवति अज्वरे ज्वर रोगे इत्यस्य कर्म वर्जयित्वा। चौरस्य रुजति रोगः। चौरस्य तुदति तोदः। चौरस्यामयति आमयः। अज्वरे इति किम्? चौरं ज्वरयति ज्वरः।"
        - sutraNo: "2.4.40"
          textDevanagari: "कर्तृकर्मणोः कृति नित्यम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कृति कृत्प्रत्ययान्ते शब्दे प्रयुज्यमाने सति कर्तरि कर्मणि च नित्यं षष्ठी भवति। भवतः आसिका। भवतः शायिका। भवतः अग्रगामिका। पर्यायार्हणेषु चेति स्त्रियां भावे वुण्। युवजामना कान्ता। अत्र कर्तरि षष्ठी। कर्मणि यथा वज्रस्य भर्ता। भुवनस्य रक्षिता। यवानां लावकः। सक्तूनां पायकः।"
        - sutraNo: "2.4.41"
          textDevanagari: "न निष्ठादिषु"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "निष्ठादिषु कृत्प्रत्ययेषु प्रयुज्यमानेषु सत्सु कर्तृकर्मणोः षष्ठी न भवति। पूर्वेण प्राप्ता। देवदत्तेन जितम्। देवदत्तेन कटः कृतः।"
        - sutraNo: "2.4.42"
          textDevanagari: "षडो णो ने"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "षष्शब्दस्य अन्त्यस्य हशषच्छेति डत्वे कृते णत्वं भवति ने नकारे परे। षण्णाम्। षण्णवतिः। षण्णगरी। ने इति किम् षड्भिः।"
        - sutraNo: "2.4.43"
          textDevanagari: "मनोरनुस्वारो धुटि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "मकारनकारयोरनुस्वारो भवति धुटि परे। रंस्यते। हंसि। धुटीति किम्? गम्यते। हन्यते।"
        - sutraNo: "2.4.44"
          textDevanagari: "वर्ग्ये वर्गान्तः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "मकारनकारयोर्वर्गान्तो भवति वर्ग्ये धुटि परे। शान्तः। शङ्किता। शमु उपशमे गत्यर्थाकर्मकेति क्तः। पञ्चमोपधेत्युपधादीर्घः। धुटीति किम्? चम्नोति हन्मि चमु अदने हन हिंसागत्योः वर्तमाना ति मि नु स्वादेर्गुणः।"
        - sutraNo: "2.4.45"
          textDevanagari: "तवर्गश्चटवर्गयोगे चटवर्गौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तवर्गः चटवर्गाभ्यां योगे सति यथासङ्ख्यं चटवर्गावादेशौ भवतः राज्ञः भृज्जति। याच्ञा। भ्रस्जपाके भुयाचृयाच्ञायाम्। याचिविच्छिप्रच्छीति नङ्। टवर्गयोगे ईट्टे अड्डति षण्णाम्। ईडस्तुतौ वत्तमाना ते अन्वि अदादेर्लुक्। अघोषेष्वटामितिडस्यटः अद्डअभियोगे अन्वि अनेन तस्य टः दस्यडः।"
        - sutraNo: "2.4.46"
          textDevanagari: "नामिकरपरःप्रत्ययविकारागमस्थःसिष्षं नुविसर्जनीयषान्तरोपि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नामिनः ककारात् रेफाच्चपरः सकारः प्रत्ययस्थो विकारस्थ आगमगस्थश्च षत्वमापद्यते नुविसर्जनीयषान्तरोपि नुकारागमेन विसर्जनीयेन षकारेण व्यवहितोपीत्यर्थः। नामिनः अग्निषु वायुषु कात् वाक्षु त्वक्षु रेफात् गीर्षु धूर्षु इति प्रत्ययस्थः एषः इति विकारस्थः सर्वेषामित्यागमस्थः नुविसर्जनीयषान्तरोपि यथा संर्पीषि सर्पिषुः सर्पिष्षु। नामिन इति किम्? असौ।"
        - sutraNo: "2.4.47"
          textDevanagari: "रषृवर्णेभ्यो नो णमनन्त्यः स्वरहयवकवर्गपवर्गान्तरोऽपि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "रेफषकारऋवर्णेभ्यः परो नकारः अनन्त्यः अपदान्तः णकारमापद्यते स्वरेण हकारेण यकारेण वकारेण कवर्गेण पवर्गेण च व्यवहितोऽपि इत्यर्थः। रेफात् चतुर्णाम्। षात् पूष्णाम्। ऋवर्णात् नृणां वा नॄणाम्। स्वरहयवकवर्गपवर्गैः केवलैः समुदितैश्च व्यवहितो। यथा हरेण पुरुषेण अहेण आर्येण गर्वेण अर्केण मूर्खेण सर्गेण अर्घेण सर्पेण रेफेण दर्भेण धर्मेण। रषृवर्गणेभ्य इति किम्? धनम्। अनन्त्य इति किम्? नरान्। वृक्षान्। पितॄन्।"
        - sutraNo: "2.4.48"
          textDevanagari: "स्त्रियामादाप्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "आत् अकारान्तात् लिङ्गात् स्त्रियां वर्तमानात् आप्प्रत्ययो भवति। पकारः स्वरार्थः। देवदत्ता या सा का। स्त्रियामिति किम्? कीलालपाः। आदिति किम्? मतिः।"
        - sutraNo: "2.4.49"
          textDevanagari: "नदाद्यन्च्वाह्वन्सन्तृसखिनान्तेभ्य ई"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नदादिभ्यः शब्देभ्यः तथा अन्च् वाह् उ अन्स् अन्त् ऋ सखि नान्त एभ्यः स्त्रियां वर्तमानेभ्यः ईप्रत्ययो भवति। नदादिभ्यस्तावत् नदी मही गौरी अन्च् प्राची प्रतीची तिरश्ची उदीची वाह् पष्टौही तुर्यौही। उ पट्वी मृद्वी। अन्स् पोचषी विदुषी। अन्त् पचन्ती देव्यन्ती। ऋ कर्त्री हर्त्त्री। सखि सखी। नान्त दण्डिनी पद्मिनी येभ्यः शब्देभ्यः स्त्रियामीप्रत्ययो दृश्यते तेन दादयः।"
        - sutraNo: "2.4.50"
          textDevanagari: "ईकारे स्त्रीकृतेऽल्लोप्यः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्त्रियां कृते ईकारे परे अकारो लोपनीयो भवति। देवी गौरी मही। अनेन अकारलोपः। स्त्रीकृते इति किम्? कुण्डे।"
        - sutraNo: "2.4.51"
          textDevanagari: "स्वरोह्रस्वोनपुंसके"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नपुंसकविषये योन्त्यः स्वरस्तस्य ह्रस्वो भवति सेनानि कुलम्। यवलुकुलम् नपुंसकेइति किम्? ग्रामणीः ना गौः।\n\nइति लघुवृत्तौ नामप्रकरणे कारकपादश्चतुर्थः॥"
    - padaId: "2-5"
      padaNo: "2.5"
      padaNameDevanagari: "समासपादः"
      sutras:
        - sutraNo: "2.5.1"
          textDevanagari: "नाम्नां समासो युक्तार्थः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नामसंज्ञां लिङ्गस्य विभक्त्यन्तस्य पूर्वाचार्याः कृतवन्तः।\n\nअष्टौ यत्र प्रयुज्यन्ते नानार्थेषु विभक्तयः।\nतन्नामकवयः प्राहुर्भेदे वचनलिङ्गयोः॥\n\nनाम्नां समासः समसनं पृथक्स्थितानां एकीभावो भवति यदिपूर्वपदोत्तरपदानां युक्तार्थः परस्परसम्बन्धोऽर्थः भवति। नीलं च उत्पलं नीलोत्पलम्। राज्ञः पुरुषः राजपुरुषः। युक्तार्थ इति किम्? वस्त्रं नीलम् उत्पलं वर्षासु पुष्प्यति। भार्या राज्ञः पुरुषो देवदत्तस्य।"
        - sutraNo: "2.5.2"
          textDevanagari: "तत्स्था लोप्या विभक्तयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तत्र समासाऽर्थे वाक्ये याः स्थिता विभक्तयः ताः लोप्या भवन्ति। राज्ञः पुरुषः राजपुरुषः। राजपुरुष इति षष्ठीतत्पुरुषः शङ्कुलया खण्डः शङ्कुलाखण्डः। यूपाय दारु यूपदारु। वृकेभ्यो भयं वृकभयं। लोप्या इति अर्हप्रत्ययनिर्देशादन्यस्यापि लोपार्हस्य यथादर्शनं लोपः। देवमुखमिव मुखं यस्य सः देवमुखः। घृतपूर्णो घटः घृतघटः। अविद्यमानं पापं यस्य सः अपापः। अत्र मुखपूर्णविद्यमानानां शब्दानां लोपः।"
        - sutraNo: "2.5.3"
          textDevanagari: "प्रकृतिश्च स्वरान्तस्य"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्वरान्तस्य शब्दस्य समासे विभक्तिलोपे च कृते प्रकृतिर्यथास्वरूपं भवति प्रत्ययलोपे प्रत्ययलक्षणम् इति वचनाद्यत्प्राप्तं तन्न भवति पितरि निपुणः पितृनिपुणः अत्र अर्ङाविति अर् प्राप्तः सखायं प्राप्तः सखिप्राप्तः। अत्र घुटि त्वै इति ऐत्वं प्राप्तम्।"
        - sutraNo: "2.5.4"
          textDevanagari: "व्यञ्जनान्तस्य यत्सुभोः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "व्यञ्जनान्तस्य शब्दस्य सुप्रत्यये भकारे च परे यत्कार्यं प्राप्तं तत्समासे विभक्तिलोपे च कृते भवति। विदुषः अर्थः विद्वदर्थः। अत्र न लोपः दत्वं च भवति। राज्ञः अर्थः राजार्थः। अत्र न लोपः। दिवं गतः द्युगतः। अत्र उत्वम्। षण्णामाश्रयः षडाश्रयः अत्रडत्वम्।"
        - sutraNo: "2.5.5"
          textDevanagari: "पदे तुल्याधिकरणे विज्ञेयः कर्मधारयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यत्र समासे तुल्याधिकरणे एकद्रव्यविषये उत्तरपदे परे पूर्वपदं समस्यते स समासः कर्मधारयसंज्ञो विज्ञातव्यः। ब्राह्मणी चासौ दारिका ब्राह्मणदारिका। कर्मधारयसंज्ञे तु पुंवद्भावो विधीयते इति पूर्वपदस्य पुंवद्भावः। तुल्याधिकरणे इति किम्? कल्याण्या दुहिता कल्याणीदुहिता। कर्मधारयसंज्ञया क्व प्रयोजनम्? कर्मधारयसंज्ञे तु पुंवद्भावो विधीयते इत्यत्र।"
        - sutraNo: "2.5.6"
          textDevanagari: "संख्यापूर्वो द्विगुरिति ज्ञेयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सङ्ख्यापूर्वः समासः द्विगुसंज्ञो ज्ञेयः ज्ञातव्यः। तद्धितानां ये अर्थास्तेषु सत्सु उत्तरपदे परे समाहारे चाभिधेये द्विगुरिष्यते। तद्धितार्थेषु तावत् पञ्चसु कपालेषु संस्कृतः पुरोडाशः पञ्चकपालः। अत्र संस्कृतेऽर्थे एवमादेरणिष्यते इत्यण्। तस्य द्विगोरलुगनपत्य इति तन्त्रान्तरात् लुक्। उत्तरपदे पञ्च गावो धनं यस्य सः पञ्चगवधनः। अत्र धनशब्दे उत्तरपदे पञ्चगव इति द्विगुसमासान्तगतेति गोशब्दादकारस्समासान्तः। पञ्चानां गवां समाहारः पञ्चगवम्। पूर्ववदकारसमासान्तः। पञ्चानां नदीनां समाहारः पञ्चनदम्। संख्याया नदीगोदावर्योरिति नदीशब्दादकारः समासान्तः इवर्णावर्णाविति ईकारलोपः द्विगुसंज्ञया क्व प्रयोजनम्? द्विगोरित्यत्र।"
        - sutraNo: "2.5.7"
          textDevanagari: "तत्पुरुषावुभौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "उभौ कर्मधारयः द्विगुश्च तत्पुरुषौ भवतः। कुत्सितश्चासौ अश्वः कदश्वः। एवं कदर्यः कर्मधारयस्य तत्पुरुषत्वात् कोः कत् इति कत् आदेशः। पञ्चानां गवां समाहारः पञ्चगवम्। द्विगुसमासस्य तत्पुरुषत्वाद्गोरतद्धितलुकीति टच् समासान्तः। सखिराजशब्दाभ्यां तत्पुरुष एव स्मर्यते। पञ्चानां राज्ञां समाहारः पञ्चराजी। द्विगोरिति ईप्रत्ययः। ईकारे स्त्रीकृतेल्लोप्य इति अकारलोपः।"
        - sutraNo: "2.5.8"
          textDevanagari: "विभक्तयो द्वितीयाद्या नाम्ना परपदेन तु समस्यन्ते समासो हि ज्ञेयस्तत्पुरुषस्स च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यत्र समासे द्वितीयाद्या विभक्तयो द्वितीयादिविभक्तान्तानि पदानि परपदेन नाम्ना समस्यन्ते स समासस्तत्पुरुषसंज्ञो ज्ञेयः ज्ञातव्यः। धर्मं श्रितः धर्मश्रितः। शङ्कुलया खण्डः शङ्कुलाखण्डः। यूपाय दारु यूपदारु। वृकेभ्यो भयं वृकभयम्। राज्ञः पुरुषः राजपुरुषः। अक्षेषु शौण्डः अक्षशौण्डः। परपदेनेतिकिम्? गतो ग्रामम्। तत्पुरुषसंज्ञया क्व प्रयोजनम्? नस्य तत्पुरुषे लोप इत्यत्र।"
        - sutraNo: "2.5.9"
          textDevanagari: "स्यातां यदि पदे द्वे तु यदि वा स्युर्बहून्यपि तान्यन्यस्य पदस्यार्थे बहुव्रीहिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यत्र समासे द्वे पदे स्यातां यदि वा बहूनि पदानि स्युः तानि पदानि अन्यस्य पदस्यार्थे वाच्ये सति समस्यन्ते स समासो बहुव्रीहिसंज्ञो भवति। दण्डैश्च दण्डैश्च यद्युद्धं तद्दण्डादण्डि इच्कर्मव्यतिहारे इति इच् समासान्तः। आकारो महतः कार्य इति कार्यग्रहणादाकारः इवर्णावर्णलोपः अव्ययं एतत् अव्ययाच्चेति सिलोपः। आरूढो वानरो यं वृक्षं सः आरूढवानरो वृक्षः। सहपुत्रेण वर्तते यः स सपुत्रः। सहभार्यया वर्तते यः स सभार्यः। ङिरौसपूर्व इति ज्ञापकात्सहशब्दस्य सभावः गोस्त्रियोरुपसर्जनस्येति उत्तरपदस्य ह्रस्वः। कृतः उपकारो येन स कृतोपकारः। रोचितो मोदको यस्मै स रोचितमोदकः। उद्धृतः ओदनो यस्या सा उद्धृतौदना स्थाली। चित्रा गावो यस्य स चित्रगुः। पुंवद्भाषितपुंंस्का इति चित्राशब्दस्य ह्रस्वः। शुद्धं जलं यस्याः सा शुद्धजला नदी। आसन्नाः दशानां ये ते आसन्नदशाः। एवं आसन्नविंशः आसन्नत्रिंशः। बहुव्रीहौ संख्येये डच् बहुगणादिति डच्। समासान्तः डानुबन्धेन्त्यस्वरादेर्लोपः बहूनि पदानि यथा। मत्ताः बहवो मातङ्गाः यत्र तत् मत्तबहुमातङ्गं वनम्। बहुव्रीहिसंज्ञया क्व प्रयोजनम्? बहुव्रीहौ चेत्यादिषु।"
        - sutraNo: "2.5.10"
          textDevanagari: "विदिक्तथा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विदिग्यत्र अन्यपदार्थाः स समासो बहुव्रीहिसंज्ञो भवति। दक्षिणस्याश्च पूर्वस्याश्च दिशो र्यदन्तरालं विदिक् सा दक्षिणपूर्वा। एवं उत्तरपूर्वा पूर्वोत्तरा पूर्वदक्षिणा दक्षिणपश्चिमा इत्याद्या उदाहार्याः। सर्वनाम्नो वृत्तिमात्रेण इति पूर्वपदानां पुंवद्भावः।"
        - sutraNo: "2.5.11"
          textDevanagari: "द्वन्द्वः समुच्चयो नाम्नोर्बहूनां वापि यो भवेत्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "एकस्यां क्रियायां अनेनकर्मादिसम्बन्धः समुच्चयः। यत्र समासेद्वयोर्नाम्निोः बहूनां वा नाम्नां समुच्चयः स समासो द्वन्द्वसंज्ञो भवति। स च द्वयोः अर्थयोरिष्यते। समाहारे इतरेतरयोगे च। यत्र समूहप्राधान्यं स समाहारः। यत्र पृथक्स्थितानां पदार्थानां स इतरेतरयोगः। पदार्थानां नित्यसंयोगो वा तत्र प्रायशः। प्राण्यङ्गानां सेनाङ्गानां तूर्याङ्गानां येषामस्थिरहितं शरीरं दृश्यते तेषां क्षुद्रजन्तूनां च समूहेनैव स्थितिदर्शनात्समाहार एव द्वन्द्वो भवति। पाणी च पादौ च तत्पाणिपादम्। शिरोग्रीवम्। जङ्घोरु। इति प्राण्यङ्गानाम्। तूर्याङ्गानां यथा मार्दङ्गिपाणविकम् वांशिकवैणविकम्। सेनाङ्गानां यथा हस्त्यश्वम् रथिकाश्वारोहम्। क्षुद्रजन्तूनां यथा यूकालिक्षम् दंशमषकम् अप्राणिनामपि फलादीनाम् प्रायशः समूहवृत्तित्वात्समाहार एव। बदरामलकम् आराशस्ति स्वरो ह्रस्वो नपुंसके इति ह्रस्वः। प्राणिनां तु पृथग्वृत्तित्वादितिरेतरयोग एव ब्राह्मणक्षत्रियौ। नित्यवैरिणां तुपरस्परविरोधात्समूहवृत्तित्वाभावेऽपि समाहार एव। येषां च विरोधः शाश्वतिक इति तन्त्रान्तरात् अहिनकुलम् मूषिकमार्जारम् बिडालोन्दुरुम्। एवमन्यत्रापि लक्ष्यानुसारेण समाहारे इतरेतरयोगे द्वन्द्वसमासो ज्ञेयः।"
        - sutraNo: "2.5.12"
          textDevanagari: "अल्पस्वरतरं तत्र पूर्वम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तत्र द्वन्द्वे यदल्पस्वरतरं तत्पूर्वमेव प्रयोज्यम्। धवखदिरौ प्लक्षन्यग्रोधौ तण्डुलकिण्वे उलूखलमुसले इत्यादौ पूर्वनिपातः। अर्चितत्वात्तरग्रहणाल्लघ्वक्षरस्य पूर्वानिपातः। कुशकाशम् अग्निसज्ञकस्य पूर्वनिपातः द्वन्द्वे घि इति तन्त्रान्तरात् अग्नीषोमौ ईदग्नेः सोमवर्णयोरितितन्त्रान्तरात् ईत्वम् अग्नेस्तुत्स्तोमसोम इति षत्वम्।"
        - sutraNo: "2.5.13"
          textDevanagari: "यच्चार्चितं द्वयोः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "द्वयोः नाम्नोः द्वन्द्वे यदर्शितं पूजितं तत्पूर्वमेव प्रयोज्यम् वासुदेवार्जुनौ मातापितरौ पितापुत्रौ। आनङ्यतो द्वन्द्व इति पूर्वपदान्त्य ऋकारस्यात्वम् ब्राह्मणक्षत्रियौ सूर्याचन्द्रमसौ देवताद्वन्द्वे चेति पूर्वपदान्त्यस्यात्वम्। जायापती भार्यापती अत्रापि पतिर्जायां प्रविशति गर्भो भूत्वेह जायते जायायाः तद्विजायात्वं यदस्यां जायते पुनरिति स्मरणाज्जायायाः अर्चितत्वम्। चशब्दात् क्वचिदनर्चितस्यापि पूर्वनिपातः। चन्द्रार्कौ शुक्रबृहस्पती कालकामौ काकमयूरौ शत्रुमित्रे इत्यादि द्वयोरितिकिं? सर्वज्वरान् घ्नन्तु तवानिरुद्रप्रद्युम्नसङ्कर्षणवासुदेवाः इति।"
        - sutraNo: "2.5.14"
          textDevanagari: "पूर्वं वाच्यं भवेद्यस्य सोव्यययीभाव इष्यते"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यस्य समासस्य पूर्वं पूर्वपदार्थो वाच्यं प्रधानं भवेत् स समासः अव्ययीभावसंज्ञ इष्यते। समीपं कुम्भस्य उपकुम्भम्। समृद्धिः कर्तृणां सुकर्तृ। अभावः पापानाम् अपापम्। अत्ययः शीतानाम् अतिशीतम्। पश्चाद्रथस्य अनुरथम्। विधिमनतिक्रम्य यथाविधि। स्थाने स्थाने यथास्थानम्। योयःस्वः यथास्वम्। येन येन प्रकारेण यथायथम्। इतिनिपातनात् आकारस्य ह्रस्वः। अवययीभावसंज्ञया क्व प्रयोजनम् अव्ययीभावादकारान्ताद्विभक्तीनामपञ्चम्या इत्यादिषु।"
        - sutraNo: "2.5.15"
          textDevanagari: "स नपुंसकलिङ्गः स्यात्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सोव्ययीभावसमासो न पुंसकलिङ्गो भवति। उक्तान्युदाहरणानि उपकुम्भमित्यादीनि।"
        - sutraNo: "2.5.16"
          textDevanagari: "द्वन्द्वैकत्वम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "द्वन्द्वस्य यदेकत्वं समाहारस्तत् नपुंसकलिङ्गं भवति पाणिपादम् बदरामलकम्।"
        - sutraNo: "2.5.17"
          textDevanagari: "तथा द्विगोः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "द्विगोः समासस्य नपुंसकत्वं भवति तथानेनैव प्रकारेण येनैवद्वन्द्वस्येत्यर्थः। पञ्चानां नदीनां समाहारः पञ्चनदम्। दशानां गवां समारारः दशगवम्। सङ्ख्याया नदीगोदावर्योः गोरतद्धितलुकीति च। अकारः समासान्तः। समाहारादन्यत्र यो द्विगुस्तस्य न भवति। पञ्चसु कपालेषु संकृतः पुरोडाशः पञ्चकपालः।"
        - sutraNo: "2.5.18"
          textDevanagari: "पुंवद्भाषितपुंस्कारूनूङपूरण्यादिषु स्त्रियां तुल्याधिकरणे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "भाषितपुंस्कायास्त्रीविशेषणं स्त्रीलिङ्गं अनूङ् रूङ्प्रत्ययरहितं मास्त्रीलिङ्गे पूरण्यदिवर्जिते तुल्याधिकरणे टाकद्रव्यविषये तुत्तरपदेपरेपुंवद्भवति पुंसियद्रूपंतदापद्यते इत्यर्थः दर्शनीयाभार्गायस्यसदर्शनीयभार्यः उत्तरपदस्यगोस्त्रियोरुपसर्जनस्य इति ब्रस्वः कल्याणीभार्याययम्यसकल्याणभार्यः एवं स्वरूपभार्यः भाषितपुंस्केतिकिम्? खट्वाभार्यायस्यसखट्वाभार्यः स्त्रीलिङ्गनिर्देशः किम्? अतिरिक्तलंगतिर्यस्यस अतिरिगतिः अतिनुजलं गतिर्यस्य स अतिनुगतिः पुंवद्भावेन ह्रस्वनिवृत्तिः स्यात् अनूज् इति किम्? ब्रह्मबन्धूभार्या यस्य स ब्रह्मबन्धूभार्यः ब्रह्मबन्धुशब्दात् रूङुतइत्प्रङ् ङकारः इहार्थः अपूरण्यदिष्वितिकिम्? कल्याणीपङ्चमीयासांताः कल्याणीपञ्चमारात्रयः अम्पूरण्योप्रामाण्योरित्यप् समासान्तः इवर्णावर्णलोपः स्त्रियामिति किम्? कल्याणीप्रधानं यासां ताः कल्याणीप्रधानाः तुल्याधिकरणे इति किं? कल्याण्यदुहिताकल्याणीदुहिताः।"
        - sutraNo: "2.5.19"
          textDevanagari: "संज्ञापूरणीकोपधात्तु न"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "संज्ञाभूतापूरणप्रत्ययान्ताककारोपधा च भाषितपुंस्का पुंवन्न भवति स्त्रीलिङ्गे तुल्याधिकरणे पदे पूर्वेणप्राप्तिः दत्ताभार्यायस्य स दत्ताभार्यः पाचिकाभार्यः पञ्चमीभार्यः नागरिकाभार्यः गाषिकाभार्यः नर्तकीभार्यः।"
        - sutraNo: "2.5.20"
          textDevanagari: "कर्मधारयसंज्ञे तु पुंवद्भावो विधीयते"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "संज्ञापूरणीकोपधानां कर्मधारयसंज्ञे समासे तुल्याधिकरणे स्त्रीलिङ्गे पूरण्यादिवर्जिते उत्तरपदेपरे पुंवद्भावो विधीयते पूर्वेण निषेधः यः प्राप्तः दत्ताचासौवृन्दारिका दत्तवृन्दारिका। पञ्चमवृन्दारिका।"
        - sutraNo: "2.5.21"
          textDevanagari: "आकारोमहतःकार्यस्तुल्याधिकरणे पदे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "महदित्यस्य आकारः कार्यः तुल्याधिकरणे पदे परे महांश्चासौ देवः महादेवः। महान् कायो यस्य स महाकायः तुल्याधिकरणे इति किम्? महतः पुत्रो महत्पुत्रः। कार्यग्रहणादन्यत्रापि पूर्वपदस्यात्वं भवति दण्डैश्च दण्डैश्च यद्युद्धं तद्दण्डादण्डि मातापितरौ पितापुत्रौ एकादश।"
        - sutraNo: "2.5.22"
          textDevanagari: "नस्य तत्पुरुषे लोपः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नस्यपदस्य तत्पुरुषे प्रसिद्धस्य उत्तरपदे परे नकारस्य लोपो भवति नब्राह्मणः अब्राह्मणः नवृषलः अवृषलः पदस्येति किम्? वामनपुत्रः।"
        - sutraNo: "2.5.23"
          textDevanagari: "स्वरेक्षरविपर्ययः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अतरयोर्विपर्ययः अक्षरविपर्ययः नस्यपदस्य अक्षरविपर्ययीभवति स्वरे परे न अश्वः अनश्वः न उष्ट्रः अनुष्ट्रः।"
        - sutraNo: "2.5.24"
          textDevanagari: "कोः कत्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कुशब्दस्य तत्पुरुषे प्रसिद्धस्य कत् आदेशो भवति स्वरे परे कुत्सितश्चासौवश्च कदश्वः तत्पुरुषे इति किम्? कुत्सित ऊष्मा अण्डे यस्य स कूण्माण्डः।"
        - sutraNo: "2.5.25"
          textDevanagari: "का त्वीषदर्थे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ईषदर्थे वर्तमानस्य कुशब्दस्य का आदेशो भवति ईषन्मधुरम् कामधुरम् एवं कालवणं काम्बम् ईष्दर्थे इति किम्? कुत्सितो देशः कुदेशः।"
        - sutraNo: "2.5.26"
          textDevanagari: "अक्षे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अक्षशब्दे उत्तरपदे परे कुशब्दस्य काआदेशो भवति। अनीषदर्थं वचनम् कुत्सितः अक्षः काक्षः।"
        - sutraNo: "2.5.27"
          textDevanagari: "पुरुषे तु विभाषया"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कुशब्दस्य पुरुषशब्दे परे काआदेशो भवति विभाषया विकल्पेन कुत्सितः पुरुषः कापुरुषः कुपुरुषो वा।"
        - sutraNo: "2.5.28"
          textDevanagari: "याकारौस्त्रीकृतौह्रस्वौक्वचित्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्त्रियां कृतौ स्त्रीकृतौ ईकारआकारौ उत्तरपदे परे ह्रस्वौ भवतः क्वचित् न सर्वत्र रेवति मित्रः रोहिणिदत्तः इष्टकाइषीका मालाएषांयथासंख्यं सचितसूलभारिन् एषु उत्रपादेषु परेषु अन्त्यस्य ह्रस्वो भवति इष्टकेषीकामालानां चितरुलभारिथितितन्त्रान्तरात् इष्टकामिश्चितम् इष्टकाचितम् इषीकायास्थूलं इषीकरूलम् मालां बिभर्तीति मालभारिणीकत्या क्वचिदिति वचनात् इहन भवति लक्ष्मीतरातन्त्रीकल्पा।"
        - sutraNo: "2.5.29"
          textDevanagari: "ह्रस्वस्य दीर्घता"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ह्रस्वस्य क्वचिद्दीर्घता भवति दीर्घो भवतीत्यर्थः अष्टसुकपालेषु संस्कृतः पुरोडाशः अष्टाकपालः द्व्यङ्गुलौकर्णौ यस्य स द्व्यङ्गुलाकर्णः एवं द्विगुणाकर्णः क्वचिदितिवचनादिहनभवति छिन्नकर्णः भिन्नकर्णः स्रुवकर्णः स्वस्तिकर्णः।"
        - sutraNo: "2.5.30"
          textDevanagari: "अनव्ययविसृष्टस्तुसकारं कपवर्गयोः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अनव्ययशब्दस्य विसृष्टो विसर्जनीयः कपवर्गयोः परयोः क्वचित्सकारमापद्यते जिह्वामूलीयोपध्मानीययोर्वाधः अनुन्तरपदस्थादकारात्परस्य विसर्जनीयस्य कृकमिकं स कुम्भपात्रकुशाकर्ण एषु परेषु समासे सतिः अतः कृकमिकं स कुम्भाकुशाकर्णेष्वनव्ययस्येति तन्त्रान्तरात् कृ अयस्कारः कामि अयस्कामः कंस अयस्कंसः कुम्भ अयस्कुम्भ पात्र अयस्पात्रम् कुशा अयस्कुशा कर्ण अयस्कर्णः उत्तरपदस्थात्तु अकारात् परस्य विसर्जनीयस्य न भवति उपयःकामः आकारादपि परस्य क्वचित्स्मर्यते भास्करः कपवर्गयोरिति कखपफा एव गृह्यन्ते तेनेह न भवति अयोघनः पयोबिन्दुः अनव्ययविसृष्ट इति किम्? स्वःकामः। अन्तःकामः।\n\nइति लघुवृत्तौ नामप्रकरणे समासपादः पञ्चमः॥"
    - padaId: "2-6"
      padaNo: "2.6"
      padaNameDevanagari: "तद्धितपादः"
      sutras:
        - sutraNo: "2.6.1"
          textDevanagari: "वाणपत्ये"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अपत्येऽर्थे लिङ्गादण् प्रत्ययो वा भवति। उपगोरपत्यम् औपगवः उपगुशब्दादण् णकारो वृद्धिरादौ सणे इत्यर्थः। आदिवृद्धिः उवर्णस्त्वोत्वमापाद्य इति ओत्वम्। पक्षे उपगोरपत्यं उपग्वपत्यमिति समासवाक्ये भवतः। संख्यासंभद्रपूर्वायामातुरणि परे ऋकारस्य उरादेशो भवति। मातुरुत्संख्यासंभद्रपूर्वाया इति तन्त्रान्तरात् षाण्मातुरः सांमातुरः भाद्रमातुरः। कन्याया अणि परे कनीनादेशो कानीनो व्यासः कानीनः कर्णः।"
        - sutraNo: "2.6.2"
          textDevanagari: "ण्य गर्गादेः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "गर्गादेर्गणादपत्येऽर्थे ण्यप्रत्ययो वा भवति। गर्गस्यापत्यं गार्ग्यः वात्स्यः। पक्षे गर्गस्यापत्यं गर्गापत्यमिति। पौत्रादावपत्ये प्रत्ययोऽयं स्मर्यते तेन गर्गस्य पुत्रो गार्गिः इण्णतः इति इण्।"
        - sutraNo: "2.6.3"
          textDevanagari: "पत्यन्ताश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "प्रजापतेरपत्यं प्राजापत्यः गार्हस्पत्यः दित्यदित्योरेयण्च दैत्यः दैतेयः आदित्यः आदितेयः गर्गवत्सवजसङ्कृतिव्याघ्रपात् शाण्डिल्यमुद्गलविदभृत् इत्याद्या गर्गादयः।"
        - sutraNo: "2.6.4"
          textDevanagari: "कुञ्जादेरायनण्स्मृतः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कुञ्जादेर्गणात् अपत्येऽर्थे आयनण् प्रत्ययोभवति। तदन्ताच्च स्वार्थे ण्यप्रत्यय इष्यते। स च स्त्रियां बहुत्वेनेष्यते। कौञ्जायन्यः कौञ्जायन्यौ कौञ्जायनाः कौञ्जायनी। एवं ब्राध्नायन्यः ब्राध्नायन्यौ ब्राध्नायनाः ब्राध्नायनी जातेरयोपधादिति ईप्रत्ययः कुञ्जब्रध्नरणनभचरलिगुलोह इत्याद्या कुञ्जादयः।"
        - sutraNo: "2.6.5"
          textDevanagari: "स्त्र्यत्र्यादेरेयण्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्त्रीप्रत्ययान्तेभ्यः अत्र्यादिभ्यश्च अपत्येर्थे एयण्प्रत्ययो भवति सुपर्णाया अपत्यं सौपर्णेयः वैनतेयः गाङ्गेयः नद्या अपत्यं नादेयः एवं माहेयः रौहिणेयः अत्र्यादिभ्यः आत्त्रेयः नैधेयः पितृस्वसृमातृस्वसृभ्यामेयण् ईवर्णौ इष्येते एयणि वानुलोपश्च पितृष्वसुरपत्यं पैतृश्वस्रेयः पैतृश्वसेयः पैतृश्वस्रीयः। एवं मातृश्वस्रेयः मातृश्वसेयः मातृश्वस्रीयः कल्याण्यादीनामेयणिपरे अन्त्यस्य इनादेशो भवति कल्याण्यादीनामिनङ्ङितितन्त्रान्तरात् कल्याण्या अपत्यं काल्याणिनेयः सुभगाया अपत्यं सौभागिनेयः हृद्भगसिन्ध्वन्ते पूर्वपदस्येति तन्त्रान्तादुभयपदवृद्धिः अत्त्रिनिधिशुद्धविष्टिमृकाण्डकृक्रतास इत्याद्या अत्त्र्यादयः।"
        - sutraNo: "2.6.6"
          textDevanagari: "इण्णतः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अतः अकारान्तात् लिङ्गादपत्येर्थे इण् प्रत्ययो भवति दक्षस्यापत्यं दाक्षिः प्लाक्षिः।"
        - sutraNo: "2.6.7"
          textDevanagari: "बाह्वादेश्चविधीयते"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "बाह्वादेर्गणात् अपत्येर्थे इण् भवति बाहोरपत्यं बाहविः औपचाकविः औपबिन्दविः बालाकिः सौमित्त्रिः औडुलोमिः शारलोमिः पौष्करसादिः उडुलोमन् शरलोमन् इत्येतयोः नस्य तुक्वचिदिति नलोपः पुष्करसद् शब्दस्य अनुशतिकादीनां चेत्युभयपदवृद्धिः जाङ्घिः दैवशर्मिः सुधातृव्यासवरुटनिषादचण्डालबिम्बानामिनिपरे अन्त्यस्य अक आदेश इष्यते सुधातुरपत्यं सौधातकिः वैयासकिः य्वौर्वृद्धिरागम इति यकारात्पूर्वम् ऐकारागमः वारुटकिः नैषादकिः चाण्डालकिः बैम्बकिः बाहु उपचाक्वः उपबिन्दुः बलाका सुमित्त्रा उडुलोमन् शरलोमन् पुष्करसद् जङ्घादेवशर्मन् इत्यादयोबाह्वादयः।"
        - sutraNo: "2.6.8"
          textDevanagari: "रागान्नक्षत्रयोगाच्च समूहात्सास्य देवता।\nतद्वेत्त्यधीते तस्येदमेवमादेरणिष्यते॥"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "रागात् राज्यतेयेन स रागः रागवाचिनः शब्दात् अण् भवति। तेन रक्तमित्यत्रार्थे कषायेण रक्तं काषायम् कुसुम्भेन रक्तं कौसुम्भम् कौङ्कुमम् हारितालम्।\n\nनक्षत्रयोगाच्च नक्षत्रेण योगेमम्यमाने नक्षत्रयोगात् अण् भवति पुष्येण युक्ता पौर्णमासी पौषी तैषी तिष्यपुष्ययोर्नक्षत्राणीति तन्त्रान्तरात् यलोपः सापौर्णमासी यस्य मासस्य स पौषः तैषः सास्मिन्पौर्णमासीति संज्ञाया मिति ईप्रत्ययान्तादण् इवर्णावर्णलोपः एवं मघाभिर्युक्ता पौर्णमासी फाल्गुणीमा यस्य मासस्य स फाल्गुणः चित्रयायुक्तापौर्णमासी चैत्री सा यस्य मासस्य स चैत्रः विशाखया युक्ता पौर्णमासी वैशाखी सा यस्य मासस्य स वैशाखः ज्येषठया युक्ता पौर्णमासी ज्यैष्ठी सा यस्य मासस्य सज्यैष्ठः आषाढाभिर्युक्ता पौर्णमासी आषाढी सा यस्य मासस्य स आषाढः श्रवर्णेन युक्ता पौर्णमासी श्राणी सायस्य मासस्य स श्रावणः भद्रपदाभिर्युक्तापौर्णमासी भाद्रपदी सायस्य मासस्य स भाद्रपदः अश्वयुग्भ्यां युक्तापौर्णामासी आश्वयुजी सा यस्य मासस्य स आश्वयुजः कृत्तिकाभिर्युक्ता पौर्णमासी कार्तिकी सायस्य मासस्य स कार्तिकः मृगशीर्षेणयुक्ता पौर्णमासी मार्गशीर्षी सा यस्य मासस्य स मार्गशीर्षः।\n\nसमूहात् समूहेर्थे लिङ्गात् अण् भवति कपोतानां समूहः कापोतम्। शुकानां समूहः शौकम्। मायूरम्। तित्तिरीणां समूहः तैत्तिरम् गर्भिणीनां समूहः गार्भिणम् इवर्णावर्णलोपः।\n\nसास्य देवता लिङ्गात् सा अस्य देवता इत्यत्रार्थे अण् भवति शिवोदवता अस्येति शैवः विष्णुर्देवतास्येति वैष्णवः एवं बौद्धः।\n\nतद्वेत्त्यधीते लिङ्गात् तद्वेत्तितदधीते इत्यर्त्रार्थे अण् भवति छन्दोवेत्त्यधीतेवा छान्दसः व्याकरणं वेत्त्यधीते वा वैयाकरणः य्वोर्वृद्धिरागमइति यकारात्पूर्वऐकारागमः।\n\nतस्येदम् लिङ्गात् तस्येदमित्यत्रार्थे अण् भवति मृगस्येदं मार्गं चर्म वेणोरयं वैणवो दण्डः।\n\nएवमादेरणिष्यते एवमादावित्यत्रार्थे अण् भवति तत्र भवः स्रुघ्ने भवः स्रौघ्नः एवं कान्यकुब्जः मथुरायां भवः माथुरः तत आगतः स्रुघ्नादागतः स्रौघ्नः तत्र जातः स्रघ्ने जातः स्रौघ्नः।"
        - sutraNo: "2.6.9"
          textDevanagari: "तेन दीव्यति संसृष्टं तरतीकण् चरत्यपि।\nपण्याच्छिल्पान्नियोगच्च क्रीतादेरायुधादपि॥"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तेन दीव्यति लिङ्गात्तेन दीव्यतीत्यत्रार्थे इकण् भवति तेन दीव्यति अक्षैर्दीव्यति आक्षिकः शलाकाभिर्दीव्यति शालाकिकः।\n\nसंसृष्टम् तेन संसृष्टमित्यत्रार्थे इकाण् भवति दध्ना संसृष्टं दाधिकम्।\n\nतरति लिङ्गात्तरतीइत्यत्रार्थे इकण् भवति नावा तरति नाविकः उडुपेन तरति औडुपिकः वैणुभारिकः।\n\nइकण्चरत्यपि लिङ्गात्तेन चरतीत्यत्रार्थे इकण् भवति। शकटेन चरति शाकटिकः आश्विकः औष्ट्रिकः चरतिर्जीवनेपि वर्तते वेतनेन चरति वैतनिकः व्यावहारिकः व्यापारिकः य्वोर्वृद्धिरागमोनेष्यते स्वागतादीनां चेतितन्त्रान्तरात्।\n\nपण्यात् पण्यं विक्रेयमुच्यते पण्यवाचिनोलिङ्गात् तदस्य पण्यमित्यत्रार्थे इकण्भवति लवणं पण्यमस्य लावणिकः गन्धः पण्यमस्य गान्धिकः।\n\nशिल्पात् लिङ्गात्तदस्यशिल्पमित्यत्रार्थे इकण् भवति मृदङ्गः शिल्पमस्य मार्दङ्गिकः पाणविकः।\n\nनियोगाच्च नियुज्यते यत्र स नियोगः नियोगवाचिनः शब्दात् तत्रनियुक्त इत्यत्रार्थे इकण् भवति द्वारे नियुक्तः दौवारिकः द्वारादीनां चेति वकारात्पूर्वऔकारागमः।\n\nक्रीतादेः क्रीदादावर्थे लिङ्गात् इकण् भवति तेन क्रीतं षष्ट्या क्रीतं षाष्टिकम् सपुत्याक्रीतं साप्ततिकम्।\n\nआयुधात् तदस्यायुधमित्यत्रार्थे इकण्भवति खड्गा आयुधं यस्य स खाड्गिकः प्रासिकः।"
        - sutraNo: "2.6.10"
          textDevanagari: "नावस्तार्येविषाद्वध्येतुलयासस्मितेपि च तत्र साधौ च यः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नौशब्दात्तेन तार्यमित्यत्रार्थे विषशब्दात् तेन वध्य इत्यत्रार्थे तुलाशब्दात्तृतीयान्तात् सम्मिते चार्थे लिङ्गात्तत्र साधुरित्यत्रार्थे च य प्रत्ययो भवति नावा तार्यं नाव्यम् विषेणवश्यः विष्यः तुलयासम्मितं तुल्यम् अपिशब्दात् वयस् शब्दात् तेन तुल्य इत्यत्रार्थे च य प्रत्ययो भवति वयसातुल्योवयस्यः कर्मणिसाधुः कर्मण्यः शरणेसाधुः शरण्यः।"
        - sutraNo: "2.6.11"
          textDevanagari: "ईयस्तुहिते"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "लिङ्गात्तस्मैहितमित्यत्रार्थे ईयप्रत्ययो भवति। अश्वेभ्योहितं अश्वीयम् करभीयम् शरीरावयवाद्यः दन्तेभ्योहितं दन्त्यम् कर्ण्यम् कण्भ्यम्।"
        - sutraNo: "2.6.12"
          textDevanagari: "यदुगवादितः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "उवर्णान्तात् लिङ्गात् गवादिभ्यश्च हितेर्थे यत् भवति शङ्क्तभ्योहितं शङ्कव्यम् दा. परशवेहितं परशव्यं शस्त्रम् वध्वैहितं वधव्यं वासः गवादिभ्यः गोभ्योहितं गव्यम् हविष्यम् यशस्यम् आयुष्यम् धन्यम् अर्घ्यम् वृष्यम् ब्रह्मण्यः येभ्यः शब्देभ्यो हितेर्थे यप्रत्ययोदृश्यते तेगवादयः।"
        - sutraNo: "2.6.13"
          textDevanagari: "उपमानेवतिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "उपमानवाचिनः शब्दात् वतिप्रत्ययो भवति इकार उच्चारणार्थः वेदमिवाधीतेवेदवत् क्षत्रिय इव क्षत्रियवत् मधुरायामिवमधुरावत्।"
        - sutraNo: "2.6.14"
          textDevanagari: "तात्वौभावे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "भवतोस्मादभिदानप्रत्ययावितिभावः येनहेतुना पदार्थे शब्दज्ञाने प्रवर्त्तेते तस्मिन्नभिधेये लिङ्गात्तात्वौ प्रत्ययौ भवतः स च जातिगुणक्रियाख्याभेदेन चतुर्वागोभावः गोतागोत्वम् शुक्तता शुक्तत्वम् पाचकता पाचकत्वम् डित्थता डित्थत्वम्।"
        - sutraNo: "2.6.15"
          textDevanagari: "यण्चप्रकीर्तितः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "भावेर्थे लिङ्गात् यण् प्रकीर्तितः पूर्वाचार्यैः चशब्दात् तात्वौच वर्णादिभ्यो दृढादिभ्यश्च भावेर्थे यण् पूर्वाचार्यैरुक्तः इहापिभवतीत्यर्थः शुक्लस्य भावः शौक्ल्यम् कृष्णस्य भावः कार्ष्ण्यम् एवं लौहित्यम् धौमर्यम् शुक्लस्य भावः शुक्लता शुक्लत्वमित्यादि दृढादिभ्यश्च दृढस्यभावः दार्ढ्यम् सौहितयम् सौकर्यम् नैर्घृण्यम् नै.ह्यम् लालित्यम् चातुर्यमित्यादि।"
        - sutraNo: "2.6.16"
          textDevanagari: "तदस्यास्तीतिसन्त्वाद्याः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "लिङ्गात्तदस्यास्तीत्यत्रार्थे सन्त्वादयः प्रत्ययाभवन्ति इतिशब्दोर्थान्तरेपि सन्त्वादीनां प्रवृत्त्यर्थः तेन तदस्मिन्नस्तीत्यत्राप्यर्थे भवन्ति गावोस्यसन्तीति गोमान् देवदत्तः गावोस्मिन्सन्तिगोमान्देशः एवमग्निमान्विप्रः पर्वतोवा सकारान्तात् मकारोपधात् अवर्णान्तात् अवर्णोपधात् धुडन्ताच्चशिड्वर्जितात् वन्तुरिष्यते यवादीन्वर्जयित्वा मकारान्तात् किंवान् शंवान् इदं वान् मकारोपधात् भ्रमीवान् शमीवान् अवर्णान्तात् धनवान् मालावान् अवर्णोपधात् सुगण्वान् सरस्वान् धुडन्तात् विद्युत्वान् ससित्वान् शिड्वर्जितादितिवचनादिहनभवति सर्पिष्मान् आयुष्मान् यवादीनामपिवर्जितत्वान्मन्तुरेव यवमान् र्थर्मिमान् असन्तान्मायामेधाश्रग्भ्यश्च विन्नपिभवति यशस्वी तपस्वी मायावी मेधावी स्रग्वी आमयान्दीर्घश्च आमयावीवन्तुरपि एभ्यो भवति यशस्वानित्यादि अकारान्तात् व्रीह्यादिभ्यश्च इन्निष्यते दाण्डीचक्रीवज्रीच्छत्री व्रीह्यादिभ्यइन् व्रीहीकेदारः शिखाशिखी माया मायी दंष्ट्रा दंष्ट्री घोणाघोणी इन् हस्तदन्तकराङ्ङातौ हस्ती दन्ती करी अन्यत्रहस्तवानित्यादि वर्णाद्ब्रह्मचारिवर्णी वर्णवा नन्यः एवमन्येपि मन्त्वा.अनुसरणीयः।"
        - sutraNo: "2.6.17"
          textDevanagari: "सङ्ख्ययाः पूरणेडसौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "पूर्यते येन सपूरणः पूरणेर्थेसङ्ख्ययाः डसौप्रत्ययौ भवतः चतुर्णां पूरणश्चतुर्थः एकादशानां पूरणः एकादशः अनेनडः अन्तस्थोडेर्षोरितिषकारागमः ह्रस्वस्यदीर्घतेति एकशब्दस्यदीर्घः द्वादशः त्रयोदशः अष्टादशः द्व्यष्टनोः सङ्ख्ययामिति द्व्यष्टनोरात्वम् इदमोरेफथकारयोः परयोः यथासङ्ख्यं एत इत् आदेशौ भवतः अस्मिन्काले एतर्हि अनेन प्रकारेण इत्थम्।"
        - sutraNo: "2.6.18"
          textDevanagari: "तेषुत्वेतदकारताम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तेषु तसादिषु परेषु एतद्शब्दः अकारतां प्राप्नोति अकारः सम्पद्यते इत्यर्थः अडः अत्र।"
        - sutraNo: "2.6.19"
          textDevanagari: "पञ्चस्यास्तम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "किंबहुशब्दाभ्यां द्व्यादिगणवर्जितात्सर्वनाम्नश्च पञ्चस्यन्तेभ्यः तस् प्रत्ययो भवति कस्मात् कुतः उहोः कुरितिकुआदेशः बहुभ्यः बहुतः सर्वतः विश्वतः यतः ततः उभाभ्यां उभयतः अमुतः उत्वंमात् एकतः अद्व्यादेरिति किंद्वाभ्याम्।"
        - sutraNo: "2.6.20"
          textDevanagari: "त्रसप्तस्याः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "किंबहुसर्वनामभ्यः सप्तस्यन्तेभ्यः त्रप्रत्ययो भवति कस्मिन् कुत्र बहुषु बहुत्र सर्वत्र यत्र तत्र उभयत्र एकस्मिन् एकत्र अद्भ्यादेरिति किं द्वयोः त्वयिमयिभवति।"
        - sutraNo: "2.6.21"
          textDevanagari: "इदमोहः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "इदमः सप्तस्यन्तात् हप्रत्ययोभवति अस्मिन् इह।"
        - sutraNo: "2.6.22"
          textDevanagari: "किमः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "किंशब्दात् सप्तस्यन्तात् हप्रत्ययो भवति कुहछान्दसएवायं प्रयोगः।"
        - sutraNo: "2.6.23"
          textDevanagari: "अत्क्वच"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "किमः सप्तस्यन्तात् अत्प्रत्ययो भवति किमश्चक्वआदेशः उकारो वैचित्र्यार्थः कस्मिन् क्व।"
        - sutraNo: "2.6.24"
          textDevanagari: "उहोः कुः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "किमः उकारहकारयोः परयोः कुआदेशोभवति कुतः .त्रकुह तहोरितिकं कस्मिन्काले कदा किं क इति क आदेशः।"
        - sutraNo: "2.6.25"
          textDevanagari: "काले किंसर्वयदेकान्येभ्य एवदा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "किंसर्वयत् एक अन्य एभ्यः सप्तस्यन्तेभ्यः कालविषयेदाप्रत्ययो भवति कस्मिन्काले कदा एवं सर्वदा यदा तदा एकदा अन्यदा काले इतिकिं कस्मिन्देशे कुत्र सर्वत्र यत्र तत्र एकत्र अन्यत्र।"
        - sutraNo: "2.6.26"
          textDevanagari: "इदमोर्ह्यधुनादानीम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "इदम्शब्दात् सप्तस्यन्तात् कालविषये र्हिअधुना दानीम् इत्येतेप्रत्ययाभवन्ति अस्मिन्काले एतर्हि रषोरेतेत् इति एत आदेशः अधुना तत्रेदमिरिति इत्वं तस्य इवर्णावर्णलोपः इदानीम् काले इतिकिं अस्मिन्देशे इह।"
        - sutraNo: "2.6.27"
          textDevanagari: "दादानीमौतदः स्मृतौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तदः तच्छब्दात् सप्तस्यन्तात् दादानीमौप्रत्ययौ स्मृतौ पूर्वाचार्यैः तस्मिन्काले तदा तदानीम् किमश्चत्पिप्रत्ययोपीष्यते तस्मिन्काले तर्हि कर्हि काले इति किंकुत्र तत्र।"
        - sutraNo: "2.6.28"
          textDevanagari: "सद्यआद्यानिपात्यन्ते"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सद्यआद्याशब्दानिपात्यन्ते साधुत्वेन त्रेस्त्रयमितित्रिशब्दस्य त्रयम् आदेशः नान्तात्सङ्ख्यशब्दान्सः पञ्चमः सप्तमः नवमः दशमः।"
        - sutraNo: "2.6.29"
          textDevanagari: "द्वेस्तीयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "द्विशब्दात्पूरणेर्थेतीयप्रत्ययो भवति द्वयोः पूरणे द्वितीयः।"
        - sutraNo: "2.6.30"
          textDevanagari: "त्रे.च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "त्रिशब्दात्पूरणेर्थे तीयप्रत्ययो भवति त्रेश्चतृआदेशः त्रयाणां पूरण.तीयः।"
        - sutraNo: "2.6.31"
          textDevanagari: "अन्स्थोडेषोः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "रेफषकारान्तायाः सङ्ख्ययाः डप्रत्यये परे षकारा.मो भवति कति पयानां पूरणः कति पयथः कतीनां पूरणः कतिषः।"
        - sutraNo: "2.6.32"
          textDevanagari: "विंशत्यादेस्तमट्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विंशत्यादेर्गणात् पूरणेर्थे तमट् प्रत्ययो भवति विंशतेः पूरणोविंशतितमः त्रिंशतः पूरणः त्रिंशत्तमः टकारईप्रत्ययार्थः उत्तरत्रनित्यग्रहणादिहविकल्पः तेनपक्षेडोपि भवति विंशः त्रिंशः तेर्विंशतेरपि इति तिशब्दस्य अन्त्यस्वरादिलोपः विंशति त्रिंशत् चत्वारिंशत् पञ्चाशत् षष्ठिसप्तति अशीति नवति विंशत्यादयः।"
        - sutraNo: "2.6.33"
          textDevanagari: "नित्यंशतादेः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "शतादेः सङ्ख्ययाः पूरणेर्थेनित्यं .मट् प्रत्ययो भवति डस्यबाधः शतस्य पूरणः शततमः सहस्रतमः अयुततमः।"
        - sutraNo: "2.6.34"
          textDevanagari: "षष्ट्याद्यतत्परात्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "षण्ट्यदेः सङ्ख्यशब्दात् अतत्परात् पूरणेर्थे नित्यं तसण् प्रत्ययो भवति षष्ठेः पूरणः षष्ठितमः सप्ततितमः अशीतितमः नवतितमः सङ्ख्यपरात्तुविंशत्यादेस्तसडितिविकल्प एव एक षष्ठेः पूरणः एकषष्ठः एकषष्ठितमः द्वासप्ततः द्वासप्ततितमः।"
        - sutraNo: "2.6.35"
          textDevanagari: "विभक्तिसंज्ञाविण्णेयावक्ष्यन्ते तः परं तुये अद्भ्यादेः सर्वनाम्नस्तुकिंबहोश्चपराः स्मृताः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अतः एतस्मात्सूत्रात्परमनन्तरं येप्रत्ययावक्ष्यन्ते ते विभक्तिसंज्ञाविण्णेयाविज्ञातव्याः तेचद्व्यादिगणवर्जितात्सर्वनाम्नः किंबहुशब्दाभ्यां च परः स्मृताः पूर्वाचार्यैः ततः तत्र कुत- कुत्र बहुतः बहुत्र विभक्तित्वात्त्यदादित्वम्।\n\n६५, १११"
- prakaranaId: "akhyata"
  prakaranaNameDevanagari: "आख्यात-प्रकरणम्"
  padas:
    - padaId: "3-1"
      padaNo: "3.1"
      padaNameDevanagari: "परस्मैपादः"
      sutras:
        - sutraNo: "3.1.1"
          textDevanagari: "अथ परस्मैपदानि नव"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अथशब्दः आनन्तर्यार्थः मङ्गलार्थश्च। संज्ञाधिकारोऽयम्। वर्तमाना ति तस् अन्ति इत्यादिषूपतिष्ठते। यानित ऊर्ध्वं प्रत्ययाननुक्रमिष्यामस्तेषु यानि नव नव वचनानि तानि परस्मैपदसंज्ञानि भवन्ति।\nपरस्मैपदसंज्ञया क्व प्रयोजनम्? शेषाः कर्तरि परस्मैपदमित्यादिषु। षडाद्याः सार्वधातुकमित्यतः प्रागयमधिकारः।"
        - sutraNo: "3.1.2"
          textDevanagari: "पराण्यात्मने"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अयमपि संज्ञाधिकारः। ते आते अन्ते इत्यादिषूपतिष्ठते। वर्तमानादीनां विभक्तीनां यानि पराणि नव नव वचनानि तान्यात्मनेपदसंज्ञानि भवन्ति। आत्मनेपदसंज्ञया क्व प्रयोजनम्? आत्मनेपदानि भावकर्मणोरित्यादिषु।"
        - sutraNo: "3.1.3"
          textDevanagari: "त्रीणि त्रीणि प्रथममध्यमोत्तमाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "परस्मैपदानामात्मनेपदानां च यानि त्रीणि त्रीणि वचनानि तानि प्रथममध्यमोत्तमसंज्ञानि भवन्ति।\nति तस् अन्ति इति प्रथमः\nसि थस् थ इति मध्यमः\nमि वस् मस् इत्युत्तमः इति परस्मैपदानाम्।\nआत्मनेपदानां यथा\nते आते अन्ते इति प्रथमः\nसे आथे ध्वे इति मध्यमः\nए वहे महे इत्युत्तमः।\nएवं सप्तम्यादिषु ज्ञेयम्। प्रथममध्यमौत्तमानां पुरुषसंज्ञापि बोद्धव्या युगपद्वचने परः पुरुषाणामिति पुरुषग्रहणात्।\nप्रथममध्यमोत्तमसंज्ञया क्वप्रयोजनम्? नाम्निप्रयुज्यमानेऽपि प्रथमः युष्मदिमध्यमः अस्मद्युत्तम इत्यादिषु।"
        - sutraNo: "3.1.4"
          textDevanagari: "युगपद्वचने परः पुरुषाणाम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "परिभाषेयम् प्रथममध्यमोत्तमानां युगपद्वचने तुल्यकालमभिधानेसति यः परः पुरुषः स एव भवतीति परिभाष्यते। एकस्मिन्धात्वर्थे यदा नाम सन्निहितं भवति युष्मदस्मदी च तदा प्रथममध्यमोत्तमा अनियमेन प्राप्नुवन्तीति नियमः क्रियते।\nस च त्वं च अहं च पचामः।\nस च त्वं च पचथः।\nत्वं च अहं च पचावः।\nडुपचंष् पाके डुकारः ड्वनुबन्धात्त्रिमगित्यर्थः षकारः षानुबन्धभिदादिभ्य इत्यर्थः। वर्तमाना मस् षस् वस् अन्विकरणः कर्तरीति अन् नकारः अनिचविकरणे इत्यर्थः अस्यवमोर्दीर्घः।"
        - sutraNo: "3.1.5"
          textDevanagari: "नाम्नि प्रयुज्यमानेऽपि प्रथमः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नाम्नि प्रयुज्यमाने सति धातोः प्रथमः पुरुषो भवति।\nस पचति तौ पचतः ते पचन्ति।\nअपि शब्दादप्रयुज्यमानेऽपि पचति पचतः पचन्ति। पच् ति तस् अन्ति अन्वि असन्ध्यक्षरलोपः।"
        - sutraNo: "3.1.6"
          textDevanagari: "युष्मदि मध्यमः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "युष्मदि प्रयुज्यमाने सति धातोः मध्यमः पुरुषो भवति। अपिशब्दादप्रयुज्यमानेऽपि।\nत्वं पचसि युवां पचथः यूयं पचथ।"
        - sutraNo: "3.1.7"
          textDevanagari: "अस्मद्युत्तमः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अस्मदि प्रयुज्यमाने सति धातोः उत्तमः पुरुषो भवति। अपिशब्दादप्रयुज्यमानेऽपि।\nअहं पचामि आवां पचावः वयं पचामः। वर्तमाना मि वस् मस् अन्वि अस्यवमोर्दीर्घः।"
        - sutraNo: "3.1.8"
          textDevanagari: "अदाब्दाधौ दा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "डुदाञ् दाने, दाण् दाने, देङ् रक्षणे, दो अवखण्डने दारूपाश्चत्वारः डुधाञ् दानधारणयोः धेट् पाने धारूपौ द्वौ दाधाइत्येते द्वेरूपे दासंज्ञे भवतः, दाप् लवने दैप्शोधने इत्येतौ वर्जयित्वा।\nदीयते धीयते दाधा वर्तमाना ते सार्वधातुके यण् सन्ध्यक्षरान्तानामाकारो विकरणे इत्याकारः। णकारः नणकारानुबन्धचेक्रीयितयोरित्यर्थः। दामा गायतीत्याकारस्य ईकारः। डुशब्दः ड्वनुबन्धात्त्रिमक्तेननिवृत्त इत्यर्थः। ञकारः इञ्ञ्यजादेरुभयमित्यर्थः। दाणो एकारः दानो यच्छ इत्यर्थः। ङकारः आत्मनेपदार्थः टकारः श्विधेटोर्वेत्यर्थः। पकारः इहार्थः अदाबितिकिम्? दायन्ते व्रीहयः दायन्ते भाजनानि। दाप् लवणे दैप् शोधने वरन्तमाना अन्ते प्राग्वत् यण् सन्ध्यक्षरान्तानामाकारः असन्ध्यक्षरलोपः। दासंज्ञया क्व प्रयोजनम्? दामा गायति पिबति स्थास्यति जहातीनामीकारो व्यञ्जनादावित्यादिषु।"
        - sutraNo: "3.1.9"
          textDevanagari: "क्रियाभावो धातुः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यः शब्दः क्रियां भावयति व्यापारं प्रतिपादयति सधातुसंज्ञो भवति।\nभवति भूत्तायाम् वर्तमानाति अन्वि नाम्यन्तयोरिति गुणः अत्ति। अदभक्षणे ति अन्वि अदादेर्लुक् अघोषेष्वशिटाप्रथम इति दस्यतः।\nधातुसंज्ञया क्व प्रयोजनम्? धातोश्चहेतावित्यादिखषु"
        - sutraNo: "3.1.10"
          textDevanagari: "काले"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अधिकारोयम् इत उत्तरं यद्वक्षामः तत्र काले इत्युपतिष्ठते तासां स्वसंज्ञाभिरित्यतः प्रागयमधिकारः। सम्प्रतिवर्तमाना सम्प्रतिवर्तमाने काले वर्तमानाविभक्तिर्भवति पचति पचतः पचन्ति पच् वर्तमाना ति तस् अन्ति अन्वि असन्ध्यक्षरलोपः।"
        - sutraNo: "3.1.11"
          textDevanagari: "स्मनेनातीते"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्मशब्देन योगे सति वर्तमानाविभक्तिः अतीते काले भवति।\nइति स्म माता ब्रवीति। इति स्म उपाध्यायाः कथयति।\nब्रूञ् व्यक्तायां वाचि वर्तते अन्वि अदादेर्लुक् ब्रुवईड्ववचनादिति ईट् टकार इटश्चेटीत्यर्थः नाम्न्तयोरिति गुणः। कथ वाक्यप्रबन्धे षुरादेश्चेति इन् नकारः इनिलिङ्गस्येत्यर्थः। अस्य चलोपः कथि इति स्थिते ति अन्वि गुणः इकारस्य यकारः।"
        - sutraNo: "3.1.12"
          textDevanagari: "परोक्षा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "धातोरतीते काले परोक्षाविभक्तिर्भवति।\nचकारवामनं रूपं जहार पृथिवीं बलेः।\nजघानसमरे कंसं यस्तस्मै हरये नमः॥\nचकार जहार जघान।\nडुकृञ् करणे हृञ् हरणे हनहिंसागत्योः परोक्षा अट् टकारः अकारादटऔइत्यर्थः चण् परोक्षेति द्विर्वचनम्। अभ्यासस्यादिव्यञ्जनमवशेष्यमिति नलोपः अकारटवर्णस्येति अभ्यासटकारस्य अकारः क्वर्गस्य चवर्ग इति कस्य चः होजः इति हस्य जः हनेः अभ्यासाश्चेति हस्यधः अस्योपधेतिवृद्धि दीर्घौ।"
        - sutraNo: "3.1.13"
          textDevanagari: "भूतकरणवत्यश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अद्धात्वादिरिति धातोः प्राक् यः अकारः सभूतकरणमुच्यते भूतकरणवत्यो विभक्तयः ह्यस्तनी अद्यतनी क्रियातिपत्तयः अतीते काले भन्ति। ह्यस्तनी तावत् अकरोत् अहरत् कञ् ह्यञ् ह्यस्तनीदि इकारोव्यञ्जनाद्दिस्योरित्यर्थः अद्धात्वादिह्यस्तन्यद्यतनीक्रियाति पत्तिष्विति धातोः प्रागकारागमः कृञः तनादेरुरिति उविकरणः करोतेरितिगुणः ह्यञः अनिचविकरणे इति गुणः पदान्ते धुटां प्रथम इति दस्यतः अद्यतनीयथा अकार्षीत् अहार्षीत् सिजद्यतन्याम् इकारचकारौसिचिपरस्मै इत्यर्थौ सिचिपरस्मास्वरान्तानां वृद्धिः सिच इति ईट् अद्धात्वादिः निमित्तात्प्रत्ययेति सस्यथः क्रियातिपत्तिर्यथा अकरिष्यत् अहरिष्यत् क्रियातिपत्तिर्यथा अकरिष्यत् अहरिष्यत् क्रियातिपत्तिः स्यत् हनृदन्तात्स्ये इति इट् गुणः षत्वम्।"
        - sutraNo: "3.1.14"
          textDevanagari: "भविष्यतिभविष्यन्त्याशीश्वस्तन्यः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "धातोः भविष्यति काले भविष्यन्ती आशीः श्वस्तनी इत्येता विभक्तयो भवन्ति भविष्यन्ती तावत् भविष्यति भूसत्तायां भविष्यन्ती स्यति इडागमोसार्वधातुकस्येति इट् गुणः आशीर्यथा भूयात् भूसत्तायां आशीर्यात् श्वस्तनीयथा पठिता पठितारौ पठितारः पठव्यक्तायां वाचि श्वस्तनी ता तारौ तारस् इडागमः।"
        - sutraNo: "3.1.15"
          textDevanagari: "तासां स्वसंज्ञाभिः कालविशेषः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तासां परोक्षादीनां विभक्तीनां याः स्वा आत्मीयाः संज्ञाः तासां योस्ति परोक्षत्वादिर्विशेषः तेन युक्ते काले परोक्षादयो विभक्तयो भवन्ति अक्षेभ्य इन्द्रियेभ्यो यत् परं तत्परोक्षम् तथाविधे अतीते काले परोक्षा त्रिपुरं ददाह रुद्रः दहभस्मीकरणे परोक्षा अट् टकारः अकारादट औइत्यर्तः चण्परो क्षेति द्विर्व अभ्यासस्यादिव्यञ्जनसवशेष्यम् अस्योपठेतिदीर्घः ह्यः प्रभ्यत्यतीते काले ह्यस्तनी ह्यः पापमहरत् हृञ् हक्यस्तनीदि अन्वि गुणः अद्यतनी अतीतसामान्ये स्मर्यते नातीतविशेषे अकार्षीत् अहार्षीत् यत्र क्रियाया अतिपत्तिरनिष्पत्तिः तथा विधेतीतेकाले क्रियातिपत्तिर्यथा अभोक्ष्यतभवान्घृतेन सह यदिमत्समीपे आसिष्यत भुजपालनाभ्यवहरणयोः क्रियातिपत्तिः आत्मनेपदं स्यत अद्धात्वादिः उपधागुणः चवर्गस्य किरिति जस्यकः षत्वम् आस उपवेशने स्यत अद्धात्वादिः इडागमः आशीर्युक्ते भविष्यति काले आमीः भूयात् भूसत्तायां आसीर्यात् श्वः प्रभ्यतिभविष्यति काले श्वस्तनी कर्ता कृञ् श्वस्तनीतागुणः अध्येता इज् अध्यने टकार आत्मनेपदार्थः श्वस्तनी आत्मनेपदं ता अधिपूर्वः गुणः।\n\n\\end{document}"
