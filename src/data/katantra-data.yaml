              textDevanagari: "दिशां दिग्वाचिनां शब्दानां यो बहुव्रीहिस् तत्रस्थितात् सर्वनाम्नः परस्य प्रत्ययस्य सार्वनामिकं कार्यं वा भवति। दक्षिणस्याश्च पूर्वस्याश्च दिशोर्यदन्तरालं विदिक् सा दक्षिणपूर्वा। तस्यै दक्षिणपूर्वस्यै वा दक्षणपूर्वायै। दक्षिणापूर्वस्याः वा दक्षिपूर्वायाः। दक्षिणपूर्वस्याः वा दक्षिणपूर्वायाः। दक्षिणपूर्वस्यां वा दक्षिणपूर्वायाम्।"
