          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "श्रद्धासंज्ञकात् सर्वनाम्नः परेषां ङवतां वचनानां यथासङ्ख्यम् यै यास् यास् याम् इत्येते आदेशाः ससवः स्वागमयुक्ताः ह्नस्वपूर्वाश्च भवन्ति। सर्वस्यै सर्वस्याः सर्वस्याः सर्वस्यां यस्यै यस्याः यस्याः यस्यां तस्यै तस्याः तस्याः तस्यां कस्मै कस्याः कस्याः कस्याम् अमुष्यै अमुष्याः अमुष्याः अमुष्याम् अस्यै अस्याः अस्याः अस्याम्। द्वितीयातृतीयाभ्यां वा।। द्वितीयातृतीयाशब्दाभ्यां परेषां ङवतां वचनानाम् यथासङ्ख्यं यै यास् यास् याम् इत्येते आदेशाः ससवः स्वागमयुक्ता ह्रस्वपूर्वाश्च भवन्ति। द्वितीयस्यै वा द्वितीयायै। द्वितीयस्याः वा द्वितीयायाः। द्वितीयस्याः वा द्वितीयायाः। द्वितीयस्यां वा द्वितीयायाम्। एवं तृतदीयस्यै वा तृतीयायै। तृतीयस्याः वा तृतीयायाः। तृतीयस्याः वा तृतीयायाः। तृतीयस्यां वा तृतीयायाम्। नद्या ऐ आस् आस् आम्।। नदीसंज्ञकाल् लिङ्गात् परेषां ङवतां वचनानां यथासङ्ख्यं ऐ आस् आस् आम् इत्येते आदेशा भवन्ति। नद्यै नद्याः नद्याः नद्यां वध्वै वध्वाः वध्वाः वध्वाम्। सम्बुद्धौ ह्रस्वः।। नदीसंज्ञकाल् लिङ्गात् अन्त्यस्य ह्रस��वो भवति सम्बुद्धौ पर्याम्। हे नदि हे वधु। अम्शसोर् आदिर् लोपम्।। नदीसंज्ञकाल् लिङ्गात् परयोः अम् शस् इत्येतयोः प्रत्ययोः आदिः लोपं प्राप्नोति। नन्दीं नदीः वधूं वधूः। ईकारान्तात् सिः।। ईकारान्तान् नदीसंज्ञकाल् लिङ्गात् परः सिप्रत्ययो लोपं प्राप्नोति। नदी मही गौरी। व्यञ्जनाच्च।। व्यञ्जनान्ताल् लिङ्गात् परः सिप्रत्ययः लोपं प्राप्नोति। वाक् विद्यत् राजा। अग्नेरमोsकारः।। अग्निसंज्ञकाल् लिङ्गात् परस्य अमो sकारः लोपं प्राप्नोति। अग्निं ���टुं बुद्धिं धेनुम्। औकारः पूर्वम्।। अग्निसंज्ञकाल् लिङ्गात् परः औकारः पूर्वं वर्णं प्राप्नोति। अग्नी पटू बुद्धी धेनू। शसोsकारः सचनो sस्त्रियाम्।। अग्निसंज्ञकाल् लिङ्गात् परस्य शसः अकारः पूर्ववर्णं प्राप्नोति। शसश् च सकारस्य च नत्वं भवति। अस्त्रियां स्त्रीविषयं वर्जयित्वा। अग्नीन् पटून्। अस्त्रियां किं? बुद्धीः धेनूः। टा ना।। अग्निसंज्ञकाल् लिङ्गात् परः टाप्रत्ययः ना आदेशं प्राप्नोति अस्त्रियां स्त्रीविषयं वर्जयित्वा। अग्निना पटुना। अस्त्रियामिति किम्? बुध्या धेन्वा। अदो sमुश्च।। अदश्शब्दात् परः टाप्रत्ययः ना आदेशं प्राप्नोति। अदसश्च अमुआदेशः भवति अस्त्रियां स्त्रीविषयं वर्जयित्वा। अमुना। अस्त्रियामिति किं? अमुया। इरेदुरोज्जसि।। अग्निसंज्ञकाल् लिङ्गात् इः एद्भवति उः ओद्भवति जसि परे। अग्नयः पटवः बुद्धयः धेनवः। सम्बुद्धौ च।। अग्निसंज्ञकात् लिङ्गात् इरेद्भवति उरोद्भवति सम्बुद्धौ परस्याम्। हे अग्ने हे पटो हे बुद्धे हे धेनो। ङे च।। अग्निसंज्ञकाल् लिङ्गात् इः एद् भवति उः ओद् भवति ङे प्रत्यये परे। अग्नये पटवे बुद्धये धेनवे। ङसिङसोर् लोपश्च।। अग्निसंज्ञकाल् लिङ्गात् इः एद् भवति उः ओद् भवति ङसिङसोः परयोः तयोश्च अकारो लोपो भवति। अग्नेः अग्नेः पटोः पटोः बुद्धेः बुद्धेः धेनोः धेनोः। गोश्च।। गोशब्दात् परयोः ङसिङसोः अकारो लोपो भवति। गोः गोः। द्योशब्दात् अपीष्यते। द्योः द्योः। ङिरौ सपूर्वः।। अग्निसंज्ञकाल् लिङ्गात् परो ङिप्रत्ययः पूर्वेण वर्णेन सह औकारं प्राप्नोति। अग्नौ पटौ बुद्धौ धेनौ। सखिपत्योर् ङिः।। सखिपतिशब्दाभ्यां परो ङिप्रत्ययः औत्वं प्राप्नोति। सख्यौ पत्यौ। ङसिङसोरुमः।। सखिपतिशब्दाभ्यां परयोः ङसिङसोः अकार उत्वं प्राप्नोति। सख्युः सख्युः पत्युः पत्युः। ऋदन्तात् सपूर्वः।। ऋदन्ताल् लिङ्गात् परयोर् ङसिङसोर् अकारः पूर्वेण वर्णेन सह उत्वं भवति। पितुः पितुः मातुः मातुः भ्रातुः भ्रातुः कर्तुः कर्तुः स्वसुः स्वसुः स्वसुः नुः नुः। आ सौ सिलोपश्च।। ऋदन्तस्य लिङ्गस्यान्त्यस्य आत्वं भवति सौ सिप्रत्यये परे सेश्चलोपो भवति। पिता माता भ्राता कर्ता स्वसा ना। अग्निवच् छसि।। ऋदन्तं लिङ्गम् अग्निवद् भवति शसि परे। यथाग्निसंज्ञकात् परस्य शसोsकारःसशनोsस्त्रियामिति शसो sकारस्य पूर्ववर्णादेशः स्त्रीविषयं वर्जयित्वा सकारस्य च नत्वं भवति तथा ऋदन्तात् अपि भवतीत्यर्थः। पितॄन् भ्रातॄन् कर्तॄन् नॄन्। स्त्रियां सस्य नत्वं नास्ति यथा मातॄः स्वसॄः। अर्ङौ।। ऋदन्तस्य लिङ्गस्य अर्भवति ङिप्रत्यये परे। पितरि मातरि भ्रातरि कर्तरि स्वसरि नरि। घुटि च।। ऋदन्त्यस्य लिङ्गस्यार्भवति घुटि परे। पितरौ प��तरः पितरं पितरौ मातरौ मातरः मातरं मातरौ नरौ नरः नरं नरौ। धातोस्तृशब्दस्यार्।। धातोः परः यस्तृशब्दस् तस्य आर्भवति चुटि परे। कर्तारौ कर्तारः कर्तारं कर्तरौ वक्तारौ वक्तारः वक्तारं वक्तारौ। स्वस्रादीनां च।। स्वस्रादीनां शब्दानां यः ऋकारस् तस्य आर् भवति घुटि परे। स्वसारौ स्वसारः स्वसारं स्वसारौ नप्तारौ नप्तारः नप्तारं नप्तारौ। स्वसा नप्ता च नेष्टा च त्वष्टा क्षत्ता तथैव च। होता पोता प्रशस्ता चेत्यष्टौ स्वस्रादयः स्मृताः। आ च न सम्बुद्धौ।। ऋदन्तस्य लिङ्गस्य आर् न भवति। आसौसिलोपश्चेत्यनेन आत्वं न भवति। पारिशेष्याद् घटि चेत्य् अर् एव भवति सम्बुद्धौ परस्यां। हे पितः हे मातः हे भ्रातः हे कर्तुः हे स्वसः हे नः। ह्रस्वनदीश्रद्धाभ्यः सिर्लोपम्।। ह्रस्वान्तात् नदीसंज्ञकात् श्रद्धासंज्ञकाच्च लिङ्गात् परः सम्बुद्धिसिकारः लोपं प्राप्नोति। हे वृक्ष हे नदि हे वधु हे गङ्गे हे यमुने। आमि च नुः।। ह्रस्वनदीश्रद्धाभ्यः आमि परे नुरागमो भवति। वृक्षाणां अग्नीनां वायूनां पितॄणां नदीनां वधूनां गङ्ग��नाम् उमानाम्। त्रेस्त्रयश्च।। त्रिशब्दस्यामिपरे नुरागमो भवति। त्रेश्च त्रयादेशः। त्रयाणाम् परमत्रयाणाम्। चतुरः।। चत्वार्शब्दस्य आमि परे नुरागमो भवति। चतुर्णाम्। सङ्ख्यायाः ष्णान्तायाः।। षकारनकारान्तायाः सङ्ख्याः आमि परे नुरागमो भवति। षण्णां पञ्चानां सप्तानां दशानाम्। कर्तेश्च जस्शसोर् लुक्।। षकारनकारान्तायाः सङ्ख्यायाः कतिशब्दाश् च परयोः जस्शसोः लुग्भवति। षट् तिष्ठन्ति। षट् पश्य। पञ्च पञ्च सप्त सप्त नव नव। दश तिष्ठन्ति दश पश्य। कति तिष्ठन्ति कति पश्य। नियो ङिराम्।। णीञ् प्रापणे इत्यस्मात् क्विवन्तात् परो ङिप्रत्ययः आम् संपद्यते। नियां सेनान्यां ग्रामण्याम्। इति लघुवृत्तौ नाम प्रकरणे लिङ्गपादः प्रथमः॥१॥"
    - padaId: "2-2"
      padaNo: "2.2"
      padaNameDevanagari: "कारकपादः"
      sutras:
        - sutraNo: "2.2.1"
          textDevanagari: "अव्ययीभावादकारान्ताद्विभक्तीनाममपञ्चम्याः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तादव्ययीभावात्परासां विभक्तीनाम् अमादेशो भवति अपञ्चम्याः पञ्चमीविभक्तिं वर्जयित्वा। उपकुम्भं तिष्ठति। उपकुम्भं पश्य। उपकुम्भं देहि। उपकुम्भं स्वम्। अकारान्तादिति किम्? समीपं वध्वाः उपवधु। स्वरोह्रस्व इति ह्रस्वः। अन्यस्माल्लुगिति सिलोपः। अपञ्चम्या इति किम्? उपकुम्भादागतः।"
        - sutraNo: "2.2.2"
          textDevanagari: "वा तृतीयासप्तम्योः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तादव्ययीभावात् परयोः तृतीयासप्तम्योः अमादेशो वा भवति। उपकुम्भं कृतम् उपकुम्भेन कृतम्। उपकुम्भं स्थापय उपकुम्भे स्थापय। अकारान्तादिति किम्? उ पवधु कृतम् उपवधु स्थापय।"
        - sutraNo: "2.2.3"
          textDevanagari: "अन्यस्माल्लुक्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अन्यस्मात् अनकारान्तात् अव्ययीभावात् परासां विभक्तीनां लुक् भवति। उवधु तिष्ठति। उपवधु पश्य। उपवधु कृतम्। उपवधु देहि। उपवधु आगतः। उपवधु स्वम्। उपवधु स्थापय। समृद्धिः कर्तृणां सुकर्तृ। पश्चान्नद्याः अनुनदि। विधिमनतिक्रम्य यथाविधि।"
        - sutraNo: "2.2.4"
          textDevanagari: "अव्ययाच्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अव्ययात्परासां विभक्तीनां लुग्भवति । च वा हा अह एव ग्रामश्च ते स्वम्। नगरं च मे स्वम्।"
        - sutraNo: "2.2.5"
          textDevanagari: "रूढानां बहुत्वे स्त्रियामपत्यप्रत्ययस्य"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ये शब्दाः देशस्य राज्ञां च वाचकाः ते रूढाः रूढानां सम्बन्धिनः अपत्यप्रत्ययस्य बहुत्वे उत्पन्नस्य लुग्भवति अस्त्रियां स्त्रीवषयं वर्जयित्वा। अङ्गस्यापत्यानि बहूनि अङ्गाः। एवं बङ्गाः कलिङ्गाः सुह्माः रघोरपत्यानि बहूनि रघवः। वाणपत्ये इति अण् तस्य अनेन लुक्। रूढानामिति किम्? पूरोरपत्यानि बहूनि पौरवाः अण् णकारो वृद्धिरादौसणे इत्यर्थः। आदिवृद्धिश्च उवर्णस्त्वोत्वमापाद्य इति उवर्णस्य ओकारः। बहुत्वे इति किम्? अङ्गस्य अपत्यं आङ्गः। अस्त्रियामिति किम्? अङ्गस्यापत्यानि बह्व्यः स्त्रियः आङ्ग्यः। अणेयेकादिति ईप्रत्ययः ईकारे स्त्रीकृतेल्लोप्य इति अकारलोपः जस् अपत्यप्रत्ययस्येति किम्? पञ्चालानामिमे शिष्याः पाञ्चालाः तस्येदमित्यण्।"
        - sutraNo: "2.2.6"
          textDevanagari: "गर्गयस्कविदादीनां च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "गर्गादीनां यस्कादीनां विदानीनां च सम्बन्धिनः अपत्यप्रत्ययस्य बहुत्वे उत्पन्नस्य लुग्भवति अस्त्रियां स्त्रीविषयं वर्जयित्वा गर्गस्यापत्यानि बहूनि गर्गाः एवं वत्साः वजाः सङ्कृतयः व्याघ्रपदो अपत्यानि बहूनि व्याघ्रपदः। ण्यगर्गादेरितिण्यतस्यानेन लुक्। यस्कस्यापत्यानि बहूनि यस्काः लह्याः द्रूह्याः। विदस्यापत्यानि बहूनि विदाः उर्वाः भरद्वाजः वाणपत्ये इति अण्। तस्यानेन लुक्। अपत्यप्रत्ययस्येति किम्? गर्गस्य इमे शिष्याः गार्गाः यास्काः वैदाः। बहुत्वे इति किम्? गर्गस्यापत्यं गार्ग्यः यास्कः वैदः। अस्त्रियामिति किम्? गर्गस्यापत्यानि बह्व्यः स्त्रियाः गार्ग्यः यास्क्यः वैद्यः गर्गशब्दात् ण्यगर्गादेरितिण्यः ण्यदिति ईप्रत्ययः यस्यापत्यस्येतियलोपः शिष्टेभ्यः अण्। अणेयेकादिति ईप्रत्ययः गर्गवत्सवजसंकृतिव्याघ्रपात् अजविदभृत् इत्यादयोगर्गादयः यस्कलह्यद्रूह्यअयस्थूणबलन्धर इत्यादयो यस्कादयः विदे उर्व भरद्वाजकुर्वण उपमन्यु इत्यादयो विदादयः।"
        - sutraNo: "2.2.7"
          textDevanagari: "भृग्वत्र्यङ्गिरस्कुत्सवसिष्ठगोतमेभ्यश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "भृगु अत्रि अङ्गिरस् कुत्स वसिष्ट गोतम एभ्यः परस्य अपत्यप्रत्ययस्य बहुत्वे उत्पन्नस्य लुक् भवति अस्त्रियां स्त्रीविषयं वर्जयित्वा। भृगोरपत्यानि बहूनि भृगवः अत्रयः अङ्गिरसः कुत्साः वसिष्ठाः गोतमाः अस्यानेन लुक्। अत्रिशब्दात् स्त्र्यात्र्यादेरेयण् अस्य अनेन लुक्। शिष्टेभ्यो वाणपत्येण्। अपत्यप्रत्ययस्येति किम्? भृगोरिमे शिष्याः भार्गवाः। ततस्येदमित्यण्। बहुत्वे इति किम्? भृगोरपत्यं भार्गवः एवम् आत्रेयः आङ्गिरसः कौत्सः वासिष्ठः गौतमः। अस्त्रियामिति किम्? भृगोरपत्यानि बह्व्यः स्त्रियः भार्गव्यः आत्रेय्यः आङ्गिरस्यः कौत्स्यः वासिष्ठ्यः गौतम्यः अणेरेकादिति ईप्रत्ययः ईकारेस्त्रीकृतेल्लोप्यः जस्।"
        - sutraNo: "2.2.8"
          textDevanagari: "यतोऽपैति भयमादत्ते वा तदपादानम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यतः अपैति यस्माद्विश्लेषं प्राप्नोति यतो भयं यतश्चादत्ते गृह्णाति तत्कारकं अपादानसंज्ञं भवति। अपादाने पञ्चमी। ग्रामादागच्छति। अश्वात्पततिः। चौरेभ्यो बिभेति। अधर्मान्निवर्तते। कोष्ठागाराद्धान्यं गृह्णाति। उपाध्यायाद्विद्यामादत्ते। अपादानसंज्ञया क्व प्रयोजनम्? शेषाः कर्मकारणसंप्रदानापादानस्वाम्याद्यधिरकणेषु इत्यत्र वक्ष्यमाणाभिरत्रैव प्रयोजनम्।"
        - sutraNo: "2.2.9"
          textDevanagari: "ईप्सितं च रक्षार्थानाम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "रक्षार्थानां रक्षाप्रयोजनानाम् धातूनां प्रयोगे सति यदीप्सितमभिप्रीतं तत्कारकमपादानसंज्ञं भवति। च शब्दादनीप्सितमपि। यवेभ्यो गा रक्षति। तिलेभ्यः काकान्वारयति। अनीप्सितं यथा अहिभ्यः पुत्रान्रक्षति कूपादन्धं वारयति।"
        - sutraNo: "2.2.10"
          textDevanagari: "यस्मै दित्सा रोचते धारयते वा तत्संप्रदानम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यस्मै दित्सा दातुमिच्छा यस्मै रोचते यस्मै च ऋणं धारयते तत्कारकं संप्रदानसंज्ञं भवति। संप्रदाने चतुर्थी। विप्राय गां ददाति। वैश्रवणाय बलिमुपहरति। देवदत्ताय रोचते मोदकः। यज्ञदत्ताय शतं धारयते। दित्सा इति किम्? राज्ञो दाण्डं ददाति।"
        - sutraNo: "2.2.11"
          textDevanagari: "य आधारस्तदधिकरणम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "य आधारः तत्कारकं अधिकरणसंज्ञं भवति। अधिकरणे सप्तमी। कटे आस्ते। पर्यङ्के शेति। जले मत्स्याः। खे शकुनयः दध्नि घृतम्। तिलेषु तैलम्।"
        - sutraNo: "2.2.12"
          textDevanagari: "येन क्रियते तत्करणम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "येन क्रियते साध्यते तत्कारकं करणसंज्ञं भवति। करणे तृतीया। दात्रेण लुनाति। परशुनाच्छिनत्ति।"
        - sutraNo: "2.2.13"
          textDevanagari: "यत्किर्यते तत्कर्म"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यत्क्रियते क्रियया विशिष्टं संपाद्यते तत्कारकं कर्मसंज्ञं भवति। कर्मणि द्वितीया। कटं करोति। ओदनं पचति। आदित्यं पश्यति।"
        - sutraNo: "2.2.14"
          textDevanagari: "यः करोति स कर्ता"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यः करोति क्रियां निर्वर्तयति स कर्तृसंज्ञो भवति। कर्तरि तृतीया। रुद्रेण त्रिपुरं दग्धम्। विष्णुना बद्धो बलिः। कर्तृसंज्ञया क्व प्रयोजनम्? कर्तरि चेत्यादिषु।"
        - sutraNo: "2.2.15"
          textDevanagari: "कारयति यः स हेतुश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "य कर्तारं कारयति क्रियायां प्रेरयति स हेतुसंज्ञो भवति। चशब्दात्कर्तृसंज्ञश्च। कर्तरि प्रथमा। कारयति पाठयति हेतुसंज्ञया क्व प्रयोजनम् धातोश्च हेतावित्यादिषु।"
        - sutraNo: "2.2.16"
          textDevanagari: "तेषां परमुभयप्राप्तौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तेषामपादानादीनां कारकाणां मध्यात् उभयोर्द्वयोः कारकयोः एकत्र प्राप्तौ सत्यां यत्परं तदेवकारकं भवति। वृक्षं त्यजति खगः। त्यजति दण्डं दण्डी। अत्र परत्वात्कर्मकर्तृकारके भवतः।"
        - sutraNo: "2.2.17"
          textDevanagari: "प्रथमाविभक्तिर्लिङ्गार्थवचने"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "लिङ्गार्थस्य वचने अभिधाने सति लिङ्गात्प्रथमाविभक्तिर्भवति। वृक्षः कुमारी। कुण्डम्। द्रोणः। आढकम्।"
        - sutraNo: "2.2.18"
          textDevanagari: "आमन्त्रणे च।"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "आमन्त्रणादिके लिङ्गार्थवचने सति प्रथमाविभक्तिर्भवति। हे शिव हे केशव।"
        - sutraNo: "2.2.19"
          textDevanagari: "शेषाः कर्मकरणसंप्रदानापादानस्वाम्याद्यधिकरणेषु"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "शेषा द्वितीयाद्याविभक्तयः कर्मणि करणे संप्रदाने अपादाने स्वाम्यादियोगे अधिकरणे च भवन्ति। कर्मणि द्वितीया। कटं करोति। करणे तृतीया। परशुनाच्छिनत्ति। संप्रदाने चतुर्थी। विप्राय गां ददाति। अपादाने पञ्चमी। ग्रमादागच्छति। अश्वात्पतितः। स्वाम्यादियोगे षष्ठी। देवदत्तस्य स्वम्। पितुः पुत्रः। राज्ञो भार्या। अधिकरणे सप्तमी। कटे आस्ते। पर्यङ्के शेते।"
        - sutraNo: "2.2.20"
          textDevanagari: "पर्यपाङ्योगे पञ्चमी"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "परि अप आङ् इत्येतैर्योगे सति लिङ्गात् पञ्चमी भवति। परिस्रुघ्र्नाद्वृष्टो देवः। अपकान्यकुब्जाद्वृष्टो देवः। आकुरुक्षेत्राद्वृष्टो देवः।"
        - sutraNo: "2.2.21"
          textDevanagari: "दिगितरर्तेऽन्यैश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "दिक्शब्देरितर ऋते अन्य इत्येतैश्च योगे लिङ्गात्पञ्चमी भवति। पूर्वो ग्रामात्। दक्षिणो नगरात्। इतरो देवदत्तात्पण्डितः। ऋते विष्णोः कुतोमोक्षः। अन्यो देवदत्तात्।"
        - sutraNo: "2.2.22"
          textDevanagari: "द्वितीयैनेन"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "एनेन एनप्रत्ययान्तेन शब्देन योगेन सति लिङ्गाद्द्वितीया भवति। उत्तरेण ग्रामं वसति। दक्षिणेन नगरं वसति। पुरस्तादादयश्चेति एनप्रत्ययः।"
        - sutraNo: "2.2.23"
          textDevanagari: "कर्मप्रवचनीयैश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अन्वाद्याः एकादश कर्मप्रवचनीयाः ये प्रागुक्ताः तैः योगे सति लिङ्गाद्द्वितीया भवति। वृक्षमनुविद्योतते विद्युत्। वृक्षं परि। वृक्षमभि। मां प्रति साधुः।"
        - sutraNo: "2.2.24"
          textDevanagari: "गत्यर्थकर्मणि द्वितीयाचतुर्थौ चेष्टायामनध्वनि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "गत्यर्थानां धातूनां यत्कर्म तस्मिन्कर्मणि अनध्वनि अध्वशब्दवर्जिते द्वितीयाचतुर्थ्यौ भवतः चेष्टायां गम्यमानायां सत्यां चेष्टाकायपरिस्पन्दः ग्रामं गच्छति ग्रामाय गच्छति स्रुघ्नं व्रजति। स्रुघ्नाय व्रजति। तीर्थं याति तीर्थाय याति। गत्यर्थग्रहणं किम्? ओदनं पचति कर्मणीति किम्? अश्वेन याति। चेष्टायामितिकिम्? मनसा वाराणसीं गच्छति। अनध्वनीति किम्? अध्वानं गच्छति।"
        - sutraNo: "2.2.25"
          textDevanagari: "मन्यकर्मणि चानादरे प्राणिनि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "मनज्ञाने इत्यस्य यत्कर्म तस्मिन्कर्मणि अप्राणिनि प्राणिवर्जिते द्वितीयाचतुर्थ्यौ भवतः अनादरे गम्यमाने अनादरः तिरस्कारः। तृणमपि त्वा न मन्ये। तृणायापि त्वा न मन्ये। बुसमपि त्वा न मन्ये। बुसायापि त्वा न मन्ये। मन्यग्रहणे किम्? तृणं त्वां चिन्तयामि। अनादरे इति किम्? सुवर्णं त्वां मन्ये। अप्राणिनि इति किम्? न त्वा काकं मन्ये। न त्वा श्वानं मन्ये।"
        - sutraNo: "2.2.26"
          textDevanagari: "नमस्स्वस्तिस्वाहास्वधालंवषड्योगे चतुर्थी"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नमस् स्वस्ति स्वाहा स्वधा अलं वषट् इत्येतैर्योगे सति लिङ्गात् चतुर्थी भवति। नमो रुद्राय। स्वस्ति प्रजाभ्यः। स्वाहा अग्नये। पितृभ्यः स्वधा। अलं मल्लो मल्लाय। वषडिन्द्राय।"
        - sutraNo: "2.2.27"
          textDevanagari: "तुमर्थाच्च भाववाचिनः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तुमासमानार्थो भाववाची घञादिप्रत्ययः भाववाचिनश्चेति अनेन क्रियायां क्रियार्थायां विहितः तदन्तात् शब्दात् चतुर्थीभवति। पाकाय व्रजति। पक्तये व्रजति। पचनाय व्रजति। पक्तुं व्रजति इत्यर्थः। तुमर्थादितिकिम्? पाकः पक्तिः पचनम्। भाववाचिन इति किम्? कटं कारको व्रजति कर्तुं व्रजति इत्यर्थः।"
        - sutraNo: "2.2.28"
          textDevanagari: "तृतीया सहयोगे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सहार्थेन शब्देन योगे सति लिङ्गात्तृतीया भवति। पुत्रेण सह आगतः। पुत्रेण सह गोमान्। पुत्रेण सत्रा। पुत्रेण सजूः।"
        - sutraNo: "2.2.29"
          textDevanagari: "हेत्वर्थे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "फलसाधनयोग्यः पदार्थो हेतुः हेतावर्थे लिङ्गात्तृतीया भवति। विद्यया यशः। कन्यया शोकः। धनेन कुलम्।"
        - sutraNo: "2.2.30"
          textDevanagari: "कुत्सिते ऽङ्गे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कुत्सिते अङ्गिनि यदङ्गं तस्मिन्नङ्गे तृतीया भवति। अक्ष्णा काणः। नासिकया चिपिटः। पादेन खञ्जः। शिरसा खलतिः। पाणिना कुणिः।"
        - sutraNo: "2.2.31"
          textDevanagari: "विशेषणे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विशेष्यते उपलक्ष्यते येन तद्विशेषणम्। विशेषणे ऽर्थे लिङ्गात्तृतीया भवति। जाटाभिस्तापसो दृष्टः। खड्गेन भटो दृष्टः।"
        - sutraNo: "2.2.32"
          textDevanagari: "कर्तिरि च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कर्तर्यर्थे लिङ्गात्तृतीया भवति। रुद्रेण त्रिपुरं दग्धम्। विष्णुना बद्धो बलिः।"
        - sutraNo: "2.2.33"
          textDevanagari: "कालभावयोः सप्तमी"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "काले भावे च भावो धात्वर्थः तस्मिन्नर्थे लिङ्गात्सप्तमी भवति। शरदि पुष्प्यन्ति सप्तच्छदाः। वर्षासु पुष्प्यन्ति कुटजानि। भावे यथा अग्निहोत्रे हूयमाने गतः। गोषु दुह्यमानासु आगतः।"
        - sutraNo: "2.2.34"
          textDevanagari: "स्वामीश्वराधिपतिदायादसाक्षिप्रतिभूप्रसूतैः षष्ठी च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्वामिन् ईश्वर अधिपति दायाद साक्षिन् प्रतिभू प्रसूत इत्येतैर्योगे सति लिङ्गात् षष्ठी भवति सप्तमी च। धनस्य स्वामी धने स्वामी। धनस्य ईश्वरः धने ईश्वरः। धनस्य अधिपतिः धने अधिपतिः। धनस्य दायादः धने दायादः। धनस्य प्रतिभूः धने प्रतिभूः। गवां साक्षी गोषु साक्षी। गवां प्रसूतः गोषु प्रसूतः।"
        - sutraNo: "2.2.35"
          textDevanagari: "निर्धारणे च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "जात्या गुणेन क्रियया संज्ञया वापृथक्कृतिः समूहादेकदेशस्य निर्धारणमिति स्मृतम्। येषां मध्यात्कस्यचिन्निर्धारणं पृथक्करणं तेषां षष्ठी भवति सप्तमी च। पुरुषाणां मध्ये क्षत्रियः शूरः पुरुषेषु वा। गवां कृष्णागौः संपन्नक्षीरा गोषु वा। अध्वगानां मध्ये धावन्तः शीघ्रगाः अध्वगेषु वा। ब्राह्मणानां मध्ये देवदत्तः पाठकः ब्रह्मणेषु वा।"
        - sutraNo: "2.2.36"
          textDevanagari: "षष्ठी हेतुप्रयोगे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "हेतुशब्दप्रयोगे सति यो हेतुस्तस्य षष्ठी भवति। हेत्वर्थे इति तृतीया प्राप्ता। अन्नस्य हेतोर्वसति। विद्याया हेतोर्वसति।"
        - sutraNo: "2.2.37"
          textDevanagari: "स्मृत्यर्थकर्मणि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्मृतिरर्थो योषां ते स्मृत्यर्थाः तेषां कर्म स्मृत्यर्थकर्म तस्मिन्कर्मणि षष्ठी भवति। पितुः स्मरति। मातुर्ध्यायति। प्रियायाश्चिन्तयति।"
        - sutraNo: "2.2.38"
          textDevanagari: "करोतेः प्रतियत्ने"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "करोते डुकृञ् करणे इत्यस्य यत्कर्म तस्मिन्कर्मणि षष्ठी भवति। प्रतियत्ने गम्यमाने सति। सतो गुणान्तरोत्पादनं प्रतियत्नः। एधोदकस्योपस्कुरुते। असिपत्त्रस्योपस्कुरुते।"
        - sutraNo: "2.2.39"
          textDevanagari: "हिंसार्थानामज्वरे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "हिंसार्थानां धातूनां यत्कर्म तस्मिन्कर्मणि षष्ठी भवति अज्वरे ज्वर रोगे इत्यस्य कर्म वर्जयित्वा। चौरस्य रुजति रोगः। चौरस्य तुदति तोदः। चौरस्यामयति आमयः। अज्वरे इति किम्? चौरं ज्वरयति ज्वरः।"
        - sutraNo: "2.2.40"
          textDevanagari: "कर्तृकर्मणोः कृति नित्यम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कृति कृत्प्रत्ययान्ते शब्दे प्रयुज्यमाने सति कर्तरि कर्मणि च नित्यं षष्ठी भवति। भवतः आसिका। भवतः शायिका। भवतः अग्रगामिका। पर्यायार्हणेषु चेति स्त्रियां भावे वुण्। युवजामना कान्ता। अत्र कर्तरि षष्ठी। कर्मणि यथा वज्रस्य भर्ता। भुवनस्य रक्षिता। यवानां लावकः। सक्तूनां पायकः।"
        - sutraNo: "2.2.41"
          textDevanagari: "न निष्ठादिषु"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "निष्ठादिषु कृत्प्रत्ययेषु प्रयुज्यमानेषु सत्सु कर्तृकर्मणोः षष्ठी न भवति। पूर्वेण प्राप्ता। देवदत्तेन जितम्। देवदत्तेन कटः कृतः।"
        - sutraNo: "2.2.42"
          textDevanagari: "षडो णो ने"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "षष्शब्दस्य अन्त्यस्य हशषच्छेति डत्वे कृते णत्वं भवति ने नकारे परे। षण्णाम्। षण्णवतिः। षण्णगरी। ने इति किम् षड्भिः।"
        - sutraNo: "2.2.43"
          textDevanagari: "मनोरनुस्वारो धुटि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "मकारनकारयोरनुस्वारो भवति धुटि परे। रंस्यते। हंसि। धुटीति किम्? गम्यते। हन्यते।"
        - sutraNo: "2.2.44"
          textDevanagari: "वर्ग्ये वर्गान्तः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "मकारनकारयोर्वर्गान्तो भवति वर्ग्ये धुटि परे। शान्तः। शङ्किता। शमु उपशमे गत्यर्थाकर्मकेति क्तः। पञ्चमोपधेत्युपधादीर्घः। धुटीति किम्? चम्नोति हन्मि चमु अदने हन हिंसागत्योः वर्तमाना ति मि नु स्वादेर्गुणः।"
        - sutraNo: "2.2.45"
          textDevanagari: "तवर्गश्चटवर्गयोगे चटवर्गौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तवर्गः चटवर्गाभ्यां योगे सति यथासङ्ख्यं चटवर्गावादेशौ भवतः राज्ञः भृज्जति। याच्ञा। भ्रस्जपाके भुयाचृयाच्ञायाम्। याचिविच्छिप्रच्छीति नङ्। टवर्गयोगे ईट्टे अड्डति षण्णाम्। ईडस्तुतौ वत्तमाना ते अन्वि अदादेर्लुक्। अघोषेष्वटामितिडस्यटः अद्डअभियोगे अन्वि अनेन तस्य टः दस्यडः।"
        - sutraNo: "2.2.46"
          textDevanagari: "नामिकरपरःप्रत्ययविकारागमस्थःसिष्षं नुविसर्जनीयषान्तरोपि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नामिनः ककारात् रेफाच्चपरः सकारः प्रत्ययस्थो विकारस्थ आगमगस्थश्च षत्वमापद्यते नुविसर्जनीयषान्तरोपि नुकारागमेन विसर्जनीयेन षकारेण व्यवहितोपीत्यर्थः। नामिनः अग्निषु वायुषु कात् वाक्षु त्वक्षु रेफात् गीर्षु धूर्षु इति प्रत्ययस्थः एषः इति विकारस्थः सर्वेषामित्यागमस्थः नुविसर्जनीयषान्तरोपि यथा संर्पीषि सर्पिषुः सर्पिष्षु। नामिन इति किम्? असौ।"
        - sutraNo: "2.2.47"
          textDevanagari: "रषृवर्णेभ्यो नो णमनन्त्यः स्वरहयवकवर्गपवर्गान्तरोऽपि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "रेफषकारऋवर्णेभ्यः परो नकारः अनन्त्यः अपदान्तः णकारमापद्यते स्वरेण हकारेण यकारेण वकारेण कवर्गेण पवर्गेण च व्यवहितोऽपि इत्यर्थः। रेफात् चतुर्णाम्। षात् पूष्णाम्। ऋवर्णात् नृणां वा नॄणाम्। स्वरहयवकवर्गपवर्गैः केवलैः समुदितैश्च व्यवहितो। यथा हरेण पुरुषेण अहेण आर्येण गर्वेण अर्केण मूर्खेण सर्गेण अर्घेण सर्पेण रेफेण दर्भेण धर्मेण। रषृवर्गणेभ्य इति किम्? धनम्। अनन्त्य इति किम्? नरान्। वृक्षान्। पितॄन्।"
        - sutraNo: "2.2.48"
          textDevanagari: "स्त्रियामादाप्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "आत् अकारान्तात् लिङ्गात् स्त्रियां वर्तमानात् आप्प्रत्ययो भवति। पकारः स्वरार्थः। देवदत्ता या सा का। स्त्रियामिति किम्? कीलालपाः। आदिति किम्? मतिः।"
        - sutraNo: "2.2.49"
          textDevanagari: "नदाद्यन्च्वाह्वन्सन्तृसखिनान्तेभ्य ई"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नदादिभ्यः शब्देभ्यः तथा अन्च् वाह् उ अन्स् अन्त् ऋ सखि नान्त एभ्यः स्त्रियां वर्तमानेभ्यः ईप्रत्ययो भवति। नदादिभ्यस्तावत् नदी मही गौरी अन्च् प्राची प्रतीची तिरश्ची उदीची वाह् पष्टौही तुर्यौही। उ पट्वी मृद्वी। अन्स् पोचषी विदुषी। अन्त् पचन्ती देव्यन्ती। ऋ कर्त्री हर्त्त्री। सखि सखी। नान्त दण्डिनी पद्मिनी येभ्यः शब्देभ्यः स्त्रियामीप्रत्ययो दृश्यते तेन दादयः।"
        - sutraNo: "2.2.50"
          textDevanagari: "ईकारे स्त्रीकृतेऽल्लोप्यः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्त्रियां कृते ईकारे परे अकारो लोपनीयो भवति। देवी गौरी मही। अनेन अकारलोपः। स्त्रीकृते इति किम्? कुण्डे।"
        - sutraNo: "2.2.51"
          textDevanagari: "स्वरोह्रस्वोनपुंसके"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नपुंसकविषये योन्त्यः स्वरस्तस्य ह्रस्वो भवति सेनानि कुलम्। यवलुकुलम् नपुंसकेइति किम्? ग्रामणीः ना गौः। इति लघुवृत्तौ नामप्रकरणे कारकपादश्चतुर्थः॥"
    - padaId: "2-3"
      padaNo: "2.3"
      padaNameDevanagari: "समासपादः"
      sutras:
        - sutraNo: "2.3.1"
          textDevanagari: "नाम्नां समासो युक्तार्थः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नामसंज्ञां लिङ्गस्य विभक्त्यन्तस्य पूर्वाचार्याः कृतवन्तः। अष्टौ यत्र प्रयुज्यन्ते नानार्थेषु विभक्तयः। तन्नामकवयः प्राहुर्भेदे वचनलिङ्गयोः॥ नाम्नां समासः समसनं पृथक्स्थितानां एकीभावो भवति यदिपूर्वपदोत्तरपदानां युक्तार्थः परस्परसम्बन्धोऽर्थः भवति। नीलं च उत्पलं नीलोत्पलम्। राज्ञः पुरुषः राजपुरुषः। युक्तार्थ इति किम्? वस्त्रं नीलम् उत्पलं वर्षासु पुष्प्यति। भार्या राज्ञः पुरुषो देवदत्तस्य।"
        - sutraNo: "2.3.2"
          textDevanagari: "तत्स्था लोप्या विभक्तयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तत्र समासाऽर्थे वाक्ये याः स्थिता विभक्तयः ताः लोप्या भवन्ति। राज्ञः पुरुषः राजपुरुषः। राजपुरुष इति षष्ठीतत्पुरुषः शङ्कुलया खण्डः शङ्कुलाखण्डः। यूपाय दारु यूपदारु। वृकेभ्यो भयं वृकभयं। लोप्या इति अर्हप्रत्ययनिर्देशादन्यस्यापि लोपार्हस्य यथादर्शनं लोपः। देवमुखमिव मुखं यस्य सः देवमुखः। घृतपूर्णो घटः घृतघटः। अविद्यमानं पापं यस्य सः अपापः। अत्र मुखपूर्णविद्यमानानां शब्दानां लोपः।"
        - sutraNo: "2.3.3"
          textDevanagari: "प्रकृतिश्च स्वरान्तस्य"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्वरान्तस्य शब्दस्य समासे विभक्तिलोपे च कृते प्रकृतिर्यथास्वरूपं भवति प्रत्ययलोपे प्रत्ययलक्षणम् इति वचनाद्यत्प्राप्तं तन्न भवति पितरि निपुणः पितृनिपुणः अत्र अर्ङाविति अर् प्राप्तः सखायं प्राप्तः सखिप्राप्तः। अत्र घुटि त्वै इति ऐत्वं प्राप्तम्।"
        - sutraNo: "2.3.4"
          textDevanagari: "व्यञ्जनान्तस्य यत्सुभोः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "व्यञ्जनान्तस्य शब्दस्य सुप्रत्यये भकारे च परे यत्कार्यं प्राप्तं तत्समासे विभक्तिलोपे च कृते भवति। विदुषः अर्थः विद्वदर्थः। अत्र न लोपः दत्वं च भवति। राज्ञः अर्थः राजार्थः। अत्र न लोपः। दिवं गतः द्युगतः। अत्र उत्वम्। षण्णामाश्रयः षडाश्रयः अत्रडत्वम्।"
        - sutraNo: "2.3.5"
          textDevanagari: "पदे तुल्याधिकरणे विज्ञेयः कर्मधारयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यत्र समासे तुल्याधिकरणे एकद्रव्यविषये उत्तरपदे परे पूर्वपदं समस्यते स समासः कर्मधारयसंज्ञो विज्ञातव्यः। ब्राह्मणी चासौ दारिका ब्राह्मणदारिका। कर्मधारयसंज्ञे तु पुंवद्भावो विधीयते इति पूर्वपदस्य पुंवद्भावः। तुल्याधिकरणे इति किम्? कल्याण्या दुहिता कल्याणीदुहिता। कर्मधारयसंज्ञया क्व प्रयोजनम्? कर्मधारयसंज्ञे तु पुंवद्भावो विधीयते इत्यत्र।"
        - sutraNo: "2.3.6"
          textDevanagari: "संख्यापूर्वो द्विगुरिति ज्ञेयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सङ्ख्यापूर्वः समासः द्विगुसंज्ञो ज्ञेयः ज्ञातव्यः। तद्धितानां ये अर्थास्तेषु सत्सु उत्तरपदे परे समाहारे चाभिधेये द्विगुरिष्यते। तद्धितार्थेषु तावत् पञ्चसु कपालेषु संस्कृतः पुरोडाशः पञ्चकपालः। अत्र संस्कृतेऽर्थे एवमादेरणिष्यते इत्यण्। तस्य द्विगोरलुगनपत्य इति तन्त्रान्तरात् लुक्। उत्तरपदे पञ्च गावो धनं यस्य सः पञ्चगवधनः। अत्र धनशब्दे उत्तरपदे पञ्चगव इति द्विगुसमासान्तगतेति गोशब्दादकारस्समासान्तः। पञ्चानां गवां समाहारः पञ्चगवम्। पूर्ववदकारसमासान्तः। पञ्चानां नदीनां समाहारः पञ्चनदम्। संख्याया नदीगोदावर्योरिति नदीशब्दादकारः समासान्तः इवर्णावर्णाविति ईकारलोपः द्विगुसंज्ञया क्व प्रयोजनम्? द्विगोरित्यत्र।"
        - sutraNo: "2.3.7"
          textDevanagari: "तत्पुरुषावुभौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "उभौ कर्मधारयः द्विगुश्च तत्पुरुषौ भवतः। कुत्सितश्चासौ अश्वः कदश्वः। एवं कदर्यः कर्मधारयस्य तत्पुरुषत्वात् कोः कत् इति कत् आदेशः। पञ्चानां गवां समाहारः पञ्चगवम्। द्विगुसमासस्य तत्पुरुषत्वाद्गोरतद्धितलुकीति टच् समासान्तः। सखिराजशब्दाभ्यां तत्पुरुष एव स्मर्यते। पञ्चानां राज्ञां समाहारः पञ्चराजी। द्विगोरिति ईप्रत्ययः। ईकारे स्त्रीकृतेल्लोप्य इति अकारलोपः।"
        - sutraNo: "2.3.8"
          textDevanagari: "विभक्तयो द्वितीयाद्या नाम्ना परपदेन तु समस्यन्ते समासो हि ज्ञेयस्तत्पुरुषस्स च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यत्र समासे द्वितीयाद्या विभक्तयो द्वितीयादिविभक्तान्तानि पदानि परपदेन नाम्ना समस्यन्ते स समासस्तत्पुरुषसंज्ञो ज्ञेयः ज्ञातव्यः। धर्मं श्रितः धर्मश्रितः। शङ्कुलया खण्डः शङ्कुलाखण्डः। यूपाय दारु यूपदारु। वृकेभ्यो भयं वृकभयम्। राज्ञः पुरुषः राजपुरुषः। अक्षेषु शौण्डः अक्षशौण्डः। परपदेनेतिकिम्? गतो ग्रामम्। तत्पुरुषसंज्ञया क्व प्रयोजनम्? नस्य तत्पुरुषे लोप इत्यत्र।"
        - sutraNo: "2.3.9"
          textDevanagari: "स्यातां यदि पदे द्वे तु यदि वा स्युर्बहून्यपि तान्यन्यस्य पदस्यार्थे बहुव्रीहिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यत्र समासे द्वे पदे स्यातां यदि वा बहूनि पदानि स्युः तानि पदानि अन्यस्य पदस्यार्थे वाच्ये सति समस्यन्ते स समासो बहुव्रीहिसंज्ञो भवति। दण्डैश्च दण्डैश्च यद्युद्धं तद्दण्डादण्डि इच्कर्मव्यतिहारे इति इच् समासान्तः। आकारो महतः कार्य इति कार्यग्रहणादाकारः इवर्णावर्णलोपः अव्ययं एतत् अव्ययाच्चेति सिलोपः। आरूढो वानरो यं वृक्षं सः आरूढवानरो वृक्षः। सहपुत्रेण वर्तते यः स सपुत्रः। सहभार्यया वर्तते यः स सभार्यः। ङिरौसपूर्व इति ज्ञापकात्सहशब्दस्य सभावः गोस्त्रियोरुपसर्जनस्येति उत्तरपदस्य ह्रस्वः। कृतः उपकारो येन स कृतोपकारः। रोचितो मोदको यस्मै स रोचितमोदकः। उद्धृतः ओदनो यस्या सा उद्धृतौदना स्थाली। चित्रा गावो यस्य स चित्रगुः। पुंवद्भाषितपुंंस्का इति चित्राशब्दस्य ह्रस्वः। शुद्धं जलं यस्याः सा शुद्धजला नदी। आसन्नाः दशानां ये ते आसन्नदशाः। एवं आसन्नविंशः आसन्नत्रिंशः। बहुव्रीहौ संख्येये डच् बहुगणादिति डच्। समासान्तः डानुबन्धेन्त्यस्वरादेर्लोपः बहूनि पदानि यथा। मत्ताः बहवो मातङ्गाः यत्र तत् मत्तबहुमातङ्गं वनम्। बहुव्रीहिसंज्ञया क्व प्रयोजनम्? बहुव्रीहौ चेत्यादिषु।"
        - sutraNo: "2.3.10"
          textDevanagari: "विदिक्तथा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "विदिग्यत्र अन्यपदार्थाः स समासो बहुव्रीहिसंज्ञो भवति। दक्षिणस्याश्च पूर्वस्याश्च दिशो र्यदन्तरालं विदिक् सा दक्षिणपूर्वा। एवं उत्तरपूर्वा पूर्वोत्तरा पूर्वदक्षिणा दक्षिणपश्चिमा इत्याद्या उदाहार्याः। सर्वनाम्नो वृत्तिमात्रेण इति पूर्वपदानां पुंवद्भावः।"
        - sutraNo: "2.3.11"
          textDevanagari: "द्वन्द्वः समुच्चयो नाम्नोर्बहूनां वापि यो भवेत्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "एकस्यां क्रियायां अनेनकर्मादिसम्बन्धः समुच्चयः। यत्र समासेद्वयोर्नाम्निोः बहूनां वा नाम्नां समुच्चयः स समासो द्वन्द्वसंज्ञो भवति। स च द्वयोः अर्थयोरिष्यते। समाहारे इतरेतरयोगे च। यत्र समूहप्राधान्यं स समाहारः। यत्र पृथक्स्थितानां पदार्थानां स इतरेतरयोगः। पदार्थानां नित्यसंयोगो वा तत्र प्रायशः। प्राण्यङ्गानां सेनाङ्गानां तूर्याङ्गानां येषामस्थिरहितं शरीरं दृश्यते तेषां क्षुद्रजन्तूनां च समूहेनैव स्थितिदर्शनात्समाहार एव द्वन्द्वो भवति। पाणी च पादौ च तत्पाणिपादम्। शिरोग्रीवम्। जङ्घोरु। इति प्राण्यङ्गानाम्। तूर्याङ्गानां यथा मार्दङ्गिपाणविकम् वांशिकवैणविकम्। सेनाङ्गानां यथा हस्त्यश्वम् रथिकाश्वारोहम्। क्षुद्रजन्तूनां यथा यूकालिक्षम् दंशमषकम् अप्राणिनामपि फलादीनाम् प्रायशः समूहवृत्तित्वात्समाहार एव। बदरामलकम् आराशस्ति स्वरो ह्रस्वो नपुंसके इति ह्रस्वः। प्राणिनां तु पृथग्वृत्तित्वादितिरेतरयोग एव ब्राह्मणक्षत्रियौ। नित्यवैरिणां तुपरस्परविरोधात्समूहवृत्तित्वाभावेऽपि समाहार एव। येषां च विरोधः शाश्वतिक इति तन्त्रान्तरात् अहिनकुलम् मूषिकमार्जारम् बिडालोन्दुरुम्। एवमन्यत्रापि लक्ष्यानुसारेण समाहारे इतरेतरयोगे द्वन्द्वसमासो ज्ञेयः।"
        - sutraNo: "2.3.12"
          textDevanagari: "अल्पस्वरतरं तत्र पूर्वम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तत्र द्वन्द्वे यदल्पस्वरतरं तत्पूर्वमेव प्रयोज्यम्। धवखदिरौ प्लक्षन्यग्रोधौ तण्डुलकिण्वे उलूखलमुसले इत्यादौ पूर्वनिपातः। अर्चितत्वात्तरग्रहणाल्लघ्वक्षरस्य पूर्वानिपातः। कुशकाशम् अग्निसज्ञकस्य पूर्वनिपातः द्वन्द्वे घि इति तन्त्रान्तरात् अग्नीषोमौ ईदग्नेः सोमवर्णयोरितितन्त्रान्तरात् ईत्वम् अग्नेस्तुत्स्तोमसोम इति षत्वम्।"
        - sutraNo: "2.3.13"
          textDevanagari: "यच्चार्चितं द्वयोः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "द्वयोः नाम्नोः द्वन्द्वे यदर्शितं पूजितं तत्पूर्वमेव प्रयोज्यम् वासुदेवार्जुनौ मातापितरौ पितापुत्रौ। आनङ्यतो द्वन्द्व इति पूर्वपदान्त्य ऋकारस्यात्वम् ब्राह्मणक्षत्रियौ सूर्याचन्द्रमसौ देवताद्वन्द्वे चेति पूर्वपदान्त्यस्यात्वम्। जायापती भार्यापती अत्रापि पतिर्जायां प्रविशति गर्भो भूत्वेह जायते जायायाः तद्विजायात्वं यदस्यां जायते पुनरिति स्मरणाज्जायायाः अर्चितत्वम्। चशब्दात् क्वचिदनर्चितस्यापि पूर्वनिपातः। चन्द्रार्कौ शुक्रबृहस्पती कालकामौ काकमयूरौ शत्रुमित्रे इत्यादि द्वयोरितिकिं? सर्वज्वरान् घ्नन्तु तवानिरुद्रप्रद्युम्नसङ्कर्षणवासुदेवाः इति।"
        - sutraNo: "2.3.14"
          textDevanagari: "पूर्वं वाच्यं भवेद्यस्य सोव्यययीभाव इष्यते"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यस्य समासस्य पूर्वं पूर्वपदार्थो वाच्यं प्रधानं भवेत् स समासः अव्ययीभावसंज्ञ इष्यते। समीपं कुम्भस्य उपकुम्भम्। समृद्धिः कर्तृणां सुकर्तृ। अभावः पापानाम् अपापम्। अत्ययः शीतानाम् अतिशीतम्। पश्चाद्रथस्य अनुरथम्। विधिमनतिक्रम्य यथाविधि। स्थाने स्थाने यथास्थानम्। योयःस्वः यथास्वम्। येन येन प्रकारेण यथायथम्। इतिनिपातनात् आकारस्य ह्रस्वः। अवययीभावसंज्ञया क्व प्रयोजनम् अव्ययीभावादकारान्ताद्विभक्तीनामपञ्चम्या इत्यादिषु।"
        - sutraNo: "2.3.15"
          textDevanagari: "स नपुंसकलिङ्गः स्यात्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सोव्ययीभावसमासो न पुंसकलिङ्गो भवति। उक्तान्युदाहरणानि उपकुम्भमित्यादीनि।"
        - sutraNo: "2.3.16"
          textDevanagari: "द्वन्द्वैकत्वम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "द्वन्द्वस्य यदेकत्वं समाहारस्तत् नपुंसकलिङ्गं भवति पाणिपादम् बदरामलकम्।"
        - sutraNo: "2.3.17"
          textDevanagari: "तथा द्विगोः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "द्विगोः समासस्य नपुंसकत्वं भवति तथानेनैव प्रकारेण येनैवद्वन्द्वस्येत्यर्थः। पञ्चानां नदीनां समाहारः पञ्चनदम्। दशानां गवां समारारः दशगवम्। सङ्ख्याया नदीगोदावर्योः गोरतद्धितलुकीति च। अकारः समासान्तः। समाहारादन्यत्र यो द्विगुस्तस्य न भवति। पञ्चसु कपालेषु संकृतः पुरोडाशः पञ्चकपालः।"
        - sutraNo: "2.3.18"
          textDevanagari: "पुंवद्भाषितपुंस्कारूनूङपूरण्यादिषु स्त्रियां तुल्याधिकरणे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "भाषितपुंस्कायास्त्रीविशेषणं स्त्रीलिङ्गं अनूङ् रूङ्प्रत्ययरहितं मास्त्रीलिङ्गे पूरण्यदिवर्जिते तुल्याधिकरणे टाकद्रव्यविषये तुत्तरपदेपरेपुंवद्भवति पुंसियद्रूपंतदापद्यते इत्यर्थः दर्शनीयाभार्गायस्यसदर्शनीयभार्यः उत्तरपदस्यगोस्त्रियोरुपसर्जनस्य इति ब्रस्वः कल्याणीभार्याययम्यसकल्याणभार्यः एवं स्वरूपभार्यः भाषितपुंस्केतिकिम्? खट्वाभार्यायस्यसखट्वाभार्यः स्त्रीलिङ्गनिर्देशः किम्? अतिरिक्तलंगतिर्यस्यस अतिरिगतिः अतिनुजलं गतिर्यस्य स अतिनुगतिः पुंवद्भावेन ह्रस्वनिवृत्तिः स्यात् अनूज् इति किम्? ब्रह्मबन्धूभार्या यस्य स ब्रह्मबन्धूभार्यः ब्रह्मबन्धुशब्दात् रूङुतइत्प्रङ् ङकारः इहार्थः अपूरण्यदिष्वितिकिम्? कल्याणीपङ्चमीयासांताः कल्याणीपञ्चमारात्रयः अम्पूरण्योप्रामाण्योरित्यप् समासान्तः इवर्णावर्णलोपः स्त्रियामिति किम्? कल्याणीप्रधानं यासां ताः कल्याणीप्रधानाः तुल्याधिकरणे इति किं? कल्याण्यदुहिताकल्याणीदुहिताः।"
        - sutraNo: "2.3.19"
          textDevanagari: "संज्ञापूरणीकोपधात्तु न"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "संज्ञाभूतापूरणप्रत्ययान्ताककारोपधा च भाषितपुंस्का पुंवन्न भवति स्त्रीलिङ्गे तुल्याधिकरणे पदे पूर्वेणप्राप्तिः दत्ताभार्यायस्य स दत्ताभार्यः पाचिकाभार्यः पञ्चमीभार्यः नागरिकाभार्यः गाषिकाभार्यः नर्तकीभार्यः।"
        - sutraNo: "2.3.20"
          textDevanagari: "कर्मधारयसंज्ञे तु पुंवद्भावो विधीयते"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "संज्ञापूरणीकोपधानां कर्मधारयसंज्ञे समासे तुल्याधिकरणे स्त्रीलिङ्गे पूरण्यादिवर्जिते उत्तरपदेपरे पुंवद्भावो विधीयते पूर्वेण निषेधः यः प्राप्तः दत्ताचासौवृन्दारिका दत्तवृन्दारिका। पञ्चमवृन्दारिका।"
        - sutraNo: "2.3.21"
          textDevanagari: "आकारोमहतःकार्यस्तुल्याधिकरणे पदे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "महदित्यस्य आकारः कार्यः तुल्याधिकरणे पदे परे महांश्चासौ देवः महादेवः। महान् कायो यस्य स महाकायः तुल्याधिकरणे इति किम्? महतः पुत्रो महत्पुत्रः। कार्यग्रहणादन्यत्रापि पूर्वपदस्यात्वं भवति दण्डैश्च दण्डैश्च यद्युद्धं तद्दण्डादण्डि मातापितरौ पितापुत्रौ एकादश।"
        - sutraNo: "2.3.22"
          textDevanagari: "नस्य तत्पुरुषे लोपः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नस्यपदस्य तत्पुरुषे प्रसिद्धस्य उत्तरपदे परे नकारस्य लोपो भवति नब्राह्मणः अब्राह्मणः नवृषलः अवृषलः पदस्येति किम्? वामनपुत्रः।"
        - sutraNo: "2.3.23"
          textDevanagari: "स्वरेक्षरविपर्ययः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अतरयोर्विपर्ययः अक्षरविपर्ययः नस्यपदस्य अक्षरविपर्ययीभवति स्वरे परे न अश्वः अनश्वः न उष्ट्रः अनुष्ट्रः।"
        - sutraNo: "2.3.24"
          textDevanagari: "कोः कत्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कुशब्दस्य तत्पुरुषे प्रसिद्धस्य कत् आदेशो भवति स्वरे परे कुत्सितश्चासौवश्च कदश्वः तत्पुरुषे इति किम्? कुत्सित ऊष्मा अण्डे यस्य स कूण्माण्डः।"
        - sutraNo: "2.3.25"
          textDevanagari: "का त्वीषदर्थे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ईषदर्थे वर्तमानस्य कुशब्दस्य का आदेशो भवति ईषन्मधुरम् कामधुरम् एवं कालवणं काम्बम् ईष्दर्थे इति किम्? कुत्सितो देशः कुदेशः।"
        - sutraNo: "2.3.26"
          textDevanagari: "अक्षे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अक्षशब्दे उत्तरपदे परे कुशब्दस्य काआदेशो भवति। अनीषदर्थं वचनम् कुत्सितः अक्षः काक्षः।"
        - sutraNo: "2.3.27"
          textDevanagari: "पुरुषे तु विभाषया"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कुशब्दस्य पुरुषशब्दे परे काआदेशो भवति विभाषया विकल्पेन कुत्सितः पुरुषः कापुरुषः कुपुरुषो वा।"
        - sutraNo: "2.3.28"
          textDevanagari: "याकारौस्त्रीकृतौह्रस्वौक्वचित्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्त्रियां कृतौ स्त्रीकृतौ ईकारआकारौ उत्तरपदे परे ह्रस्वौ भवतः क्वचित् न सर्वत्र रेवति मित्रः रोहिणिदत्तः इष्टकाइषीका मालाएषांयथासंख्यं सचितसूलभारिन् एषु उत्रपादेषु परेषु अन्त्यस्य ह्रस्वो भवति इष्टकेषीकामालानां चितरुलभारिथितितन्त्रान्तरात् इष्टकामिश्चितम् इष्टकाचितम् इषीकायास्थूलं इषीकरूलम् मालां बिभर्तीति मालभारिणीकत्या क्वचिदिति वचनात् इहन भवति लक्ष्मीतरातन्त्रीकल्पा।"
        - sutraNo: "2.3.29"
          textDevanagari: "ह्रस्वस्य दीर्घता"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ह्रस्वस्य क्वचिद्दीर्घता भवति दीर्घो भवतीत्यर्थः अष्टसुकपालेषु संस्कृतः पुरोडाशः अष्टाकपालः द्व्यङ्गुलौकर्णौ यस्य स द्व्यङ्गुलाकर्णः एवं द्विगुणाकर्णः क्वचिदितिवचनादिहनभवति छिन्नकर्णः भिन्नकर्णः स्रुवकर्णः स्वस्तिकर्णः।"
        - sutraNo: "2.3.30"
          textDevanagari: "अनव्ययविसृष्टस्तुसकारं कपवर्गयोः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अनव्ययशब्दस्य विसृष्टो विसर्जनीयः कपवर्गयोः परयोः क्वचित्सकारमापद्यते जिह्वामूलीयोपध्मानीययोर्वाधः अनुन्तरपदस्थादकारात्परस्य विसर्जनीयस्य कृकमिकं स कुम्भपात्रकुशाकर्ण एषु परेषु समासे सतिः अतः कृकमिकं स कुम्भाकुशाकर्णेष्वनव्ययस्येति तन्त्रान्तरात् कृ अयस्कारः कामि अयस्कामः कंस अयस्कंसः कुम्भ अयस्कुम्भ पात्र अयस्पात्रम् कुशा अयस्कुशा कर्ण अयस्कर्णः उत्तरपदस्थात्तु अकारात् परस्य विसर्जनीयस्य न भवति उपयःकामः आकारादपि परस्य क्वचित्स्मर्यते भास्करः कपवर्गयोरिति कखपफा एव गृह्यन्ते तेनेह न भवति अयोघनः पयोबिन्दुः अनव्ययविसृष्ट इति किम्? स्वःकामः। अन्तःकामः। इति लघुवृत्तौ नामप्रकरणे समासपादः पञ्चमः॥"
    - padaId: "2-4"
      padaNo: "2.4"
      padaNameDevanagari: "तद्धितपादः"
      sutras:
        - sutraNo: "2.4.1"
          textDevanagari: "वाणपत्ये"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अपत्येऽर्थे लिङ्गादण् प्रत्ययो वा भवति। उपगोरपत्यम् औपगवः उपगुशब्दादण् णकारो वृद्धिरादौ सणे इत्यर्थः। आदिवृद्धिः उवर्णस्त्वोत्वमापाद्य इति ओत्वम्। पक्षे उपगोरपत्यं उपग्वपत्यमिति समासवाक्ये भवतः। संख्यासंभद्रपूर्वायामातुरणि परे ऋकारस्य उरादेशो भवति। मातुरुत्संख्यासंभद्रपूर्वाया इति तन्त्रान्तरात् षाण्मातुरः सांमातुरः भाद्रमातुरः। कन्याया अणि परे कनीनादेशो कानीनो व्यासः कानीनः कर्णः।"
        - sutraNo: "2.4.2"
          textDevanagari: "ण्य गर्गादेः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "गर्गादेर्गणादपत्येऽर्थे ण्यप्रत्ययो वा भवति। गर्गस्यापत्यं गार्ग्यः वात्स्यः। पक्षे गर्गस्यापत्यं गर्गापत्यमिति। पौत्रादावपत्ये प्रत्ययोऽयं स्मर्यते तेन गर्गस्य पुत्रो गार्गिः इण्णतः इति इण्।"
        - sutraNo: "2.4.3"
          textDevanagari: "पत्यन्ताश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "प्रजापतेरपत्यं प्राजापत्यः गार्हस्पत्यः दित्यदित्योरेयण्च दैत्यः दैतेयः आदित्यः आदितेयः गर्गवत्सवजसङ्कृतिव्याघ्रपात् शाण्डिल्यमुद्गलविदभृत् इत्याद्या गर्गादयः।"
        - sutraNo: "2.4.4"
          textDevanagari: "कुञ्जादेरायनण्स्मृतः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "कुञ्जादेर्गणात् अपत्येऽर्थे आयनण् प्रत्ययोभवति। तदन्ताच्च स्वार्थे ण्यप्रत्यय इष्यते। स च स्त्रियां बहुत्वेनेष्यते। कौञ्जायन्यः कौञ्जायन्यौ कौञ्जायनाः कौञ्जायनी। एवं ब्राध्नायन्यः ब्राध्नायन्यौ ब्राध्नायनाः ब्राध्नायनी जातेरयोपधादिति ईप्रत्ययः कुञ्जब्रध्नरणनभचरलिगुलोह इत्याद्या कुञ्जादयः।"
        - sutraNo: "2.4.5"
          textDevanagari: "स्त्र्यत्र्यादेरेयण्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्त्रीप्रत्ययान्तेभ्यः अत्र्यादिभ्यश्च अपत्येर्थे एयण्प्रत्ययो भवति सुपर्णाया अपत्यं सौपर्णेयः वैनतेयः गाङ्गेयः नद्या अपत्यं नादेयः एवं माहेयः रौहिणेयः अत्र्यादिभ्यः आत्त्रेयः नैधेयः पितृस्वसृमातृस्वसृभ्यामेयण् ईवर्णौ इष्येते एयणि वानुलोपश्च पितृष्वसुरपत्यं पैतृश्वस्रेयः पैतृश्वसेयः पैतृश्वस्रीयः। एवं मातृश्वस्रेयः मातृश्वसेयः मातृश्वस्रीयः कल्याण्यादीनामेयणिपरे अन्त्यस्य इनादेशो भवति कल्याण्यादीनामिनङ्ङितितन्त्रान्तरात् कल्याण्या अपत्यं काल्याणिनेयः सुभगाया अपत्यं सौभागिनेयः हृद्भगसिन्ध्वन्ते पूर्वपदस्येति तन्त्रान्तादुभयपदवृद्धिः अत्त्रिनिधिशुद्धविष्टिमृकाण्डकृक्रतास इत्याद्या अत्त्र्यादयः।"
        - sutraNo: "2.4.6"
          textDevanagari: "इण्णतः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अतः अकारान्तात् लिङ्गादपत्येर्थे इण् प्रत्ययो भवति दक्षस्यापत्यं दाक्षिः प्लाक्षिः।"
        - sutraNo: "2.4.7"
          textDevanagari: "बाह्वादेश्चविधीयते"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "बाह्वादेर्गणात् अपत्येर्थे इण् भवति बाहोरपत्यं बाहविः औपचाकविः औपबिन्दविः बालाकिः सौमित्त्रिः औडुलोमिः शारलोमिः पौष्करसादिः उडुलोमन् शरलोमन् इत्येतयोः नस्य तुक्वचिदिति नलोपः पुष्करसद् शब्दस्य अनुशतिकादीनां चेत्युभयपदवृद्धिः जाङ्घिः दैवशर्मिः सुधातृव्यासवरुटनिषादचण्डालबिम्बानामिनिपरे अन्त्यस्य अक आदेश इष्यते सुधातुरपत्यं सौधातकिः वैयासकिः य्वौर्वृद्धिरागम इति यकारात्पूर्वम् ऐकारागमः वारुटकिः नैषादकिः चाण्डालकिः बैम्बकिः बाहु उपचाक्वः उपबिन्दुः बलाका सुमित्त्रा उडुलोमन् शरलोमन् पुष्करसद् जङ्घादेवशर्मन् इत्यादयोबाह्वादयः।"
        - sutraNo: "2.4.8"
          textDevanagari: "रागात्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "राज्यतेयेन स रागः रागवाचिनः शब्दात् अण् भवति। तेन रक्तमित्यत्रार्थे कषायेण रक्तं काषायम् कुसुम्भेन रक्तं कौसुम्भम् कौङ्कुमम् हारितालम्।"
        - sutraNo: "2.4.9"
          textDevanagari: "नक्षत्रयोगाच्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "६०, १०० \\end{document}"
