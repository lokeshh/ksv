- prakaranaId: "sandhi"
  prakaranaNameDevanagari: "सन्धि-प्रकरणम्"
  padas:
    - padaId: "1-1"
      padaNo: "1.1"
      padaNameDevanagari: "संज्ञापादः"
      sutras:
        - sutraNo: "1.1.1"
          textDevanagari: "सिद्धो वर्णसमाम्नायः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "वर्णानाम् अकारादीनां वर्णानां यः समाम्नायः क्रमेण पाठः सः सिद्धः प्रसिद्धः लोके इति किं तेनोपदिष्टेन आविद्वदङ्गनागोपालबालपर्यन्तं यावत्। वर्णाः ४९– अआ इई उऊ ऋॠ ऌॡ एऐ ओऔ अं अः कखगघङ चछजझञ टठडढण तथदधन पफबभम यरलव शषसह। वर्णसंज्ञया क्व प्रयोजनम्? सर्वत्र।"
        - sutraNo: "1.1.2"
          textDevanagari: "तत्र चतुर्दशादौ स्वराः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तत्र प्रसिद्धे वर्णसमाम्नाये आदौ ये चतुर्दश वर्णाः ते स्वरसंज्ञा भवन्ति। स्वराः १४– अआ इई उऊ ऋॠ ऌॡ एऐ ओऔ स्वरसंज्ञया क्व प्रयोजनम्? रो रे लोपं स्वरश्च पूर्वो दीर्घ इत्यादिषु।"
        - sutraNo: "1.1.3"
          textDevanagari: "दश समानाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तत्र प्रसिद्धे वर्णसमाम्नाये आदौ ये दशवर्णाः ते समानसंज्ञा भवन्ति। समानाः १०– अआ इई उऊ ऋॠ ऌॡ समानसंज्ञया क्व प्रयोजनम्? समानः सवर्णे दीर्घीभवति परश्चलोपमित्यादिषु।"
        - sutraNo: "1.1.4"
          textDevanagari: "तेषां द्वौ द्वावन्योऽन्यस्य सवर्णौ"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तेषां दशानां समानानां मध्यात् यौ द्वौ द्वौ वर्णौ तौ अन्योऽन्यस्य परस्परं सवर्णसंज्ञौ भवतः। सवर्णाः १०– अआ इई उऊ ऋॠ ऌॡ कः कस्य सवर्णः? अकास्य आकारः सवर्णः। आकारस्य अकारः सवर्णः। उकारस्य ऊकारः सवर्णः। ऊकारस्य उकारः सवर्णः। ऋकारस्य ॠकारः सवर्णः। ॠकारस्य ऋकारः सवर्णः। ऌकारस्य ॡकारः सवर्णः। ॡकारस्य ऌकारः सवर्णः। सवर्णसंज्ञया क्व प्रयोजनम्? समानः सवर्णे दीर्घीभवति परश्चलोपमित्यादिषु।"
        - sutraNo: "1.1.5"
          textDevanagari: "पूर्वो ह्रस्वः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तयोः द्वयोर् द्वयोः सवर्णयोः यो यः पूर्वो वर्णः स ह्रस्वसंज्ञो भवति। ह्रस्वाः ५ – अइउऋऌ। ह्रस्वसंज्ञया क्व प्रयोजनम्? ह्रस्वो स्वार्थानामित्यादिषु।"
        - sutraNo: "1.1.6"
          textDevanagari: "पूर्वस्य लघुसंज्ञापि वक्तव्या"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "लघवः ५ – अइउऋऌ। लघुसंज्ञया क्व प्रयोजनम्? नामिनश्चापधायालघोरित्यादिषु।"
        - sutraNo: "1.1.7"
          textDevanagari: "परो दीर्घः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "तयोः द्वयोर् द्वयोः सवर्णयोः यो यः परः स दीर्घसंज्ञो भवति। दीर्घाः ५ – आईऊॠॡ। दीर्घसंज्ञया क्व प्रयोजनम्? दीर्घमामिसनावित्यादिषु।"
        - sutraNo: "1.1.8"
          textDevanagari: "परस्य गुरुसंज्ञापि वक्तव्या"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "गुरवः ५ - आईऊॠॡ। गुरुसंज्ञया क्व प्रयोजनं गरोश्चनिष्टायां सेट इत्यादिषु।"
        - sutraNo: "1.1.9"
          textDevanagari: "स्वरो ऽवर्णवर्जो नामी"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अवर्णः अकाराकारौ तौ वर्जयित्वा शिष्टः स्वरः नामिसंज्ञो भवति। नामिनः १२ – इई उऊ ऋॠ ऌॡ एऐ ओऔ। नामिसंज्ञया क्व प्रयोजनम्? नामिनः स्वरे इत्यादिषु।"
        - sutraNo: "1.1.10"
          textDevanagari: "एकारादीनि सन्ध्यक्षराणि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "एकारादीनि वर्णानि सन्ध्यक्षरसंज्ञा भवन्ति। सन्ध्यक्षराणि ४ – एऐओऔ। सन्ध्यक्षसंज्ञया क्व प्रयोजनम्? सन्ध्यक्षरान्तानाम् आकारो विकरण इत्यादिषु।"
        - sutraNo: "1.1.11"
          textDevanagari: "कादीनि व्यञ्जनानि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ककारादीनि वर्णानि व्यञ्जनसंज्ञानि भवन्ति। व्यञ्जनानि ३३ – कखगघङ चछजझञ टठडढण तथदधन पफबभम यरलव शषसह। व्यञ्जनसंज्ञया क्व प्रयोजनं मोऽनुस्वारं व्यञ्जन इत्यादिषु।"
        - sutraNo: "1.1.12"
          textDevanagari: "ते वर्गाः पञ्चपञ्चशः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ते कादयो वर्णाः पञ्चपञ्चशः पञ्चपञ्चाक्षराणि भूत्वा वर्गा उच्यन्ते। वर्गाः ५ – कचटतप। वर्ग्याः २५ – कवर्गः - कखगघङ चवर्गः - चछजझञ टवर्गः - टठडढण तवर्गः - तथदधन पवर्गः - पफबभम। वर्गसंज्ञया क्व प्रयोजनम्? वर्ग्ये तद्वर्गपञ्चमं वेत्यादिषु।"
        - sutraNo: "1.1.13"
          textDevanagari: "वर्गाणां प्रथमद्वितीयाः शषसाश्चाघोषाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "वर्गाणां ये प्रथमद्वितीयावर्णाः तथा शषसाश्च ते अघोषसंज्ञा भवन्ति। अघोषाः १३ – कख चछ टठ तथ पफ शषस। अघोषसंज्ञया क्व प्रयोजनम्? अघोषे प्रथम इत्यादिषु।।"
        - sutraNo: "1.1.14"
          textDevanagari: "घोषवन्तोऽन्ये"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अघोषेभ्यः येऽन्ये वर्णास् ते घोषवत्संज्ञा भवन्ति। घोषवन्तः २० – गघङ जझञ डढण दधन बभम यरलवह। घोषवत्संज्ञया क्व प्रयोजनम्? अकारो दीर्घं घोषवतीत्यादिषु।।"
        - sutraNo: "1.1.15"
          textDevanagari: "अनुनासिका ङञणनमाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ङञणनमा वर्णाः अनुनासिकसंज्ञा भवन्ति। अनुनासिका ५ – ङञणनम। अनुनासिकसंज्ञया क्व प्रयोजनम्? अतोन्तोनुस्वारोनुनासिकान्तस्येत्यादिषु।।"
        - sutraNo: "1.1.16"
          textDevanagari: "अन्तःस्था यरलवाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "यरलवा वर्णाः अन्तस्थसंज्ञा भवन्ति। अन्तःस्थाः ४ – यरलव। अन्तःस्थसंज्ञया क्व प्रयोजनम्? स परस्वरायासंप्रसारणमन्तःस्थाया इत्यादिषु।।"
        - sutraNo: "1.1.17"
          textDevanagari: "ऊष्माणः शषसहाः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "शषसह वर्णा ऊष्मसंज्ञा भवन्ति। ऊष्माणः – ४ शषसह। ऊष्मसंज्ञायाः प्रयोजनं नास्तीत्यपार्थकोयं योगारम्भ इत्याहुः।"
        - sutraNo: "1.1.18"
          textDevanagari: "अः इति वसर्जनीयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारात्परं बिन्दुद्वयं विसर्जनीयसंज्ञं भवति। विसर्जनीयसंज्ञया क्व प्रयोजनम्? विसर्जनीयश्छेछोवाशमित्यादिषु।।"
        - sutraNo: "1.1.19"
          textDevanagari: "ᳳक इति जिह्वामूलीयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ककारात् पूर्वोवर्णः जिह्वामूलीयसंज्ञोभवति। जिह्वामूलीयः कीदृशः? यवाकृतिसदृशः। जिह्वामूलीयसंज्ञया क्व प्रयोजनम्? कखयो जिह्वामूलीयं नवेत्यादिषु।।"
        - sutraNo: "1.1.20"
          textDevanagari: "ᳲप इत्युपध्मानीयः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "पकारात्पूर्वो वर्णः उपध्मानीयसंज्ञो भवति। उपध्मानीयः कीदृशः हस्तिकवाटसदृशः। उपध्मानीयसंज्ञया क्व प्रयोजनम्? पफयोरुपध्मानीयं नवेत्यादिषु।।"
        - sutraNo: "1.1.21"
          textDevanagari: "अं इत्यनुस्वारः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अं इत्यत्रयोबिन्दुः सोsनुस्वारसंज्ञो भवति। अनुस्वारसंज्ञया क्व प्रयोजनम्? मोनुस्वारं व्यञ्जने इत्यादिषु।।"
        - sutraNo: "1.1.22"
          textDevanagari: "पूर्वपरयोर् अर्थोपलब्धौ पदम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "पूर्वस्य लिङ्गस्य परस्य स्यादेः तथा पूर्वस्य धातोः परस्य त्यादेः यः समुदाय एकीभावः तस्य पदमिति संज्ञा भवति अर्थोपलब्धौ सत्याम्। पदसंज्ञया क्व प्रयोजनं? युष्मदस्मदोः पदं पदात् षष्ठीचतुर्थीद्वितीयासु वस्रसावित्यादिषु।।"
        - sutraNo: "1.1.23"
          textDevanagari: "अनतिक्रमयन् विश्लेषयेत्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "वर्णानाम् एकत्र युक्तानाम् अतिक्रमं विपर्यासं अकुर्वन् विश्लेषयेत्। येनैव क्रमेण वर्णाः संयुज्यन्ते तेनैव क्रमेण वर्णा विश्लिष्यन्ते इति परिभाष्यते। अनियमे नियमः परिभाषा।"
        - sutraNo: "1.1.24"
          textDevanagari: "व्यञ्जनम् अस्वरं परं वर्णं नयेत्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "व्यञ्जनं यत् अस्वरं स्वररहितं तत् परं वर्णं नयेत् प्रापयेत्। त्वमत्र। सत्कर्म। अहमिह।"
        - sutraNo: "1.1.25"
          textDevanagari: "लोकोपचाराद् ग्रहणसिद्धिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "लोकोपचारात् जनव्यवहारात् पूर्वाचार्यशास्त्रात् अनुक्तस्य ग्रहणस्य कार्यस्य सिद्धिर् निष्पत्तिः भवति। ये लुग्लोपप्लतादयः ये इह शास्त्रे अनुक्ताः ते अन्यशास्त्राद् अनुसारणीयाः। इति लघुवृत्तौ सन्धि प्रकणे संज्ञापादः प्रथमः॥१॥"
- prakaranaId: "nama"
  prakaranaNameDevanagari: "नाम-प्रकरणम्"
  padas:
    - padaId: "2-1"
      padaNo: "2.1"
      padaNameDevanagari: "लिङ्गपादः"
      sutras:
        - sutraNo: "2.1.1"
          textDevanagari: "धातुविभक्तिवर्जम् अर्थवल् लिङ्गम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अर्थवत् सार्थकं शब्दरूपं लिङ्गसंज्ञं भवति धातुविभक्ती वर्जयित्वा। लिङ्गसंज्ञया क्व प्रयोजनम्? लिङ्गान्तनकारस्येत्यादिषु। राजा।"
        - sutraNo: "2.1.2"
          textDevanagari: "तस्मात् परा विभक्तयः।"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सि औ जस् अम् औ शम् टा भ्याम् भिस् ङे भ्याम् भ्यस् ङसि भ्याम् भ्यस् ङस् ओस् आम् ङि ओस् सुप्। तस्मात् लिङ्गात् पराः स्यादयः सप्तविभक्तयो भवन्ति। सि औ जस् इति प्रथमा। अम् औ शस् इति द्वितीया। टा भ्याम् भिस् इति तृतीया। ङे भ्याम् भ्यस् इति चतुर्थी। ङसि भ्याम् भ्यस् इति पञ्चमी। ङस् ओस् आम् इति षष्ठी। ङि ओस् सुप् इति सप्तमी। आमन्त्रणे प्रथमैवाष्टमी। वृक्षः वृक्षौ वृक्षाः। वृक्षम् वृक्षौ वृक्षान्। वृक्षेण वृक्षाभ्याम् वृक्षैः। वृक्षाय वृक्षाभ्याम् वृक्षेभ्यः। वृक्षात् वृक्षाभ्याम् वृक्षेभ्यः। वृक्षस्य वृक्षयोः वृक्षाणाम्। वृक्षे वृक्षयोः वृक्षेषु। आमन्त्रणे हे वृक्ष हे वृक्षौ हे वृक्षाः। विभक्तिसंज्ञया क्व प्रयोजनम्? एषां विभक्तावन्तलोप इत्यादिषु।"
        - sutraNo: "2.1.3"
          textDevanagari: "पञ्चादौ घुट्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "स्यादीनाम् आदौ ये पञ्चप्रत्ययाः ते घुट् संज्ञा भवन्ति। घुट् ५ – सि औ जस् अम् औ। घुट्संज्ञया क्व प्रयोजनम्? घुटिचासम्बुद्धावित्यादिषु। राजा राजानौ राजानः राजानं राजानौ पञ्चेति। किं राज्ञः पश्य।"
        - sutraNo: "2.1.4"
          textDevanagari: "जस्शसौ नपुंसके"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "नपुंसकलिङ्गे जस् शस् इत्येतौ घुट्संज्ञौ भवतः। घुट् २ – जस् शस्। घुट्संज्ञया क्व प्रयोजनम्? घुटिचासस्बुद्धावित्यादिषु। सामानि रम्याणि। सामानि पठन्ति।"
        - sutraNo: "2.1.5"
          textDevanagari: "आमन्त्रिते सिः सम्बुद्धिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "आमन्त्रितम् आह्वानम् आमन्त्रितेsर्थे यः सिप्रत्ययः स सम्बुद्धिसंज्ञो भवति। सम्बुद्धिसंज्ञया क्व प्रयोजनम्? सम्बुद्धौ चेत्यादिषु। हे गङ्गे। हे यमुने।"
        - sutraNo: "2.1.6"
          textDevanagari: "आगम उदनुबन्धः स्वराद् अन्त्यात् परः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "उदनुबन्धः उकारानुबन्धः आगमः अन्त्यात् स्वरात् परो भवति। अनड्वान्।"
        - sutraNo: "2.1.7"
          textDevanagari: "तृतीयादौ तु परादिः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "उदनुबन्धः आगमः तृतीयादौ विभक्तिगणे परे परस्य प्रत्ययस्यादिर् अवयवो भवति सर्वेषाम्।"
        - sutraNo: "2.1.8"
          textDevanagari: "इदुदग्निः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "इकारान्तः शब्दः उकारान्तः शब्दश्च अग्निसंज्ञो भवति। अग्निसंज्ञया क्व प्रयोजनम्? अग्नेरमोकार इत्यादुषु। अग्निं। पटुं। बुद्धिं। धेनुम्।"
        - sutraNo: "2.1.9"
          textDevanagari: "ईदूत् स्त्र्याख्यौ नदी"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "ईकारान्तः ऊकारान्तश्च शब्दः स्त्र्याख्यौ स्त्रीवाचकौ नदीसंज्ञौ भवतः। नदीसंज्ञया क्व प्रयोजनम्? नद्याएआसामामित्यादुषु। नद्यै। नद्याः। नद्याः। नद्यां। वध्वै। वध्वाः। वध्वाः। वध्वाम्।"
        - sutraNo: "2.1.10"
          textDevanagari: "आ श्रद्धा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "आकारान्तः शब्दः स्त्रीवाचकः श्रद्धासंज्ञो भवति। श्रद्धासंज्ञया क्व प्रयोजनम्? श्रद्धायाः सिलोपमित्यादिषु। गङ्गा। या। सा। का।"
        - sutraNo: "2.1.11"
          textDevanagari: "अन्त्यात् पूर्व उपधा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अन्त्याद् वर्णात् पूर्वो वर्ण उपधासंज्ञो भवति। उपधासंज्ञया क्व प्रयोजनम्? नान्तस्य चोपधाया इत्यादिषु। पञ्चानाम्। सप्तानाम्। दशानाम्।"
        - sutraNo: "2.1.12"
          textDevanagari: "व्यञ्जनान्नोनुषङ्गः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अन्त्याद् व्यञ्जनात् पूर्वो नकारः अनुषङ्गसंज्ञो भवति। अनुषङ्गसंज्ञया क्व प्रयोजनम्? अनुषङ्गश्चाकुञ्चेरित्यादिषु। विदुषः। महतः।"
        - sutraNo: "2.1.13"
          textDevanagari: "धुड् व्यञ्जनम् अनन्तस्थानुनासिकम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "व्यञ्जनम् धुट्संज्ञं भवति अन्तःस्थानुनासिकान्वर्जयित्वा। धुट् २४ – कखगघ चछजझ टठडढ तथदध पफबभ शषसह। धुट्संज्ञया क्व प्रयोजनम्? अटान्तृतीयइत्यादिषु। अग्निमध्यां विरुद्धिः।"
        - sutraNo: "2.1.14"
          textDevanagari: "अकारो दीर्घं घोषवति"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारः लिङ्गान्तः दीर्घं प्राप्नोति घोषवदादौ विभक्तिगणे परे। वृक्षाय। देवाभ्याम्।"
        - sutraNo: "2.1.15"
          textDevanagari: "जसि"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारः लिङ्गान्तः दीर्घं प्राप्नोति जसि परे। वृक्षाः। देवाः।"
        - sutraNo: "2.1.16"
          textDevanagari: "शसि सस्य च नः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारो लिङ्गान्तः दीर्घं प्राप्नोति शसि परे शसश्च सकारस्य नत्वं भवति। वृक्षान्। देवान्।"
        - sutraNo: "2.1.17"
          textDevanagari: "अकारे लोपम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारो लिङ्गान्तः लोपं प्राप्नोति विभक्तिसम्बन्धिन्यकारे परे। वृक्षम्। देवम्।"
        - sutraNo: "2.1.18"
          textDevanagari: "भिस् ऐस् वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकाराल् लिङ्गान्तात् परो भिस्प्रत्ययः ऐसादेशं प्राप्नोति। वृक्षैः देवैः।"
        - sutraNo: "2.1.19"
          textDevanagari: "धुटि बहुत्वे त्वे"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारो लिङ्गान्तः एत्वं प्राप्नोति बहुत्वे उत्पन्ने धुटि परे। वृक्षेभ्यः। देवेषु।"
        - sutraNo: "2.1.20"
          textDevanagari: "ओसि च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारो लिङ्गान्तः एत्वं प्राप्नोति ओसि परे। वृक्षयोः। देवयोः।"
        - sutraNo: "2.1.21"
          textDevanagari: "ङसिर् आत्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्ताल् लिङ्गात् परो ङसिप्रत्ययः आदादेशं प्राप्नोति। वृक्षात्। देवात्।"
        - sutraNo: "2.1.22"
          textDevanagari: "ङस् स्य"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्ताल् लिङ्गात् परः ङस्प्रत्ययः स्य संपद्यते। वृक्षस्य। देवस्य।"
        - sutraNo: "2.1.23"
          textDevanagari: "इन टा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्ताल् लिङ्गात् परः टाप्रत्ययः इनादेशं प्राप्नोति। वृक्षेण। देवेन।"
        - sutraNo: "2.1.24"
          textDevanagari: "ङेर् यः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्ताल् लिङ्गात् परः ङेप्रत्ययः यादेशं प्राप्नोति। वृक्षाय। देवाय।"
        - sutraNo: "2.1.25"
          textDevanagari: "स्मै सर्वनाम्नः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तात् सर्वनाम्नः परः ङेप्रत्ययः स्मैआदेशं प्राप्नोति। सर्वस्मै। विश्वस्मै। यस्मै। तस्मै। कस्मै। अमुष्मै। अस्मै।"
        - sutraNo: "2.1.26"
          textDevanagari: "ङसिः स्मात्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तात् सर्वनाम्नः परः ङसिप्रत्ययः स्मात् संपद्यते। सर्वस्मात्। यस्मात्। तस्मात्। कस्मात्। अमुष्मात्। अस्मात्।"
        - sutraNo: "2.1.27"
          textDevanagari: "ङि स्मिन्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तात् सर्वनाम्नः परः ङिप्रत्ययः स्मिन् संपद्यते। सर्वस्मिन् विश्वस्मिन्। यस्मिन्। तस्मिन्। कस्मिन्। अमुष्मिन्। अस्मिन्।"
        - sutraNo: "2.1.28"
          textDevanagari: "विभाष्येते पूर्वादेः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "पूर्वादेर् गणात् परयोः ङसिङ्योः स्मात् स्मिन् आदेशौ विभाष्येते विकल्पेन कथ्येते। पूर्वस्मात् वा पूर्वात्। पूर्वस्मिन् वा पूर्वे। परस्मात् वा परात्। परस्मिन् वा परे।"
        - sutraNo: "2.1.29"
          textDevanagari: "सुर् आमि सर्वतः"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "सर्वतः सर्वस्मात् अकारान्तात् आकारान्ताच्च सर्वनाम्नः आमिपरे सुरागमो भवति। सर्वेषां येषां तेषां केषां अमीषां एषाम् सर्वासां यासां तासां कासां अमूषां आसाम्।"
        - sutraNo: "2.1.30"
          textDevanagari: "जस् सर्वईम्"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अकारान्तात् सर्वनाम्नः परो जस् प्रत्ययः ईत्वं प्राप्नोति। सर्वे ये ते के अमी इमे।"
        - sutraNo: "2.1.31"
          textDevanagari: "अल्पादेर् वा"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
              textDevanagari: "अल्पादेर् गणात् परः जस् प्रत्ययः ईत्वं वा प्राप्नोति। अल्पे वा अल्पाः प्रथमे वा प्रथमाः चरमे वा चरमाः कतमे वा कतमाः।"
        - sutraNo: "2.1.32"
          textDevanagari: "पूर्वादेश्च"
          translation: ""
          commentaries:
            - nameDevanagari: "लघुवृत्तिः"
              authorDevanagari: "छुच्छुकभट्टः"
